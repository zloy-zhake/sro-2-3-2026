subject: docker
language: kk
file_chapter: 6
chapters:
- 6
chapter_titles:
- Using Docker volumes for persistent storage
levels:
  cognitive:
    heading: КОГНИТИВТІК ДЕҢГЕЙ (24 ұпай)
    points: 24
    instructions: |
      Студентке нұсқаулық.
      Әр сұраққа фрагмент берілген: Dockerfile, қолданба файлдары және
      контейнердің сақтау орнымен — жазуға болатын қабатпен (writable layer),
      томдармен (volumes) және хост каталогын байлаумен (bind mount) —
      жұмыс істейтін Docker командалары, сондай-ақ бастапқы күйдің
      сипаттамасы. Фрагменттен кейін осы фрагмент туралы 5 тұжырым берілген.
      Барлық командалар Linux орнатылған компьютерде орындалады.
      Ескеру керек Docker ережесі (кітапта жоқ): егер контейнер каталогына бос
      том (volume) — жаңа атаулы немесе анонимді том — қосылса, ал образда
      осы жол бойынша файлдар бар болса, Docker контейнерді құру кезінде осы
      файлдарды томға көшіреді. Бос емес томға ештеңе көшірілмейді. Хост
      каталогын байлауға (bind mount) бұл ереже қатысты емес.
      Әр тұжырымға «дұрыс» немесе «дұрыс емес» деп жазып, жауабыңызды
      негіздеңіз: мұнда Docker-дің қандай ережесі әрекет етеді және фрагменттегі
      нақты не соны көрсетеді. Дұрыс емес тұжырым үшін шын мәнінде қалай
      болатынын айтыңыз.
      Бағалау: 1–4 тұжырымдар — әрқайсысы 5 ұпай («дұрыс/дұрыс емес» үшін
      1 ұпай, негіздеме үшін 4 ұпай); 5-тұжырым — 4 ұпай (1 + 3).
      Негіздемесіз «дұрыс/дұрыс емес» жауабы тек 1 ұпаймен бағаланады.
      Сұрақ бойынша барлығы — 24 ұпай.
    questions:
    - id: D06-К-01
      text: |
        Фрагмент.
        Linux және Docker орнатылған компьютер. notes каталогында екі файл бар:
        Dockerfile және notes.py. Компьютерде әлі томдар (volumes) жоқ.

        notes.py файлы:
        import os

        # жазбалар файлына жол қосу
        with open("/data/notes.txt", "a") as f:
            f.write("note\n")

        # жолдар санын және /data ішіндегі файлдар тізімін шығару
        with open("/data/notes.txt") as f:
            print("notes:", len(f.readlines()))
        print("files:", sorted(os.listdir("/data")))

        Dockerfile файлы:
        FROM python:3.12-slim
        WORKDIR /app
        COPY notes.py .
        RUN mkdir /data && echo "start" > /data/readme.txt
        VOLUME /data
        CMD ["python", "notes.py"]

        Хост терминалында, notes каталогында, мына командалар ретімен
        орындалды (барлығы сәтті орындалды; әр контейнер екі жол шығарып,
        жұмысын аяқтады):
        > docker image build -t kz/notes:v1 .
        > docker container run --name n1 kz/notes:v1
        > docker container run --name n2 kz/notes:v1
        > docker container run --name n3 -v notes-data:/data kz/notes:v1
        > docker container rm -f n1

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. n1 және n2 контейнерлерінің екеуі де notes: 1 шығарды: VOLUME
           нұсқауы бойынша Docker олардың әрқайсысына өз анонимді томын
           (anonymous volume) құрды, сондықтан n2 n1 жазған жолды көрмейді.
                                                                           (5 ұпай)
        2. n3 контейнері үшін Docker notes-data томын құрды, ал анонимді том
           құрмады: -v жалаушасы томды VOLUME-да көрсетілген /data жолына
           қосып, образ томын соның орнына қойды.                          (5 ұпай)
        3. docker container rm -f n1 командасы n1 контейнерін оның анонимді
           томымен бірге жойды, сондықтан n1 жазған notes.txt файлы енді еш
           жерде сақталмайды.                                              (5 ұпай)
        4. n3 контейнері files: ['notes.txt'] шығарды: жаңа notes-data томында
           readme.txt файлы жоқ, себебі қосылған том образдың /data каталогын
           алмастырады.                                                    (5 ұпай)
        5. Егер Dockerfile-да VOLUME /data жолы болмаса да, -v notes-data:/data
           бар команда томды /data-ға бәрібір қосар еді: -v жалаушасы VOLUME
           нұсқауына тәуелсіз жұмыс істейді.                               (4 ұпай)
    - id: D06-К-02
      text: |
        Фрагмент.
        Linux және Docker орнатылған компьютер. /home/student/site каталогының
        мазмұны (жақшада — файлдың жалғыз жолы):
        Dockerfile
        show.py
        defaults/base.conf      (lang=kk)
        defaults/theme.conf     (color=light)
        conf/theme.conf         (color=dark)
        conf/local.conf         (debug=1)

        show.py файлы:
        import os, time

        # әр 3 секунд сайын /etc/app каталогындағы файлдар тізімін шығару
        while True:
            print(sorted(os.listdir("/etc/app")), flush=True)
            time.sleep(3)

        Dockerfile файлы:
        FROM python:3.12-slim
        WORKDIR /app
        COPY show.py .
        COPY defaults/ /etc/app/
        CMD ["python", "show.py"]

        Компьютерде conf атты том (volume) жоқ. Хост терминалында,
        /home/student/site каталогында, мына командалар ретімен орындалды
        ($(pwd) — ағымдағы каталог, яғни /home/student/site):
        > docker image build -t kz/site:v1 .
        > docker container run -d --name s1 \
            --mount type=bind,source=$(pwd)/conf,target=/etc/app kz/site:v1
        > docker container run -d --name s2 \
            --mount type=bind,source=$(pwd)/conf/local.conf,target=/etc/app/local.conf \
            kz/site:v1
        > docker container run -d --name s3 \
            --mount type=bind,source=$(pwd)/conf,target=/etc/app,readonly kz/site:v1
        > docker container run -d --name s4 -v conf:/etc/app kz/site:v1

        Барлық командалар сәтті орындалды, s1–s4 контейнерлері жұмыс істеп тұр
        (Up).

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. s1 контейнерінің журналы (docker container logs s1)
           ['base.conf', 'local.conf', 'theme.conf'] көрсетеді: хосттағы conf
           каталогының файлдары образдағы /etc/app файлдарына қосылады, ал
           theme.conf хосттан алынады.                                     (5 ұпай)
        2. s2 контейнерінің журналы ['base.conf', 'local.conf', 'theme.conf']
           көрсетеді: байланған жалғыз файл образдың /etc/app каталогына
           қосылады, образдың қалған файлдары көрінуін жалғастырады.       (5 ұпай)
        3. docker container exec s3 sh -c "echo x > /etc/app/new.conf"
           командасы қатемен аяқталады және хосттағы conf каталогында new.conf
           файлы пайда болмайды.                                           (5 ұпай)
        4. s4 командасындағы conf сөзі хосттың ағымдағы каталогындағы conf
           каталогын білдіреді, сондықтан s4 журналы s1 сияқты ['local.conf',
           'theme.conf'] көрсетеді.                                        (5 ұпай)
        5. s1 жұмыс істеп тұрғанда хостта /home/student/site/conf/extra.conf
           файлын құрса, s1 контейнері оны тек қайта іске қосылғаннан кейін
           көреді.                                                         (4 ұпай)
    - id: D06-К-03
      text: |
        Фрагмент.
        Linux және Docker орнатылған компьютер. rates қызметі — валюта
        бағамдарының Python-қолданбасы. kz/rates:v1 образы мына Dockerfile-дан
        жиналған:
        FROM python:3.12-slim
        WORKDIR /app
        COPY app.py .
        CMD ["python", "app.py"]

        Іске қосылғанда app.py қолданбасы:
        - баптауларды /app/config/settings.json файлынан оқиды;
        - /tmp/cache/rates.json кэшін тексереді: файл бар болса, cache: hit
          шығарып, бағамдарды одан алады, әйтпесе cache: miss шығарып,
          бағамдарды жүктеп алады да, осы файлға сақтайды;
        - /data/history.txt файлына іске қосылу туралы жол қосып, ондағы
          жолдар санын шығарады: history: N;
        - есептерді /reports каталогына жазады және жұмысын жалғастырады.

        Хостта: /srv/rates/config/settings.json — баптау файлы;
        /mnt/nfs/reports — хостқа қосылған желілік қалта (файл серверінің NFS
        ортақ ресурсы). rates-data томы әлі жоқ. kz/rates:v2 образы — сол
        қолданбаның келесі нұсқасы (сол жолдармен жұмыс істейді).

        Хост терминалында мына командалар орындалды (екеуі де сәтті):
        > docker container run -d --name r1 \
            -v rates-data:/data \
            --mount type=bind,source=/srv/rates/config,target=/app/config,readonly \
            --mount type=bind,source=/mnt/nfs/reports,target=/reports \
            kz/rates:v1
        > docker container exec r1 sh -c "echo '# patched' >> /app/app.py"

        r1 контейнері cache: miss және history: 1 шығарды және жұмыс істеп тұр
        (Up). Әр тұжырымды осы күйден бастап жеке қарастырыңыз.

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. Егер docker container stop r1 және docker container start r1
           орындалса, қолданба cache: hit шығарады; ал егер
           docker container rm -f r1 орындалып, сол run командасы қайта
           орындалса, cache: miss шығарады.                                (5 ұпай)
        2. exec командасы kz/rates:v1 образының қабатындағы /app/app.py
           файлын өзгертті, сондықтан kz/rates:v1-ден іске қосылған жаңа
           контейнерде де # patched жолы болады.                           (5 ұпай)
        3. /reports каталогы контейнерде кәдімгі каталог сияқты көрінеді,
           сондықтан қолданбаға онда жергілікті дискінің барлық файлдық жүйе
           операциялары (мысалы, файлға сілтеме құру) сол жылдамдықпен
           міндетті түрде қолжетімді.                                      (5 ұпай)
        4. Егер docker container rm -f r1, содан кейін сол run командасы, бірақ
           kz/rates:v2 образымен орындалса, жаңа контейнер history: 2
           шығарады.                                                       (5 ұпай)
        5. Баптауларды өзгерту үшін образды қайта жинаудың қажеті жоқ: хосттағы
           /srv/rates/config/settings.json файлын өзгертіп, r1-ді қайта іске
           қосу жеткілікті; readonly жалаушасы /app/config-қа тек контейнер
           ішінен жазуға тыйым салады.                                     (4 ұпай)
  functional:
    heading: ФУНКЦИОНАЛДЫҚ ДЕҢГЕЙ (32 ұпай)
    points: 32
    instructions: |
      Студентке нұсқаулық. 8 командадан (әрекеттен) тұратын тізбек және
      бастапқы күй берілген. Командалар қатаң ретпен орындалады, әрқайсысы
      алдыңғысы аяқталғаннан кейін, Linux жүйесінде, бір ағымдағы каталогтан.
      Кестенің бірінші бағаны толтырылған. Әр жол үшін қалған екі бағанды
      толтырыңыз:
        - «Командадан кейінгі күй» — қандай контейнерлер (containers) бар және
          қандай күйде, қандай томдар (volumes) бар, томдарда және хост
          каталогтарында қандай файлдар бар (қолданба жол қосатын файлдар үшін —
          жолдар саны), контейнерге қай том қосылған;
        - «Шығыс немесе нәтиже» — команда немесе қолданба не басып шығарады
          (қолданба шығаратын жолдар шартта берілген — оларды сандарымен
          жазыңыз) немесе қате сөзбен (қатенің нақты мәтіні, ID және өлшемдер
          талап етілмейді).
      Белгілеу:
        - контейнер: `n1: Exited (0)` / `n1: Up` / `n1: жойылды`;
        - том: `notes-data: [notes.txt (2 жол), readme.txt]`;
        - анонимді том (anonymous volume): `анон. том №1: [notes.txt (1 жол)]`
          — нөмірі құрылу реті бойынша, томның ID-ін жазудың қажеті жоқ;
        - хост каталогы: `./new: [c.txt, d.txt]`.
      Күй өзгермесе, «өзгеріссіз» деп жазып, нақты не қалғанын көрсетіңіз.

      Анықтама — 6-тарауда жоқ (немесе нақтыланбаған) ережелер:
        1. Образда файлдары бар контейнер каталогына ЖАҢА БОС том (VOLUME
           нұсқауы бойынша анонимді том немесе бос атаулы том) қосылса, Docker
           қосу кезінде образдағы осы файлдарды томға көшіреді. Бос емес том
           толтырылмайды. Хост каталогы (bind mount) ешқашан толтырылмайды.
        2. -v дереккөз:мақсат жалаушасы. Дереккөз жол болса (/ немесе ./
           белгісінен басталса), бұл хост каталогын байлау (bind mount); жай
           атау болса — бұл том (volume), ал мұндай атаулы том жоқ болса, Docker
           оны құрады. Жоқ хост каталогын -v жалаушасы (бос күйінде) құрады, ал
           --mount type=bind құрмайды: бұл қате, контейнер құрылмайды.
        3. docker container rm (және rm -f) контейнердің томдарын жоймайды;
           docker container rm -v осы контейнердің анонимді томдарын жояды;
           docker container run --rm аяқталғаннан кейін контейнерді және оның
           анонимді томдарын жояды. Атаулы томдарды бұл командалар ешқашан
           жоймайды.
        4. docker volume rm кемінде бір контейнерге (тіпті тоқтатылғанға)
           қосылған томды жоймайды.
        5. docker volume prune ешбір контейнерге қосылмаған томдарды жояды —
           тек анонимді томдарды; -a (--all) жалаушасымен — атаулы томдарды да.
           -f жалаушасы — растауды сұрамау.
        6. $(pwd) — хосттың ағымдағы каталогының толық жолы.

      Бағалау: 8 жол, әрқайсысы 4 ұпай (күй бағаны — 2 ұпай, нәтиже бағаны —
      2 ұпай). Барлығы 32 ұпай. Жауабыңызды ауызша түсіндіріңіз.
    questions:
    - id: D06-Ф-01
      text: |
        Бастапқы күй:
        - жергілікті кэште төмендегі файлдардан жиналған notes:v1 және notes:v2
          образдары бар; notes:v2 тек «v1 notes: ...» орнына «v2 notes: ...»
          басып шығаруымен ерекшеленеді;
        - контейнерлер жоқ, томдар жоқ.

        Dockerfile файлы:
        FROM python:3.12-slim
        WORKDIR /app
        COPY notes.py .
        RUN mkdir /data && echo "welcome" > /data/readme.txt
        VOLUME /data
        CMD ["python", "notes.py"]

        notes.py файлы (notes:v1 образы):
        path = "/data/notes.txt"
        # файлға бір жол қосу (файл жоқ болса, құрылады)
        with open(path, "a") as f:
            f.write("note\n")
        # файлдағы жолдар санын басып шығарып, аяқталу
        with open(path) as f:
            count = len(f.readlines())
        print("v1 notes:", count)

        Тапсырма: кестені толтырыңыз (командалар — бірінші бағанда).

        | № | Команда                                                     | Командадан кейінгі күй | Шығыс немесе нәтиже |
        |---|-------------------------------------------------------------|------------------------|---------------------|
        | 1 | docker container run --name n1 notes:v1                     |                        |                     |
        | 2 | docker container start --attach n1                          |                        |                     |
        | 3 | docker container run --name n2 notes:v1                     |                        |                     |
        | 4 | docker container run --name n3 --volumes-from n1 notes:v1   |                        |                     |
        | 5 | docker volume create notes-data                             |                        |                     |
        | 6 | docker container run --name n4 -v notes-data:/data notes:v1 |                        |                     |
        | 7 | docker container rm n4 n1                                   |                        |                     |
        | 8 | docker container run --name n5 -v notes-data:/data notes:v2 |                        |                     |

        Ұпай: 32 (8 жол × 4).
    - id: D06-Ф-02
      text: |
        Бастапқы күй:
        - жергілікті кэште төмендегі файлдардан жиналған lister:v1 образы бар;
        - хосттың ағымдағы каталогында ./new каталогы бар: [c.txt, d.txt];
          ./logs каталогы жоқ;
        - контейнерлер жоқ, томдар жоқ.

        Dockerfile файлы:
        FROM python:3.12-slim
        WORKDIR /app
        COPY lister.py .
        RUN mkdir -p /srv/init && echo "A" > /srv/init/a.txt && echo "B" > /srv/init/b.txt
        CMD ["python", "lister.py"]

        lister.py файлы:
        import os
        folder = "/srv/init"
        # каталогтағы файл атауларын әліпби ретімен басып шығару
        print("files:", " ".join(sorted(os.listdir(folder))))
        # сол каталогтағы журналға жол қосу
        with open(os.path.join(folder, "run.log"), "a") as f:
            f.write("run\n")
        print("saved")

        Тапсырма: кестені толтырыңыз (командалар — бірінші бағанда).

        | № | Команда                                                            | Командадан кейінгі күй | Шығыс немесе нәтиже |
        |---|--------------------------------------------------------------------|------------------------|---------------------|
        | 1 | docker container run --rm lister:v1                                |                        |                     |
        | 2 | docker container run --rm                                          |                        |                     |
        |   |   --mount type=bind,source=$(pwd)/new,target=/srv/init             |                        |                     |
        |   |   lister:v1                                                        |                        |                     |
        | 3 | docker container run --rm                                          |                        |                     |
        |   |   --mount type=bind,source=$(pwd)/new/c.txt,target=/srv/init/c.txt |                        |                     |
        |   |   lister:v1                                                        |                        |                     |
        | 4 | docker container run --rm                                          |                        |                     |
        |   |   --mount type=bind,source=$(pwd)/new,target=/srv/init,readonly    |                        |                     |
        |   |   lister:v1                                                        |                        |                     |
        | 5 | Хостта: echo E > new/e.txt                                         |                        |                     |
        |   | содан кейін: docker container run --rm                             |                        |                     |
        |   |   --mount type=bind,source=$(pwd)/new,target=/srv/init             |                        |                     |
        |   |   lister:v1                                                        |                        |                     |
        | 6 | docker container run --rm                                          |                        |                     |
        |   |   --mount type=bind,source=$(pwd)/logs,target=/srv/init            |                        |                     |
        |   |   lister:v1                                                        |                        |                     |
        | 7 | docker container run --rm -v $(pwd)/logs:/srv/init lister:v1       |                        |                     |
        | 8 | docker container run --rm -v new:/srv/init lister:v1               |                        |                     |

        Ұпай: 32 (8 жол × 4).
    - id: D06-Ф-03
      text: |
        Бастапқы күй:
        - жергілікті кэште төмендегі файлдардан жиналған logbook:1 образы бар;
        - контейнерлер жоқ, томдар жоқ.

        Dockerfile файлы:
        FROM python:3.12-slim
        WORKDIR /app
        COPY logbook.py .
        RUN mkdir -p /var/logbook
        VOLUME /var/logbook
        CMD ["python", "logbook.py"]

        logbook.py файлы:
        path = "/var/logbook/entries.txt"
        # бір жол қосу (файл жоқ болса, құрылады)
        with open(path, "a") as f:
            f.write("entry\n")
        # жолдар санын басып шығарып, аяқталу
        with open(path) as f:
            print("entries:", len(f.readlines()))

        Тапсырма: кестені толтырыңыз (командалар — бірінші бағанда).

        | № | Команда                                                          | Командадан кейінгі күй | Шығыс немесе нәтиже |
        |---|------------------------------------------------------------------|------------------------|---------------------|
        | 1 | docker container run --name a1 logbook:1                         |                        |                     |
        | 2 | docker container run --name a2 -v lb-data:/var/logbook logbook:1 |                        |                     |
        | 3 | docker container run --rm logbook:1                              |                        |                     |
        | 4 | docker container rm a1                                           |                        |                     |
        | 5 | docker volume rm lb-data                                         |                        |                     |
        | 6 | docker container rm -v a2                                        |                        |                     |
        | 7 | docker volume prune -f                                           |                        |                     |
        | 8 | docker volume prune -a -f                                        |                        |                     |

        Ұпай: 32 (8 жол × 4).
  systemic:
    heading: ЖҮЙЕЛІК ДЕҢГЕЙ (44 ұпай)
    points: 44
    instructions: |
      6-тарау. Тексеру сценарийлері.

      Нұсқаулық. Әр сұрақта фрагмент берілген — Dockerfile, қолданба файлы,
      баптау (configuration) файлы және Docker командалары — және бастапқы күйдің
      сипаттамасы: қандай образдар (images) жиналған, қандай контейнерлер мен
      томдар (volumes) бар, хост каталогтарында қандай файлдар жатыр. 4 тексеру
      сценарийін (тест-кейс сияқты) ойлап табыңыз және оларды кестеге жазыңыз:

      | № | Бастапқы шарт немесе әрекет | Күтілетін нәтиже | Сценарий нені тексереді |
      |---|-----------------------------|------------------|-------------------------|

      - Бастапқы шарт немесе әрекет — нақты не істейсіз немесе не бересіз: ?
        белгілерінің орнындағы мәндер, қандай командалар қандай ретпен
        орындалады, олардың алдында не өзгертілді (хосттағы файл, -v немесе
        --mount жалаушасы, контейнердегі жол, rm -f / rm -v / stop), контейнермен
        немесе томмен не істелді.
      - Күтілетін нәтиже — Docker немесе қолданба не көрсетеді: қолданба не
        басып шығарады (мысалы, entries=3); іске қосу сәтті ме; қате болса —
        қандай түрі (файл табылмады, файлдық жүйе тек оқуға арналған,
        монтаждау көзі жоқ); қандай томдар бар, оларда және хост каталогында
        қандай файлдар бар.
      - Сценарий нені тексереді — Docker-дің қай ережесі немесе тапсырмадағы
        қай тұжырым расталады не теріске шығарылады.
      Сценарийлер әртүрлі нәтиже беруі керек. Томдар мен контейнерлердің
      ID-лерін, өлшемдерді, уақытты және хабарламалардың нақты мәтінін жазудың
      қажеті жоқ: нәтижені сөзбен сипаттау жеткілікті (мысалы: «entries=1 басып
      шығарады», «қате: файлдық жүйе тек оқуға арналған», «notes-data томы бос»,
      «№1 анонимді том: [notes.txt]»).

      Анықтама (кітапта жоқ, бірақ жауапқа қажет Docker ережелері):
      - БОС том (жаңа атаулы немесе анонимді том) образда файлдары бар
        каталогқа қосылса, Docker алдымен сол файлдарды томға көшіреді. Бос емес
        том толтырылмайды және образ каталогын жабады. Хост каталогын байлау
        (bind mount) ешқашан ештеңе көшірмейді.
      - docker container rm (және rm -f) контейнердің томдарын жоймайды;
        docker container rm -v контейнермен бірге оның анонимді томдарын жояды.
        Атаулы томдар тек docker volume rm командасымен жойылады.
      - -v атау:жол түріндегі мән / немесе ./ белгісімен басталмаса — бұл хост
        каталогы емес, томның атауы.

      Бағалау: 4 сценарий, әрқайсысы 8 ұпай (бастапқы шарт — 2, күтілетін нәтиже —
      3, нені тексереді — 3) = 32 ұпай + емтихан алушыға сценарийлерді қорғау —
      12 ұпай. Барлығы 44 ұпай.
    questions:
    - id: D06-С-01
      text: |
        Фрагмент. notes қолданбасын v1 нұсқасынан v2 нұсқасына жаңарту,
        деректерді томда (volume) сақтай отырып.

        Dockerfile файлы (v1 және v2 үшін бірдей):
            FROM python:3.12-slim
            WORKDIR /app
            COPY app.py .
            VOLUME /data
            CMD ["python", "app.py"]

        app.py файлы (v1 нұсқасы; v2 нұсқасында тек VERSION = "v2" жолы
        өзгеше):
            VERSION = "v1"
            # әр іске қосқанда бір жазба қосылады
            with open("/data/notes.txt", "a") as f:
                f.write("start " + VERSION + "\n")
            with open("/data/notes.txt") as f:
                n = len(f.readlines())
            print("notes", VERSION, "entries=" + str(n))

        notes:v1 және notes:v2 образдары жиналған. notes-ке қатысты контейнерлер
        мен томдар жоқ.

        upgrade.sh файлы (командалар ретімен орындалады; run командасы
        интерактивті режимде жұмыс істейді және қолданбамен бірге аяқталады):
            docker volume create notes-data
            docker container run --name notes -v notes-data:/app/data notes:v1
            docker container start -a notes
            docker container rm -f notes
            docker container run --name notes -v notes-data:/app/data notes:v2

        Әзірлеуші былай дейді: «Жазбалар notes-data атаулы томында сақталады,
        сондықтан v1 → v2 жаңартуында олар сақталады: v2 нұсқасы бұрынғы барлық
        жазбаларды және өзінікін көрсетеді».

        Тапсырма. Әзірлеушінің тұжырымын тексеретін 4 сценарий ойлап
        табыңыз. Скриптті толық немесе ішінара орындауға, ондағы жалаушалар мен
        жолдарды өзгертуге (-v, rm -f / rm -v / stop), app.py немесе Dockerfile
        ішіндегі жолды өзгертуге, командалар қосуға (docker volume ls, томмен тағы
        бір контейнерді іске қосу, --volumes-from) болады. Әр сценарий үшін
        бастапқы шартты, күтілетін нәтижені (әр нұсқа не басып шығарады, қандай
        томдар бар және оларда не бар) және сценарий нені тексеретінін көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
    - id: D06-С-02
      text: |
        Фрагмент. Сол образды басқа баптаумен және деректердің басқа
        қоймасымен іске қосу (тараудың зертханалық жұмысындағыдай).

        notes:2 образы мына Dockerfile бойынша алдын ала жиналған:
            FROM python:3.12-slim
            WORKDIR /app
            COPY config/ ./config/
            COPY demo/ ./data/
            COPY app.py .
            CMD ["python", "app.py"]

        Образда:
            /app/config/settings.json — әдепкі баптау:
                {
                  "log_level": "info",
                  "data_file": "/app/data/notes.txt"
                }
            /app/data/notes.txt — 3 демонстрациялық жазба (demo 1, demo 2, demo 3).

        app.py файлы:
            import json

            # баптау файлы міндетті
            with open("/app/config/settings.json") as f:
                cfg = json.load(f)

            debug = cfg["log_level"] == "debug"
            path = cfg["data_file"]
            if debug:
                print("DEBUG data_file=" + path)

            # бір жазба қосып, олардың санын шығару
            with open(path, "a") as f:
                f.write("note\n")
            with open(path) as f:
                n = len(f.readlines())
            print("notes entries=" + str(n))

        Хосттағы ағымдағы каталог — /home/student/notes. Онда config каталогы
        бар, ішінде тек settings.json файлы жатыр:
            {
              "log_level": "debug",
              "data_file": "/app/config/notes.txt"
            }

        Іске қосу командасы:
            docker container run --name notes-lab \
              --mount type=bind,source=$(pwd)/config,target=/app/config? \
              -v notes-store:? \
              notes:2
        Бірінші ? — не ,readonly, не ештеңе. Екінші ? — контейнердегі жол.
        Іске қосуға дейін notes-store томы жоқ.

        Талап (зертханалық жұмыстағыдай): сол образды тізім бос басталатындай
        (бірінші іске қосу entries=1 басып шығарады), жазбалар notes-store томында
        сақталып, контейнер ауыстырылғанда жоғалмайтындай, ал хосттағы баптау
        файлдарын қолданба өзгертпейтіндей етіп іске қосу.

        Әзірлеуші былай дейді: «Осы settings.json-мен ,readonly және
        -v notes-store:/app/data арқылы іске қоссақ, талап орындалады».

        Тапсырма. Әзірлеушінің тұжырымын және талапты тексеретін 4 сценарий
        ойлап табыңыз. ? мәндерін таңдауға, хосттағы settings.json файлын
        өзгертуге (log_level, data_file), оны жоюға, контейнерді монтаждаусыз
        іске қосуға, контейнерді жойып, сол томмен жаңасын іске қосуға болады. Әр
        сценарий үшін бастапқы шартты, күтілетін нәтижені (қолданба не басып
        шығарады, қате және оның түрі, notes-store томында және хосттағы config
        каталогында қандай файлдар пайда болды) және сценарий нені тексеретінін
        көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
    - id: D06-С-03
      text: |
        Фрагмент. Өзгерістерді образды қайта жинамай көру үшін бастапқы
        кодты (source code) хосттан монтаждау.

        Хосттағы жоба каталогы — /home/student/web (ағымдағы каталог):
            Dockerfile
            src/app.py
            assets/logo.txt      (бір жол: NOTES)

        Dockerfile файлы:
            FROM python:3.12-slim
            WORKDIR /app
            COPY assets/ ./static/
            COPY src/ .
            CMD ["python", "app.py"]

        src/app.py файлы:
            VERSION = "1.0"
            print("notes-web", VERSION)
            with open("static/logo.txt") as f:
                print("logo:", f.read().strip())

        Образ мына командамен жиналған: docker image build -t notes-web:dev .
        Образды монтаждаусыз іске қосу мынаны басып шығарады:
            notes-web 1.0
            logo: NOTES

        Әзірлеушінің командасы:
            docker container run --name web-dev \
              --mount type=bind,source=$(pwd)/src,target=/app \
              notes-web:dev
        Хосттағы файлды түзеткеннен кейін контейнер қайта іске қосылады:
            docker container start -a web-dev

        Әзірлеуші былай дейді: «Код хосттан монтаждалады: src/app.py файлын
        түзетемін, контейнерді қайта іске қосамын және өзгерістерді образды қайта
        жинамай көремін, ал қолданба образдағыдай жұмыс істейді».

        Тапсырма. Әзірлеушінің тұжырымын тексеретін 4 сценарий ойлап
        табыңыз. Монтаждаудың көзін (source) және мақсатты каталогын (target)
        өзгертуге, --mount орнына -v жазуға, жеке файлды монтаждауға, екінші
        монтаждау қосуға, хосттағы файлдарды түзетуге, каталог атауында қате
        жіберуге болады. Әр сценарий үшін бастапқы шартты, күтілетін нәтижені
        (қолданба не басып шығарады, қате және оның түрі, контейнер құрыла ма,
        хостта не пайда болады) және сценарий нені тексеретінін көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
