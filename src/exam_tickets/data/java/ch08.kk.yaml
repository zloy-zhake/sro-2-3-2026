        interface UiJanuar {               // интерфейс (interface): үй жануары (Pet)
          void oinau();
        }

        abstract class Januar {            // абстрактілі класс (abstract class)
          abstract void tamaq();
        }

        class It extends Januar implements UiJanuar {
          void tamaq() {
            System.out.println("it jeidi");
          }

          public void oinau() {
            System.out.println("it dop quady");
          }
        }

        class Mysyq extends Januar implements UiJanuar {
          void tamaq() {
            System.out.println("mysyq jeidi");
          }

          public void oinau() {
            System.out.println("mysyq jip oinaidy");
          }
        }

        class Begemot extends Januar {
          void tamaq() {
            System.out.println("begemot jeidi");
          }
        }

        class Robot {
        }

        class RoboIt extends Robot implements UiJanuar {
          public void oinau() {
            System.out.println("roboit bi bileidi");
          }
        }

        class Qyzmetshi {                  // қызметші
          void qyzmet(Object x) {
            if (x instanceof UiJanuar) {
              It p = (It) x;               // типті келтіру (casting)
              p.oinau();
            } else if (x instanceof Januar) {
              Januar j = (Januar) x;
              j.tamaq();
            } else {
              System.out.println("tanylmady");
            }
          }
        }

        public class QyzmetTest {
          public static void main(String[] args) {
            Qyzmetshi q = new Qyzmetshi();
            q.qyzmet(new ?());             // тест кірісі: объектінің класы
            System.out.println("boldy");
          }
        }

        Талап: ? орнына It, Mysyq, Begemot, RoboIt немесе Robot қойылады. qyzmet әдісі: объект үй жануары болса (UiJanuar интерфейсін іске асыратын (implements) кез келген класс), онымен ойнайды — сол объектінің oinau() әдісі орындалады; үй жануары емес жануар (Januar) болса, оны тамақтандырады — tamaq() орындалады; басқа объект болса, «tanylmady» шығарады. Соңғы жол — «boldy».
