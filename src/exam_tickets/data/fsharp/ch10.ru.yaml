    - id: F10-С-03
      text: |
        // Районы с наибольшей плотностью населения
        let topDensity count (districts: (string * decimal * decimal) array) =
            districts
            |> Array.map (fun (name, population, area) ->
                name, population / area)
            |> Array.sortByDescending snd
            |> Array.take count

        topDensity ? ?    // первый ? — count (int), второй ? — массив районов

        Требование: функция topDensity получает число count (0 или больше) и массив районов (название, население, площадь) и возвращает массив пар (название, плотность) для не более чем count районов с наибольшей плотностью = население / площадь, по убыванию плотности.
        - Если районов меньше, чем count, возвращаются все районы (пустой вход -> пустой массив [||]).
        - Район с площадью 0M — «нет данных о площади»: он пропускается.
        - Порядок районов с одинаковой плотностью не важен. Берите в тестах числа, которые делятся нацело (например 9000M / 30M = 300M).
        Справка: M — суффикс десятичного числа (decimal). Деление decimal на 0M бросает исключение DivideByZeroException. Array.sortByDescending snd — сортировка по второму элементу пары по убыванию. Array.take n — первые n элементов; если в массиве меньше n элементов, бросает исключение (InvalidOperationException).

