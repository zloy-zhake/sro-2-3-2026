chapter_titles:
- Packaging applications from source code into Docker images
levels:
  cognitive:
    heading: КОГНИТИВТІК ДЕҢГЕЙ (24 ұпай)
    points: 24
    instructions: |
      Студентке нұсқаулық.
      Әр сұраққа фрагмент берілген: Dockerfile (көп кезеңді — multi-stage),
      Docker командалары және олардың шығысы (шығыс қысқартылуы мүмкін) және
      бастапқы күйдің сипаттамасы. Фрагменттен кейін осы фрагмент туралы
      5 тұжырым берілген.
      Әр тұжырымға «дұрыс» немесе «дұрыс емес» деп жазып, жауабыңызды
      негіздеңіз: мұнда Docker-дің қандай ережесі әрекет етеді және фрагменттегі
      нақты не соны көрсетеді. Дұрыс емес тұжырым үшін шын мәнінде қалай
      болатынын айтыңыз.
      Бағалау: 1–4 тұжырымдар — әрқайсысы 5 ұпай («дұрыс/дұрыс емес» үшін
      1 ұпай, негіздеме үшін 4 ұпай); 5-тұжырым — 4 ұпай (1 + 3).
      Негіздемесіз «дұрыс/дұрыс емес» жауабы тек 1 ұпаймен бағаланады.
      Сұрақ бойынша барлығы — 24 ұпай.
    questions:
    - id: D04-К-01
      text: |
        Фрагмент.
        Linux және Docker орнатылған компьютер. calc каталогында үш файл бар:
        Dockerfile, calc.py (add функциясы — екі санды қосу) және test_calc.py
        (add функциясының стандартты unittest модуліндегі модульдік тесті (unit
        test)). calc каталогында басқа файлдар мен каталогтар жоқ. Қазір тест
        сәтті өтеді. python:3.12-slim және python:3.12-alpine базалық образдары
        (base images) жергілікті образдар кэшінде бар; kz/calc образы әлі жоқ.

        Dockerfile файлы:
        FROM python:3.12-slim AS prepare
        WORKDIR /src
        COPY calc.py test_calc.py ./
        RUN echo "version=1.4" > build.txt

        FROM python:3.12-slim AS check
        COPY --from=prepare /src /src
        WORKDIR /src
        RUN python -m unittest test_calc && echo "tests: OK" >> build.txt

        FROM python:3.12-alpine
        WORKDIR /app
        COPY --from=check /src/calc.py /src/build.txt ./
        CMD ["cat", "/app/build.txt"]

        Хост терминалында, calc каталогында, мына командалар орындалды:
        > docker image build -t kz/calc .
        > docker container run kz/calc

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. Қорытынды kz/calc образында бастапқы кодтың екі файлы да бар —
           calc.py және test_calc.py, өйткені check кезеңі (stage) prepare
           кезеңінен бүкіл /src каталогын алды.                               (5 ұпай)
        2. Егер test_calc.py ішіндегі тест өтпесе, docker image build
           командасы қатемен аяқталып, kz/calc образы құрылмас еді.           (5 ұпай)
        3. check кезеңіндегі COPY --from=prepare /src /src нұсқаулығы src
           каталогын жинау контекстінен (build context), яғни хосттағы calc
           каталогынан көшіреді.                                              (5 ұпай)
        4. docker container run kz/calc командасы екі жол шығарады:
           version=1.4 және tests: OK.                                        (5 ұпай)
        5. RUN нұсқаулығындағы тест kz/calc образынан контейнер іске қосылған
           сайын емес, образды жинау кезінде орындалады.                      (4 ұпай)
    - id: D04-К-02
      text: |
        Фрагмент.
        Linux және Docker орнатылған компьютер. quotes каталогында:
        - Dockerfile;
        - requirements.txt — бір жол: flask;
        - app/server.py — Flask веб-қолданбасы, /quote сұрауына жауап береді,
          5000 портын тыңдайды;
        - app/__main__.py — server.py-дағы қолданбаны іске қосады.
        python -m zipapp app -o quotes.pyz командасы app каталогының ішіндегісін
        бір quotes.pyz файлына буаптайды (Python-архив, Java-дағы JAR файлының
        баламасы); оны python quotes.pyz командасымен іске қосуға болады.
        python:3.12 базалық образы — жинау құралдары бар толық образ (шамамен
        1 ГБ), python:3.12-slim — жеңілдетілген образ.

        Dockerfile файлы:
        FROM python:3.12 AS builder
        WORKDIR /usr/src/quotes
        COPY requirements.txt .
        RUN pip install --target /deps -r requirements.txt
        COPY . .
        RUN python -m zipapp app -o quotes.pyz

        # қорытынды образ
        FROM python:3.12-slim
        WORKDIR /srv
        COPY --from=builder /deps ./deps
        COPY --from=builder /usr/src/quotes/quotes.pyz .
        ENV PYTHONPATH=/srv/deps
        EXPOSE 5000
        ENTRYPOINT ["python", "/srv/quotes.pyz"]

        Хост терминалында, quotes каталогында, мына командалар орындалды; екеуі
        де сәтті орындалды, q1 контейнері Up күйінде:
        > docker image build -t kz/quotes .
        > docker container run -d --name q1 -p 8085:5000 kz/quotes

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. Қорытынды kz/quotes образында app/server.py бастапқы коды бар
           /usr/src/quotes каталогы бар, өйткені ол builder кезеңінде
           COPY . . нұсқаулығымен сонда көшірілген.                           (5 ұпай)
        2. Егер тек app/server.py файлын өзгертіп, docker image build -t
           kz/quotes . командасын қайта орындаса, builder кезеңінде RUN pip
           install қадамы кэштен алынады, ал COPY . . және RUN python -m
           zipapp қайтадан орындалады.                                        (5 ұпай)
        3. Егер requirements.txt файлына requests жолын қосып, образды қайта
           жинаса, builder кезеңінде тек RUN pip install қайтадан
           орындалады, ал COPY . . және RUN python -m zipapp кэштен алынады,
           өйткені app каталогындағы файлдар өзгермеген.                      (5 ұпай)
        4. Егер Dockerfile-дан EXPOSE 5000 жолын өшіріп, образды қайта
           жинаса, -p 8085:5000 жалаушасы бар docker container run командасы
           контейнердің 5000 портын хосттың 8085 портына енді жариялай
           алмайды.                                                           (5 ұпай)
        5. ENTRYPOINT нұсқаулығы да CMD сияқты контейнер іске қосылғанда
           орындалатын команданы береді: q1 контейнерінде python
           /srv/quotes.pyz жұмыс істеп тұр.                                   (4 ұпай)
    - id: D04-К-03
      text: |
        Фрагмент.
        Linux және Docker орнатылған компьютер. kz/quotes-api образы жиналып
        қойылған: бұл 5000 портын тыңдайтын және /quote сұрауына дәйексөз
        қайтаратын веб-API. gallery веб-қолданбасы өз бетіне (8080 порты) келген
        әр сұрау кезінде QUOTES_URL орта айнымалысындағы (environment variable)
        мекенжай бойынша дәйексөз сұрап, оны index.html ішіне қояды; мекенжай
        қолжетімсіз болса, дәйексөздің орнына қате туралы хабар көрсетеді.
        gallery каталогында Dockerfile, main.py, util.py және index.html бар.
        python:3.12-alpine базалық образында жұмыс каталогы (working directory)
        берілмеген, яғни ол түбірлік / каталогы.

        Dockerfile файлы:
        FROM python:3.12 AS builder
        COPY main.py util.py /build/
        RUN python -m zipapp /build -m "main:run" -o /gallery.pyz

        # қорытынды образ
        FROM python:3.12-alpine
        ENV QUOTES_URL="http://quotes:5000/quote"
        CMD ["python", "/site/gallery.pyz"]

        WORKDIR site
        COPY index.html .
        COPY --from=builder /gallery.pyz .

        Хост терминалында, gallery каталогында, мына командалар орындалды;
        барлығы сәтті орындалды, үш контейнердің бәрі Up күйінде:
        > docker image build -t kz/gallery .
        > docker network create shop
        > docker container run -d --name quotes --network shop kz/quotes-api
        > docker container run -d --name gal1 -p 8090:8080 --network shop kz/gallery
        > docker container run -d --name gal2 -p 8091:8080 kz/gallery
        > docker image ls -f reference=python:3.12 -f reference=kz/gallery
        REPOSITORY    TAG       IMAGE ID       CREATED          SIZE
        kz/gallery    latest    3f9c1a7d2e40   2 minutes ago    57.6MB
        python        3.12      8b2f4e6c1a93   3 weeks ago      1.02GB

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. index.html файлы kz/gallery образында /site/index.html жолында
           орналасқан.                                                        (5 ұпай)
        2. gal2 контейнері де gal1 сияқты өз бетінде quotes контейнерінен
           алынған дәйексөзді көрсетеді, өйткені http://quotes:5000/quote
           мекенжайы образға QUOTES_URL айнымалысында жазылған.               (5 ұпай)
        3. Dockerfile-да CMD нұсқаулығы WORKDIR және COPY нұсқаулықтарынан
           бұрын тұр, сондықтан контейнер іске қосылғанда /site/gallery.pyz
           файлы әлі жоқ болады да, gal1 контейнері қатемен аяқталады.        (5 ұпай)
        4. kz/gallery образы python:3.12 образынан әлдеқайда кіші, өйткені
           қорытынды образда тек соңғы кезең бар: builder кезеңінен оған тек
           gallery.pyz файлы түсті, ал python:3.12 қабаттары мен жинау
           құралдары онда жоқ.                                                (5 ұпай)
        5. gal1 контейнеріндегі қолданба бетін хосттағы браузерде
           http://localhost:8090 мекенжайы бойынша ашуға болады.              (4 ұпай)
  functional:
    heading: ФУНКЦИОНАЛДЫҚ ДЕҢГЕЙ (32 ұпай)
    points: 32
    instructions: |
      Нұсқаулық. Көп кезеңді Dockerfile (multi-stage Dockerfile), бастапқы күй
      (осы Dockerfile-дан қандай образ (image) бұрын жиналған және содан кейін
      файлдарда не өзгертілген) және қайта жинау командасы берілген. Кестенің әр
      жолы — Dockerfile-дағы бір нұсқау (instruction), файлдағы ретімен. Бірінші
      баған толтырылған. Әр жол үшін қалған екі бағанды толтырыңыз:
        - «Қайта жинау: CACHED немесе қайтадан, және неге» — нұсқаудың нәтижесі
          жинау кэшінен (build cache) алына ма — жинау шығысында бұл CACHED
          сөзі, — әлде нұсқау қайтадан орындала ма; себебін міндетті түрде
          көрсетіңіз;
        - «Нұсқаудан кейін не бар (қай кезеңде)» — нұсқау қай кезеңде (stage)
          орындалады (builder немесе қорытынды кезең) және осы нұсқаудан кейін
          (осы кезеңнің алдыңғы нұсқауларының бәрін ескере отырып) сол кезеңде
          не бар: файлдар мен каталогтар (толық жолдары), жұмыс каталогы
          (working directory), іске қосу командасы.
      Белгілеу:
        - FROM үшін базалық образ (base image) қайдан алынатынын көрсетіңіз:
          жергілікті кэштен немесе жүктеп алынады, және қай кезең басталады;
        - CMD және ENTRYPOINT файл жасамайды: олар тек образдың баптауларын
          (метадеректер, metadata) жазады. Қазіргі Docker (BuildKit) оларды
          жинау шығысында жеке қадам ретінде көрсетпейді. Мұндай жолдар үшін
          екінші бағанға «метадеректер, жеке жинау қадамы жоқ» деп және образға
          қандай мән түсетінін жазыңыз;
        - «қайтадан» — нұсқау орындалады және жаңа қабат (layer) жасайды;
        - қорытынды образ — тек соңғы кезең; builder кезеңі тегі бар образға
          кірмейді.
      Еске салу: Docker хэшті (hash) салыстырады; хэш нұсқаудың мәтінінен және
      көшірілетін файлдардың мазмұнынан есептеледі; COPY --from үшін — басқа
      кезеңнен алынған файлдардың мазмұнынан. Docker кезеңдерді қандай ретпен
      орындайтыны сұралмайды.
      Бағалау: 8 жол, әрқайсысы 4 ұпай (2 ұпай — екінші баған, 2 ұпай — үшінші
      баған). Барлығы 32 ұпай. Жауапты ауызша түсіндіріңіз.
    questions:
    - id: D04-Ф-01
      text: |
        rates каталогында мыналар бар: Dockerfile, requirements.txt (Python
        тәуелділіктерінің (dependencies) тізімі) және бастапқы коды (source code)
        бар app каталогы (app/__main__.py, app/rates.py). builder кезеңі
        тәуелділіктерді app каталогына орнатады және бүкіл app каталогын бір
        rates.pyz архив-файлына буып-түйеді (python -m zipapp; бұл JAR-файлдың
        баламасы: Python мұндай архивті бағдарлама ретінде іске қосады).

        Dockerfile файлы:
        FROM python:3.12-slim AS builder
        COPY requirements.txt /build/
        RUN pip install --target /build/app -r /build/requirements.txt
        COPY . /build/
        RUN python -m zipapp /build/app -o /build/rates.pyz

        # қолданба
        FROM python:3.12-slim
        COPY --from=builder /build/rates.pyz /srv/
        ENTRYPOINT ["python", "/srv/rates.pyz"]

        Бастапқы күй:
        - python:3.12-slim базалық образы жергілікті образдар кэшінде бар;
        - rates каталогында docker image build -t kz/rates:v1 . командасы
          орындалған — образ жиналған;
        - содан кейін requirements.txt файлына бір жаңа тәуелділік қосылды;
          Dockerfile және app каталогындағы файлдар өзгертілген жоқ.

        Содан кейін сол каталогта мына команда орындалды:
        docker image build -t kz/rates:v2 .

        Тапсырма: kz/rates:v2 жинауы үшін кестені толтырыңыз.

        | № | Dockerfile нұсқауы                                             | Қайта жинау: CACHED немесе қайтадан, және неге | Нұсқаудан кейін не бар (қай кезеңде) |
        |---|----------------------------------------------------------------|------------------------------------------------|--------------------------------------|
        | 1 | FROM python:3.12-slim AS builder                               |                                                |                                      |
        | 2 | COPY requirements.txt /build/                                  |                                                |                                      |
        | 3 | RUN pip install --target /build/app -r /build/requirements.txt |                                                |                                      |
        | 4 | COPY . /build/                                                 |                                                |                                      |
        | 5 | RUN python -m zipapp /build/app -o /build/rates.pyz            |                                                |                                      |
        | 6 | FROM python:3.12-slim                                          |                                                |                                      |
        | 7 | COPY --from=builder /build/rates.pyz /srv/                     |                                                |                                      |
        | 8 | ENTRYPOINT ["python", "/srv/rates.pyz"]                        |                                                |                                      |

        Ұпай: 32 (8 жол × 4).
    - id: D04-Ф-02
      text: |
        orders каталогында мыналар бар: Dockerfile және src каталогы, онда
        src/requirements.txt (тәуелділіктер тізімі) және src/server.py (веб-
        қолданба; іске қосылғанда ол өзінің жанындағы deps каталогын модульдерді
        іздеу жолына қосады) файлдары бар.

        Dockerfile файлы:
        FROM python:3.12-slim AS builder
        COPY src/requirements.txt /tmp/
        RUN pip install --target /deps -r /tmp/requirements.txt

        # қолданба
        FROM python:3.12-slim
        CMD ["python", "server.py"]
        WORKDIR /app
        COPY --from=builder /deps/ /app/deps/
        COPY src/ .

        Бастапқы күй:
        - python:3.12-slim базалық образы жергілікті образдар кэшінде бар;
        - orders каталогында docker image build -t kz/orders:1.0 . командасы
          орындалған — образ жиналған;
        - содан кейін тек src/server.py файлындағы код өзгертілді; Dockerfile және
          src/requirements.txt өзгертілген жоқ.

        Содан кейін сол каталогта мына команда орындалды:
        docker image build -t kz/orders:1.1 .

        Тапсырма: kz/orders:1.1 жинауы үшін кестені толтырыңыз.

        | № | Dockerfile нұсқауы                                      | Қайта жинау: CACHED немесе қайтадан, және неге | Нұсқаудан кейін не бар (қай кезеңде) |
        |---|---------------------------------------------------------|------------------------------------------------|--------------------------------------|
        | 1 | FROM python:3.12-slim AS builder                        |                                                |                                      |
        | 2 | COPY src/requirements.txt /tmp/                         |                                                |                                      |
        | 3 | RUN pip install --target /deps -r /tmp/requirements.txt |                                                |                                      |
        | 4 | FROM python:3.12-slim                                   |                                                |                                      |
        | 5 | CMD ["python", "server.py"]                             |                                                |                                      |
        | 6 | WORKDIR /app                                            |                                                |                                      |
        | 7 | COPY --from=builder /deps/ /app/deps/                   |                                                |                                      |
        | 8 | COPY src/ .                                             |                                                |                                      |

        Ұпай: 32 (8 жол × 4).
    - id: D04-Ф-03
      text: |
        gallery каталогында мыналар бар: Dockerfile, main.py, util.py (веб-сервер
        коды) және index.html (сервер беретін бет). builder кезеңі main.py және
        util.py файлдарын бір орындалатын /server файлына буып-түйеді (-p
        параметрі бар python -m zipapp: файлды бағдарлама сияқты тікелей іске
        қосуға болады).

        Dockerfile файлы:
        FROM python:3.12-slim AS builder
        COPY main.py util.py /build/
        RUN python -m zipapp /build -m "main:run" -p "/usr/bin/env python3" -o /server

        # қолданба
        FROM python:3.12-alpine
        CMD ["/web/server"]
        WORKDIR web
        COPY index.html .
        COPY --from=builder /server .

        Бастапқы күй:
        - python:3.12-slim және python:3.12-alpine базалық образдары жергілікті
          образдар кэшінде бар;
        - gallery каталогында docker image build -t kz/gallery:v1 . командасы
          орындалған — образ жиналған;
        - содан кейін тек index.html файлындағы мәтін өзгертілді; Dockerfile,
          main.py және util.py өзгертілген жоқ.

        Содан кейін сол каталогта мына команда орындалды:
        docker image build -t kz/gallery:v2 .

        Тапсырма: kz/gallery:v2 жинауы үшін кестені толтырыңыз.

        | № | Dockerfile нұсқауы                                                             | Қайта жинау: CACHED немесе қайтадан, және неге | Нұсқаудан кейін не бар (қай кезеңде) |
        |---|--------------------------------------------------------------------------------|------------------------------------------------|--------------------------------------|
        | 1 | FROM python:3.12-slim AS builder                                               |                                                |                                      |
        | 2 | COPY main.py util.py /build/                                                   |                                                |                                      |
        | 3 | RUN python -m zipapp /build -m "main:run" -p "/usr/bin/env python3" -o /server |                                                |                                      |
        | 4 | FROM python:3.12-alpine                                                        |                                                |                                      |
        | 5 | CMD ["/web/server"]                                                            |                                                |                                      |
        | 6 | WORKDIR web                                                                    |                                                |                                      |
        | 7 | COPY index.html .                                                              |                                                |                                      |
        | 8 | COPY --from=builder /server .                                                  |                                                |                                      |

        Ұпай: 32 (8 жол × 4).
  systemic:
    heading: ЖҮЙЕЛІК ДЕҢГЕЙ (44 ұпай)
    points: 44
    instructions: |
      4-тарау. Тексеру сценарийлері.

      Нұсқаулық. Әр сұрақта фрагмент берілген — Dockerfile, қолданба файлдары
      немесе Docker командаларының тізбегі — және компьютердің бастапқы күйінің
      сипаттамасы. 4 тексеру сценарийін (тест-кейс сияқты) ойлап табыңыз және
      оларды кестеге жазыңыз:

      | № | Бастапқы шарт немесе әрекет | Күтілетін нәтиже | Сценарий нені тексереді |
      |---|-----------------------------|------------------|-------------------------|

      - Бастапқы шарт немесе әрекет — нақты не істейсіз немесе не бересіз: ?
        белгілерінің орнындағы мәндер, жинау алдында қандай файл өзгертілді,
        командалар қандай ретпен орындалады.
      - Күтілетін нәтиже — Docker не көрсетеді (жинау сәтті ме, қай қадамдар
        кэштен алынады, қайсысы қайта орындалады, образда не бар, контейнер күйі,
        қате) немесе қолданба не көрсетеді (не басып шығарады немесе браузерде не
        көрінеді).
      - Сценарий нені тексереді — Docker-дің қай ережесі немесе фрагменттің қай
        тұжырымы расталады не теріске шығарылады.
      Сценарийлер әртүрлі нәтиже беруі керек. ID-лерді, хэштерді, өлшемдерді,
      уақытты және Docker хабарламаларының нақты мәтінін жазудың қажеті жоқ:
      нәтижені сөзбен сипаттау жеткілікті (мысалы: «жинау RUN қадамында құлайды»,
      «контейнер Up», «браузерде қате»).

      Жинау (build) белгілеуі және ережелері (қазіргі Docker, BuildKit):
      - WORKDIR, COPY және RUN қадамдары үшін «CACHED» (жинау кэшінен алынды)
        немесе «қайта» (орындалады) деп жазыңыз. Кезеңді (stage) көрсетіңіз:
        «builder: COPY — қайта».
      - ENV, CMD, EXPOSE тек образдың метадеректерін жазады және жинау
        шығысында жеке қадам ретінде көрсетілмейді — олар үшін «CACHED/қайта»
        жазудың қажеті жоқ.
      - Кезеңдер параллель жиналады. Тек соңғы кезең файл көшіретін (COPY --from)
        кезеңдер ғана орындалады — тікелей немесе басқа кезеңдер арқылы; қалған
        кезеңдер өткізіліп жіберіледі және жинау шығысында көрінбейді.
      - Әр кезеңнің өз кэші бар: кэштің сәйкес келмеуі (cache miss) тек өз
        кезеңінің қалған бөлігін қайта орындатады.

      Бағалау: 4 сценарий, әрқайсысы 8 ұпай (бастапқы шарт — 2, күтілетін нәтиже —
      3, нені тексереді — 3) = 32 ұпай + емтихан алушыға сценарийлерді қорғау —
      12 ұпай. Барлығы 44 ұпай.
    questions:
    - id: D04-С-01
      text: |
        Фрагмент. Тест кезеңі бар көп кезеңді Dockerfile (multi-stage Dockerfile).

        Жинау каталогы (контекст, build context):
            Dockerfile
            calc.py        — ҚҚС қосылған бағаны есептеу
            test_calc.py   — calc.py үшін модульдік тест (unit test)

        calc.py файлы:
            def vat(price):
                return round(price * 1.12, 2)


            if __name__ == "__main__":
                print("1000 тг с НДС:", vat(1000))

        test_calc.py файлы:
            import unittest
            from calc import vat


            class VatTest(unittest.TestCase):
                def test_vat(self):
                    self.assertEqual(vat(1000), 1120.0)


            if __name__ == "__main__":
                unittest.main()

        Dockerfile файлы:
            FROM python:3.12-slim AS builder
            WORKDIR /src
            COPY calc.py .
            RUN python -m py_compile calc.py

            FROM python:3.12-slim AS tester
            WORKDIR /test
            COPY --from=builder /src/calc.py .
            COPY test_calc.py .
            RUN python -m unittest -v test_calc

            FROM python:3.12-alpine
            WORKDIR /app
            COPY --from=builder /src/calc.py .
            CMD ["python", "calc.py"]

        Түсініктеме: python -m py_compile calc.py файлдың синтаксисін тексереді,
        синтаксистік қате болса, қатемен аяқталады. python -m unittest тесттерді
        іске қосады; тест өтпесе, команда қатемен аяқталады.

        Бастапқы күй: образ мына командамен жиналып қойған
            docker image build -t kz/vat:v1 .
        және жинау кэші (build cache) сақталған. Контейнерлер жоқ. Тексеру алдында
        жинау каталогының файлдары өзгертіледі, содан кейін мыналар орындалады:
            docker image build -t kz/vat:v2 .
            docker container run kz/vat:v2
            docker container run kz/vat:v2 ls /app

        Әріптес былай дейді: «tester кезеңі — біздің сапа бақылауымыз. Егер
        calc.py-да тест ұстайтын қате болса, жинау құлайды және kz/vat:v2 образы
        пайда болмайды. Сонымен бірге соңғы образда тесттер жоқ».

        Тапсырма. Әріптестің тұжырымын тексеретін 4 сценарий ойлап табыңыз.
        calc.py және test_calc.py файлдарын өзгертуге болады (Dockerfile-ды
        өзгертпеңіз). Әр сценарий үшін бастапқы шартты (екінші жинау алдында не
        өзгертілді), күтілетін нәтижені (жинау сәтті ме, қай кезеңдер орындалады,
        қай қадамдар CACHED, қайсысы қайта, run командалары не басып шығарады) және
        сценарий нені тексеретінін көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
    - id: D04-С-02
      text: |
        Фрагмент. «Оңтайландырудан» кейінгі веб-сайттың Dockerfile файлы
        (4-тараудың зертханалық жұмысы негізінде).

        Жинау каталогы (контекст, build context):
            Dockerfile
            README.md           — командаға арналған сипаттама; жиі өзгереді
            app/__main__.py     — веб-сервер коды; сирек өзгереді
            static/index.html   — сайт беті; дизайнерлер оны күн сайын түзетеді

        app/__main__.py файлы:
            from http.server import HTTPServer, SimpleHTTPRequestHandler

            print("Сервер запущен на порту 8000", flush=True)
            HTTPServer(("", 8000), SimpleHTTPRequestHandler).serve_forever()

        (Сервер ағымдағы жұмыс каталогындағы файлдарды береді, / мекенжайы
        бойынша — index.html.)

        Dockerfile файлы:
            FROM python:3.12 AS builder
            WORKDIR /src
            COPY . .
            RUN python -m zipapp app -o server.pyz

            FROM python:3.12-alpine
            WORKDIR /web
            COPY --from=builder /src/server.pyz .
            COPY static/index.html .
            CMD ["python", "server.pyz"]

        Түсініктеме: python -m zipapp app -o server.pyz app каталогын бір
        server.pyz архив-файлына буып-түйеді (JAR файлының баламасы); архив
        python server.pyz командасымен іске қосылады. python:3.12 образы — үлкен,
        жинау құралдары бар; python:3.12-alpine — ықшам (минималды).

        Бұрын сайт бір кезеңді Dockerfile арқылы жиналатын, және HTML-ды әр
        түзеткенде қолданба қайта жиналатын. Әріптес Dockerfile-ды қайта жазып,
        былай дейді: «1) Тек static/index.html өзгертілсе, server.pyz архиві қайта
        жиналмайды — тек соңғы қадам орындалады. 2) Соңғы образда тек server.pyz
        және index.html бар — бастапқы код та, README.md да жоқ».

        Бастапқы күй: образ мына командамен жиналып қойған
            docker image build -t kz/gallery:v1 .
        және жинау кэші сақталған. Контейнерлер жоқ. Тексеру алдында жинау
        каталогының файлдары өзгертіледі, содан кейін мына команда орындалады:
            docker image build -t kz/gallery:v2 .
        және қажет болса
            docker container run kz/gallery:v2 ls /web
            docker container run -d -p 8000:8000 kz/gallery:v2   (браузер: http://localhost:8000)

        Тапсырма. Әріптестің екі тұжырымын да тексеретін 4 сценарий ойлап табыңыз.
        Жинау каталогының файлдарын өзгертуге болады (Dockerfile-ды өзгертпеңіз).
        Әр сценарий үшін бастапқы шартты (екінші жинау алдында не өзгертілді),
        күтілетін нәтижені (әр кезеңнің қай қадамдары CACHED, қайсысы қайта;
        образда не бар немесе браузерде не көрінеді) және сценарий нені
        тексеретінін көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
    - id: D04-С-03
      text: |
        Фрагмент. Docker желісіндегі екі контейнерден тұратын үлестірілген
        қолданба.

        kz/quotes-api образы — дәйексөздер қызметі (REST API): іске қосылғанда
        контейнер ішінде 5000 портын тыңдайды; GET /quote сұрауы «Білім — бақыт
        кілті» мәтінін қайтарады.

        kz/gallery образы — веб-қолданба. gallery.py файлы:
            import os, urllib.request
            from flask import Flask

            app = Flask(__name__)
            url = os.getenv("QUOTES_URL")

            @app.route("/")
            def index():
                try:
                    text = urllib.request.urlopen(url, timeout=3).read().decode()
                    return f"Цитата дня: {text}"
                except Exception:
                    return f"Ошибка: сервис цитат недоступен ({url})", 502

            app.run(host="0.0.0.0", port=8080)

        kz/gallery образының Dockerfile файлы:
            FROM python:3.12-slim
            ENV QUOTES_URL="http://quotes:5000/quote"
            CMD ["python", "/web/gallery.py"]

            WORKDIR web
            COPY gallery.py .

        Бастапқы күй: екі образ да жергілікті кэште бар. Контейнерлер жоқ,
        стандарттылардан басқа желілер жоқ.

        Тексерілетін тізбек (? белгісі — сіз таңдайтын мәндер):
            docker network create ?
            docker container run -d --name ? --network ? kz/quotes-api
            docker container run -d --name gallery -p ? --network ? ? kz/gallery
            браузерде: http://localhost:<хост порты>

        ? орнында — желі атауы, контейнер атауы, -p үшін хост_порты:контейнер_порты
        түріндегі мән. --network ? жалаушасын түсіріп тастауға болады. Үшінші
        командадағы соңғы ? — АТАУ=мән түріндегі --env (-e) жалаушалары немесе
        ештеңе. Командалар арасында docker container stop / rm орындауға және
        командаларды қайталауға болады.

        Тапсырма. Нәтижелері әртүрлі 4 сценарий ойлап табыңыз: қолданба жұмыс
        істейді, дәйексөздер қызметі табылмайды, бет ашылмайды және т. б. Әр
        сценарий үшін бастапқы шартты (? мәндері, командалар реті), күтілетін
        нәтижені (браузерде не көрінеді, контейнерлер күйі, Docker қатесі) және
        сценарий нені тексеретінін көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
