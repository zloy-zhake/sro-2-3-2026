    - id: F11-С-03
      text: |
        open System.IO

        module Log =
            let append path (text: string) =
                File.AppendAllText(path, text)
                path

        // Скопировать текст источника в журнал log.txt (без пробелов по краям,
        // в верхнем регистре) и вернуть длину журнала
        let copyToLog source =
            source
            |> File.ReadAllText
            |> fun text -> text.Trim().ToUpper()
            |> Log.append "log.txt"
            |> FileInfo
            |> fun info -> info.Length

        // Перед вызовом: source.txt содержит ?, log.txt содержит ? (или его нет)
        copyToLog "source.txt"

        Требование: после вызова copyToLog "source.txt" файл log.txt содержит ТОЛЬКО текст из source.txt — без пробелов и переводов строки по краям, в верхнем регистре; прежнее содержимое журнала не сохраняется. Функция возвращает длину этого текста (тип int64, например 5L). Если файла source.txt нет, функция завершается исключением FileNotFoundException.
        Входные данные теста: содержимое source.txt (или «файла нет») и содержимое log.txt до вызова (или «файла нет»).
        Справка: File.ReadAllText path — весь текст файла; если файла нет — исключение FileNotFoundException. File.AppendAllText(path, text) — дописывает text в КОНЕЦ файла; если файла нет — создаёт его. FileInfo path — конструктор (constructor) объекта с данными о файле; свойство Length — размер файла (int64). Используйте в тестах только латинские буквы, цифры и пробелы — тогда размер равен числу символов. Trim() убирает пробелы и переводы строки по краям, ToUpper() переводит в верхний регистр.

