  functional:
    heading: ФУНКЦИОНАЛЬНЫЙ УРОВЕНЬ (32 балла)
    points: 32
    instructions: |
      Инструкция студенту. Даны файлы, исходное состояние и последовательность
      из 8 событий: запросы к приложению, команды Docker, наблюдения в
      Prometheus или Grafana. События выполняются строго по порядку, в Linux.
      t — время в секундах; в первом столбце указано, когда происходит событие
      и в какой момент выполняется наблюдение. Первый столбец таблицы заполнен.
      Заполните два других столбца для каждой строки:
        - «Значение метрики» — что в этот момент отдаёт приложение по адресу
          /metrics (значения метрик (metrics) из условия; если контейнеров
          несколько — по каждому контейнеру); если приложение не работает —
          так и напишите;
        - «Что покажет Prometheus или Grafana» — результат наблюдения,
          указанного в строке: серии (time series) с метками (labels) и
          значениями, состояние целей (targets), значения панелей Grafana или
          «пусто / No data», — и с какого опроса (scrape) взяты значения.
      Нотация: значение в приложении — `tickets_sold_total 2`; серия в
      Prometheus — `tickets_sold_total{instance="tickets:5000", job="concert"} 2`
      (метки, которые не меняются от строки к строке, можно не повторять);
      цель — `tickets:5000 UP` / `DOWN`. Числа можно писать как 2 или 2.0.
      IP-адреса контейнеров неизвестны — пишите <IP>:5000.

      Справка — правила Prometheus 3 / Grafana / клиента Python, которых нет в
      главе 9 или которые в книге описаны кратко:
        1. Prometheus сам приходит за метриками (pull): опрашивает /metrics
           каждой цели раз в scrape_interval. В заданиях опросы идут в
           t = 0, 10, 20, 30, … (все цели одновременно, опрос мгновенный);
           события не совпадают с моментами опросов. Приложение ничего в
           Prometheus не отправляет.
        2. Запрос в интерфейсе Prometheus (страница Query — в книге она
           называется Graph; вкладка Table) показывает для каждой серии
           последнее значение, собранное опросом. Вкладка Graph рисует значения, собранные в
           моменты опросов. Изменение, которое произошло и исчезло между двумя
           опросами, в Prometheus не попадает.
        3. Серия = имя метрики + набор меток. Prometheus добавляет метки
           job (= job_name) и instance (адрес цели: для static_configs — как
           записано в targets, например tickets:5000; для dns_sd_configs —
           IP-адрес контейнера и порт). dns_sd_configs с type: A создаёт по
           одной цели на каждый IP-адрес, который вернул DNS для имени, и
           обновляет список каждые refresh_interval; новая цель впервые
           опрашивается не позже чем через scrape_interval.
        4. Клиент prometheus_client (Python) хранит значения в памяти процесса.
           Counter — только inc(); Gauge — inc(), dec(), set(). У метрики с
           метками строка со значением появляется в /metrics только после
           первого вызова labels(...) с этими значениями меток, до этого есть
           лишь строки # HELP и # TYPE. Служебные строки *_created,
           python_*, process_* в заданиях не учитывайте.
        5. Если цель не отвечает (контейнер не работает), опрос неудачен:
           цель на странице Status -> Target health (в книге — Targets) имеет
           состояние DOWN, а её серии пропадают из результатов запросов. В
           заданиях наблюдения назначены так, что к ним серии уже пропали.
        6. sum(выражение) without(метки) отбрасывает перечисленные метки и
           складывает серии, у которых остальные метки совпадают. Фильтр
           {code="500"} оставляет только серии с этим значением метки. Если
           подходящих серий нет — результат пустой (Prometheus: Empty query
           result; Grafana: No data).
        7. Grafana приложения не опрашивает: каждая панель выполняет свой
           PromQL-запрос к Prometheus. Панель Stat показывает последнее
           значение, которое Prometheus собрал к моменту наблюдения (перед
           наблюдением дашборд обновляется).
        8. docker container kill останавливает контейнер сразу;
           docker container start запускает тот же контейнер (тот же ID и
           hostname), приложение отвечает через 1 с. Запросы к приложению
           выполняются curl, каждый — после ответа на предыдущий, если не
           сказано «параллельно».

      Оценка: 8 строк по 4 балла (2 балла — значение метрики, 2 балла — что
      покажет Prometheus или Grafana). Итого 32 балла. Ответ поясните устно.
    questions:
    - id: D09-Ф-01
      text: |
        Исходное состояние:
        - каталог проекта называется concert, в нём файлы compose.yaml и
          prometheus.yml (ниже); образ kz/tickets:v1 собран из app.py (Flask и
          prometheus_client установлены в образе);
        - выполнено docker compose up -d; работают контейнеры concert-tickets-1
          и concert-prometheus-1;
        - t = 0 — первый опрос Prometheus; запросов к приложению до этого не было.

        Файл compose.yaml:
        services:
          tickets:
            image: kz/tickets:v1
            ports:
              - "8020:5000"

          prometheus:
            image: prom/prometheus:v3.0.0
            ports:
              - "9090:9090"
            volumes:
              - ./prometheus.yml:/etc/prometheus/prometheus.yml

        Файл prometheus.yml:
        global:
          scrape_interval: 10s

        scrape_configs:
          - job_name: "concert"
            metrics_path: /metrics
            static_configs:
              - targets: ["tickets:5000"]

        Файл app.py:
        from flask import Flask
        from prometheus_client import Counter, Gauge, generate_latest, CONTENT_TYPE_LATEST

        app = Flask(__name__)
        left = 4  # свободных мест в зале

        SOLD = Counter("tickets_sold_total", "Tickets sold")
        LEFT = Gauge("tickets_left", "Free seats left")
        LEFT.set(left)

        @app.route("/buy")
        def buy():
            global left
            if left == 0:
                return "sold out", 409  # мест нет: метрики не меняются
            left -= 1
            SOLD.inc()
            LEFT.set(left)
            return "ticket ok"

        @app.route("/refund")
        def refund():
            global left
            left += 1  # билет вернули: место снова свободно
            LEFT.set(left)
            return "refund ok"

        @app.route("/metrics")
        def metrics():
            return generate_latest(), 200, {"Content-Type": CONTENT_TYPE_LATEST}

        app.run(host="0.0.0.0", port=5000)

        Запросы /buy и /refund отправляются на http://localhost:8020.
        QUERY — в интерфейсе Prometheus (http://localhost:9090, страница Query,
        вкладка Table) выполнить два запроса: tickets_sold_total и tickets_left.

