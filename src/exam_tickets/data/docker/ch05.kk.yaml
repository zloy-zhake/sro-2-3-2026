subject: docker
language: kk
file_chapter: 5
chapters:
- 5
chapter_titles:
- Sharing images with Docker Hub and other registries
levels:
  cognitive:
    heading: КОГНИТИВТІК ДЕҢГЕЙ (24 ұпай)
    points: 24
    instructions: |
      Студентке нұсқаулық.
      Әр сұраққа фрагмент берілген: Docker командалары (жинау, тегтер, образдарды тіркелгіге жіберу — push, жүктеп алу — pull), қажет болса Dockerfile және бастапқы күйдің сипаттамасы. Фрагменттен кейін осы фрагмент туралы 5 тұжырым берілген.
      Тапсырмалардағы reg.school.kz:5010 — компанияның шартты тіркелгісі (registry); ол жұмыс істейді және Docker онымен жұмыс істеуге бапталған деп есептеңіз.
      Әр тұжырымға «дұрыс» немесе «дұрыс емес» деп жазып, жауабыңызды негіздеңіз: мұнда Docker-дің қандай ережесі әрекет етеді және фрагменттегі нақты не соны көрсетеді. Дұрыс емес тұжырым үшін шын мәнінде қалай болатынын айтыңыз.
      Бағалау: 1–4 тұжырымдар — әрқайсысы 5 ұпай («дұрыс/дұрыс емес» үшін 1 ұпай, негіздеме үшін 4 ұпай); 5-тұжырым — 4 ұпай (1 + 3).
      Негіздемесіз «дұрыс/дұрыс емес» жауабы тек 1 ұпаймен бағаланады.
      Сұрақ бойынша барлығы — 24 ұпай.
    questions:
    - id: D05-К-01
      text: |
        Фрагмент.
        Docker орнатылған компьютер. Студенттің Docker Hub-та аккаунты (account) бар — kzstudent. Компанияда reg.school.kz:5010 мекенжайы бар өз тіркелгісі (registry) жұмыс істейді; осы компьютердегі Docker онымен жұмыс істеуге бапталған. Жоба каталогында Dockerfile бар; оның бірінші жолы:
        FROM python:3.12-slim

        Наурызда хост терминалында, жоба каталогында, мына командалар орындалды
        (барлығы сәтті орындалды):
        > docker image build -t shop/api .
        > docker image tag shop/api kzstudent/api:1.4
        > docker image tag shop/api reg.school.kz:5010/shop/api:1.4
        > docker image tag shop/api reg.school.kz:5010/shop/api:latest
        > docker image push reg.school.kz:5010/shop/api:1.4
        > docker image push reg.school.kz:5010/shop/api:latest

        Сәуірде код өзгертіліп, мына командалар орындалды (бұлар да сәтті):
        > docker image build -t shop/api:1.5 .
        > docker image tag shop/api:1.5 reg.school.kz:5010/shop/api:1.5
        > docker image push reg.school.kz:5010/shop/api:1.5

        reg.school.kz:5010 тіркелгісінің shop/api репозиторийіне басқа push командалары орындалмаған.

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. Бірінші командадағы shop/api образ сілтемесі (image reference) — docker.io/shop/api:latest сілтемесінің қысқа түрі: тіркелгі домені көрсетілмесе, Docker Hub қойылады, ал тег (tag) көрсетілмесе — latest тегі. (5 ұпай)
        2. reg.school.kz:5010/shop/api:1.4 сілтемесіндегі reg.school.kz:5010 бөлігі — Docker Hub-тағы аккаунт атауы, сондықтан push командасы образды Docker Hub-қа жіберді. (5 ұпай)
        3. docker image push kzstudent/api:1.4 командасы сол образды reg.school.kz:5010-ға емес, Docker Hub-қа — kzstudent аккаунтының api репозиторийіне (repository) жіберер еді. (5 ұпай)
        4. Мамырда басқа компьютерде docker image pull reg.school.kz:5010/shop/api командасы орындалды — ол 1.5 нұсқасын жүктеп алады, өйткені latest тегі әрқашан ең жаңа нұсқаны білдіреді. (5 ұпай)
        5. FROM python:3.12-slim жолында python — репозиторий атауы, 3.12-slim — тег; тіркелгі көрсетілмеген, сондықтан жергілікті кэште жоқ образды Docker Docker Hub-тан жүктеп алады. (4 ұпай)
    - id: D05-К-02
      text: |
        Фрагмент.
        Linux және Docker орнатылған компьютер. reg.school.kz:5010 тіркелгісі (registry) бос; Docker онымен жұмыс істеуге бапталған. Студенттің Docker Hub-тағы аккаунты (account) — kzstudent. api каталогында үш файл бар: Dockerfile, requirements.txt (бір жол: flask) және app.py (қолданба). python:3.12-slim базалық образы (base image) жергілікті образдар кэшінде бар; shop/api және kzstudent/api образдары әлі жоқ.

        Dockerfile файлы:
        FROM python:3.12-slim
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install -r requirements.txt
        COPY app.py .
        CMD ["python", "app.py"]

        Хост терминалында, api каталогында, мына командалар ретімен орындалды
        (барлығы сәтті орындалды):
        > docker image build -t shop/api:1.0 .
        > docker image tag shop/api:1.0 reg.school.kz:5010/shop/api:1.0
        > docker image tag shop/api:1.0 kzstudent/api:1.0
        > docker image push reg.school.kz:5010/shop/api:1.0
        > docker image push reg.school.kz:5010/shop/api:1.0
        > docker image rm shop/api:1.0

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. Екі docker image tag командасынан кейін компьютерде үш бөлек образ бар, әрқайсысында қабаттардың (layers) өз көшірмесі бар, сондықтан образдар дискіде shop/api:1.0-ден үш есе көп орын алады. (5 ұпай)
        2. docker image rm shop/api:1.0 командасы образды қабаттарымен бірге жойды, сондықтан одан кейін kzstudent/api:1.0 сілтемесі енді жұмыс істемейді. (5 ұпай)
        3. Екінші (қайталанған) push образдың барлық қабаттарын тіркелгіге қайтадан жібереді, өйткені push образды әрқашан толығымен жібереді. (5 ұпай)
        4. Егер осы командалардан кейін тек app.py өзгертіліп, shop/api:1.1 образы жиналса, оған reg.school.kz:5010/shop/api:1.1 сілтемесі берілсе және ол үшін push орындалса, образ қабаттарының ішінен тіркелгіге тек COPY app.py . нұсқаулығының қабаты жіберіледі. (5 ұпай)
        5. Бірінші push бос тіркелгіге образдың барлық қабаттарын, соның ішінде python:3.12-slim базалық образының қабаттарын да жіберді. (4 ұпай)
    - id: D05-К-03
      text: |
        Фрагмент.
        shop жобасының командасы веб-қолданбаны reg.school.kz:5010 тіркелгісінде
        (registry), shop/web репозиторийінде (repository) жариялайды. Нұсқалар
        [major].[minor].[patch] түрінде. Әр шығарылым (релиз) үшін бірдей
        командалар жиыны орындалады; 1.4.2 релизіне мысал (барлық командалар
        сәтті орындалды):
        > docker image build -t reg.school.kz:5010/shop/web:1.4.2 .
        > docker image tag reg.school.kz:5010/shop/web:1.4.2 reg.school.kz:5010/shop/web:1.4
        > docker image tag reg.school.kz:5010/shop/web:1.4.2 reg.school.kz:5010/shop/web:1
        > docker image tag reg.school.kz:5010/shop/web:1.4.2 reg.school.kz:5010/shop/web:latest
        > docker image push reg.school.kz:5010/shop/web:1.4.2
        > docker image push reg.school.kz:5010/shop/web:1.4
        > docker image push reg.school.kz:5010/shop/web:1
        > docker image push reg.school.kz:5010/shop/web:latest

        Айлар бойынша релиздер (әрқайсысы үшін — өз нөмірлерімен сол командалар жиыны):

        | Ай     | Релиз нұсқасы |
        |--------|---------------|
        | наурыз | 1.4.2         |
        | сәуір  | 1.4.7         |
        | мамыр  | 1.5.0         |
        | маусым | 2.0.1         |

        shop/web репозиторийіне басқа push болған жоқ, тегтер тіркелгіден жойылмаған. Басқа команда (тұтынушы) бұл образды өз Dockerfile-ында базалық образ ретінде пайдаланады.

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. Мамыр релизінен кейін shop/web:1 тегі (tag) 1.5.0 нұсқасын, ал shop/web:1.4 тегі 1.4.7 нұсқасын көрсетеді. (5 ұпай)
        2. Маусым релизінен кейін shop/web:1 тегі 2.0.1 нұсқасын көрсетеді, өйткені бұл ең жаңа нұсқа. (5 ұпай)
        3. FROM reg.school.kz:5010/shop/web:1.4.2 жазған тұтынушы маусымда қайта жинағанда наурыздағыдай базалық образды алады, бірақ 1.4.7 нұсқасындағы түзетулерді алмайды. (5 ұпай)
        4. Тұтынушыға ең сенімдісі — FROM reg.school.kz:5010/shop/web:latest жазу: сонда наурыздағы және маусымдағы жинау бірдей нәтиже береді. (5 ұпай)
        5. Маусым релизінен кейін орындалған docker image pull reg.school.kz:5010/shop/web командасы 2.0.1 нұсқасын жүктеп алады. (4 ұпай)
  functional:
    heading: ФУНКЦИОНАЛДЫҚ ДЕҢГЕЙ (32 ұпай)
    points: 32
    instructions: |
      Нұсқаулық. 8 командадан (әрекеттен) тұратын тізбек және бастапқы күй берілген. Командалар қатаң ретпен орындалады, әрқайсысы алдыңғысы аяқталғаннан кейін. Кестенің бірінші бағаны толтырылған. Әр жол үшін қалған екі бағанды толтырыңыз:
        - «Командадан кейінгі күй» — жергілікті кэште қандай образ сілтемелері (image references) бар және олардың қайсысы бір образды (бір ID) көрсетеді, қандай контейнерлер (containers) бар және қандай күйде, тіркелгіде (registry) қандай репозиторийлер мен тегтер (tags) бар;
        - «Шығыс немесе нәтиже» — пайдаланушы терминалда не көреді (сөзбен; хабарламалардың нақты мәтіні, қабаттардың ID-лері, дайджесттер, өлшемдер мен уақыт шартта берілмесе, талап етілмейді).
      Белгілеу:
        - жергілікті: `shop/web:v1, reg.school.kz:5010/shop/web:v1 (бір ID)`;
        - тіркелгі: `shop/web [v1, v2]` — репозиторий және оның тегтері;
        - контейнер: `5a7c: Up` / `5a7c: Exited (0)` / `5a7c: жойылды` (контейнерді оның ID-інің алғашқы таңбаларымен белгілеуге болады);
        - push шығысы қабаттар (layers) бойынша: «жіберілді» (Pushed) немесе «бұрыннан бар» (Layer already exists).
      Күй өзгермесе, «өзгеріссіз» деп жазып, нақты не қалғанын көрсетіңіз.
      Бағалау: 8 жол, әрқайсысы 4 ұпай (күй бағаны — 2 ұпай, нәтиже бағаны — 2 ұпай). Барлығы 32 ұпай. Жауабыңызды ауызша түсіндіріңіз.
    questions:
    - id: D05-Ф-01
      text: |
        Бастапқы күй:
        - жергілікті образдар кэшінде shop/web:v1 образы (Python-дағы веб-қолданба) және registry:2 тіркелгі образы бар; басқа образдар жоқ;
        - контейнерлер жоқ; компьютердің 5010 порты бос;
        - reg.school.kz атауы осы компьютерді көрсетеді; Docker қозғалтқышына reg.school.kz:5010 тіркелгісімен HTTP арқылы жұмыс істеуге рұқсат етілген (daemon.json файлында ол insecure-registries ішінде көрсетілген);
        - registry:2 контейнері — тіркелгі (registry): ол контейнер ішінде 5000 портын тыңдайды және образдарды өзінің /var/lib/registry каталогында сақтайды; оған атаулы том (volume) да, хост каталогы да қосылмайды.

        Docker контейнерлерге мына ID-лерді берді: 1-жол — 5a7c3e91d0b2, 7-жол — 8b14f6c2a9e0.

        Тапсырма: кестені толтырыңыз.

        | № | Команда                                                             | Командадан кейінгі күй | Шығыс немесе нәтиже |
        |---|---------------------------------------------------------------------|------------------------|---------------------|
        | 1 | docker container run -d -p 5010:5000 --restart always registry:2    |                        |                     |
        | 2 | docker image tag shop/web:v1 reg.school.kz:5010/shop/web:v1         |                        |                     |
        | 3 | docker image push reg.school.kz:5010/shop/web:v1                    |                        |                     |
        | 4 | docker image push reg.school.kz:5010/shop/web:v1                    |                        |                     |
        | 5 | docker image push reg.school.kz:5010/shop/web:v2                    |                        |                     |
        | 6 | docker image rm reg.school.kz:5010/shop/web:v1                      |                        |                     |
        | 7 | docker container rm -f 5a                                           |                        |                     |
        |   | содан кейін қайтадан: docker container run -d -p 5010:5000          |                        |                     |
        |   | --restart always registry:2                                         |                        |                     |
        | 8 | docker image pull reg.school.kz:5010/shop/web:v1                    |                        |                     |

        Ұпай: 32 (8 жол × 4).
    - id: D05-Ф-02
      text: |
        Бастапқы күй:
        - reg.school.kz:5010 тіркелгісі жұмыс істеп тұр, екі компьютер де онымен HTTP арқылы жұмыс істей алады. Тіркелгіде shop/api репозиторийі бар, оның 1.0.3, 1.0, 1, latest тегтері — төртеуі де бір образды, 1.0.3 шығарылымын көрсетеді (қолданба «api 1.0.3» жолын басып шығарады да, аяқталады);
        - жинау компьютері К1: жергілікті кэште дәл сол төрт сілтеме reg.school.kz:5010/shop/api:1.0.3, :1.0, :1, :latest (бір ID). К1 кэшінде python:3.12-slim базалық образы да бар. Ағымдағы каталогта Dockerfile және app.py жатыр; app.py файлы өзгертіліп қойған — енді ол «api 1.1.0» басып шығарады;
        - К2 тест сервері: бір ай бұрын онда docker image pull reg.school.kz:5010/shop/api:1 орындалған; К2-де shop/api-дің басқа образдары жоқ, контейнерлер жоқ.

        Dockerfile файлы:
        FROM python:3.12-slim
        WORKDIR /app
        COPY app.py .
        CMD ["python", "app.py"]

        1–4-жолдардың командалары К1-де, 5–8-жолдардікі К2-де орындалады.
        К2-дегі Docker контейнерлерге мына ID-лерді берді: 5-жол — 2f6a90d1c3e7, 7-жол — 6d08b5e2f914, 8-жол — a93c71e40b5d.

        Тапсырма: кестені толтырыңыз.

        | № | Қайда | Команда                                                          | Командадан кейінгі күй | Шығыс немесе нәтиже |
        |---|-------|------------------------------------------------------------------|------------------------|---------------------|
        | 1 | К1    | docker image build -t reg.school.kz:5010/shop/api:1.1.0 .        |                        |                     |
        | 2 | К1    | docker image tag reg.school.kz:5010/shop/api:1.1.0               |                        |                     |
        |   |       |                  reg.school.kz:5010/shop/api:1.1                 |                        |                     |
        | 3 | К1    | docker image tag reg.school.kz:5010/shop/api:1.1.0               |                        |                     |
        |   |       |                  reg.school.kz:5010/shop/api:1                   |                        |                     |
        | 4 | К1    | docker image push --all-tags reg.school.kz:5010/shop/api         |                        |                     |
        | 5 | К2    | docker container run reg.school.kz:5010/shop/api:1               |                        |                     |
        | 6 | К2    | docker image pull reg.school.kz:5010/shop/api:1                  |                        |                     |
        | 7 | К2    | docker container run reg.school.kz:5010/shop/api:1               |                        |                     |
        | 8 | К2    | docker container run reg.school.kz:5010/shop/api:latest          |                        |                     |

        Ұпай: 32 (8 жол × 4).
    - id: D05-Ф-03
      text: |
        Бастапқы күй:
        - reg.school.kz:5010 тіркелгісі жұмыс істеп тұр, онымен HTTP арқылы жұмыс істеуге болады; онда API арқылы жою қосулы; тіркелгіде shop/ui репозиторийі әзірге жоқ;
        - жергілікті кэште екі образ бар: A образы («ui 2.9.1» басып шығарады) — reg.school.kz:5010/shop/ui:2.9.1 сілтемесі; B образы («ui 3.0.4» басып шығарады) — reg.school.kz:5010/shop/ui:3.0.4, :3.0, :3, :latest сілтемелері;
        - тіркелгіге жіберілгеннен кейін A образының манифесі (manifest) sha256:51c0… дайджестіне (digest), B образыныкі — sha256:7d1e… дайджестіне ие болады (бір образдың барлық тегтерінде дайджест бірдей).

        Registry API v2 сұраулары (HTTP-сұраулар, мысалы curl арқылы):
        - GET  /v2/<репозиторий>/tags/list — тегтер тізімі JSON түрінде:
          {"name": "<репозиторий>", "tags": [...]};
        - HEAD /v2/<репозиторий>/manifests/<тег> (қажетті Accept тақырыбымен) — жауаптың Docker-Content-Digest тақырыбында манифест дайджесті келеді;
        - DELETE /v2/<репозиторий>/manifests/<дайджест> — манифесті жояды; тек дайджест бойынша жоюға болады, тег бойынша емес.
        Кестеде R = http://reg.school.kz:5010.

        Тапсырма: кестені толтырыңыз.

        | № | Команда немесе сұрау                                              | Командадан кейінгі күй | Шығыс немесе нәтиже |
        |---|-------------------------------------------------------------------|------------------------|---------------------|
        | 1 | docker image push --all-tags reg.school.kz:5010/shop/ui           |                        |                     |
        | 2 | GET R/v2/shop/ui/tags/list                                        |                        |                     |
        | 3 | HEAD R/v2/shop/ui/manifests/3                                     |                        |                     |
        | 4 | DELETE R/v2/shop/ui/manifests/sha256:7d1e…                        |                        |                     |
        | 5 | GET R/v2/shop/ui/tags/list                                        |                        |                     |
        | 6 | docker image ls --filter reference=reg.school.kz:5010/shop/ui     |                        |                     |
