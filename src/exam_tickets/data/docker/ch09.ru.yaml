  systemic:
    heading: СИСТЕМНЫЙ УРОВЕНЬ (44 балла)
    points: 44
    instructions: |
      Глава 9. Сценарии проверки.

      Инструкция. В каждом вопросе дан фрагмент — файлы приложения, файл
      Docker Compose (compose.yaml), конфигурация Prometheus (prometheus.yml),
      файлы Grafana — и описание исходного состояния: какие образы (images)
      собраны, какие контейнеры есть. Придумайте 4 сценария проверки (как
      тест-кейсы) и запишите их в таблицу:

      | № | Исходное условие или действие | Ожидаемый результат | Что проверяет сценарий |
      |---|-------------------------------|---------------------|------------------------|

      - Исходное условие или действие — что именно вы делаете или задаёте:
        какие команды docker / docker compose и в каком порядке выполняются,
        сколько секунд вы ждёте между ними, что изменено перед ними (строка
        prometheus.yml, файла Grafana или кода), какой сервис остановлен,
        какие запросы и сколько раз отправлены приложению.
      - Ожидаемый результат — что покажет Prometheus, Grafana или приложение:
        цели (targets) задания и их статус UP / DOWN; сколько строк (серий) и
        какие значения покажет запрос на странице запросов Prometheus в виде
        таблицы (Table); что покажет панель Grafana (число, линия графика,
        No data); что ответило приложение (например, ticket 3, ошибка 500).
      - Что проверяет сценарий — какое правило Docker / Prometheus / Grafana
        или какое утверждение из задания подтверждается или опровергается.
      Сценарии должны давать разные исходы. ID контейнеров, IP-адреса,
      точное время и точный текст сообщений не нужны: пишите <id1>, <IP1>,
      время указывайте приблизительно («примерно через 15 с»), результат
      описывайте словами (например: «у задания одна цель, статус DOWN», «две
      строки, значения 4 и 6», «панель No data»).

      Справка (правила, которые нужны для ответа):
      - Prometheus собирает метрики сам (pull): каждые scrape_interval он
        отправляет запрос GET <metrics_path> каждой цели (target) и сохраняет
        полученные значения с отметкой времени. Между опросами Prometheus и
        Grafana показывают значения последнего опроса. Первый опрос — в
        течение одного scrape_interval после запуска Prometheus.
      - Цель записывается как <хост>:<порт>. Хост ищется через DNS сети, в
        которой работает контейнер Prometheus. Внутри контейнера localhost —
        это сам этот контейнер. Контейнеры одного проекта Compose находят друг
        друга по имени сервиса; порт — порт контейнера, а не опубликованный
        порт хоста.
      - static_configs: каждая строка в targets — одна цель. Если имени
        соответствуют несколько контейнеров, при каждом опросе Prometheus
        обращается только к одному из них (по книге — к первому адресу из
        ответа DNS).
      - dns_sd_configs с type: A: Prometheus запрашивает у DNS все адреса
        имени (повторно — каждые 30 с) и делает отдельную цель для каждого
        адреса.
      - К каждой серии Prometheus добавляет метки (labels) job (имя задания) и
        instance (адрес цели: как записано в targets, а для dns_sd_configs —
        <IP>:<порт>).
      - Status → Targets (в Prometheus 3 — Status → Target health): список
        целей со статусом UP (последний опрос успешен) или DOWN (опрос не
        удался, например connection refused). Если опрос цели не удался или
        серия пропала из ответа цели, серия сразу исчезает из таблицы на
        странице запросов, а линия на графике обрывается.
      - Счётчик (counter) только растёт; датчик (gauge) может расти и
        уменьшаться (inc, dec, set). Значения метрик хранятся в памяти
        процесса приложения: новый процесс (перезапуск контейнера, новый
        контейнер) начинает с начальных значений из кода (для счётчика — 0).
      - Python-клиент prometheus_client: Counter("x_total", ...) выводится в
        /metrics как x_total (служебные строки x_created в заданиях не
        показаны и не нужны); Gauge("y", ...) — как y. У Counter нет метода
        dec(), а inc() с отрицательным числом вызывает исключение ValueError
        (Flask отвечает 500 Internal Server Error).
      - PromQL: sum(m) without(a, b) складывает серии метрики m, отбрасывая
        метки a и b; серии, которые различаются другими метками, остаются
        отдельными строками.
      - Prometheus читает свой файл конфигурации при запуске контейнера.
        Grafana читает файлы provisioning (источник данных (data source),
        провайдер дашбордов, JSON дашбордов) при запуске контейнера.
      - docker compose up -d пересоздаёт контейнер сервиса, только если
        изменилось описание сервиса в compose.yaml или образ с тем же тегом
        пересобран; остальные контейнеры продолжают работать как есть.
        Изменение содержимого смонтированного файла контейнер не пересоздаёт.
      - Имя хоста (hostname) в контейнере — ID контейнера. Контейнеры проекта
        называются <проект>-<сервис>-<номер>; проект — имя каталога с
        compose.yaml.
      - Приложения во фрагментах останавливаются командой stop около 10 с.

      Оценка: 4 сценария по 8 баллов (исходное условие — 2, ожидаемый результат — 3,
      что проверяет — 3) = 32 балла + защита сценариев у экзаменатора — 12 баллов.
      Итого 44 балла.
