        class Januar {
          String dybys() {
            return "...";
          }
        }

        class It extends Januar {
          String dybys() {
            return "hav";
          }
        }

        class Mysyq extends Januar {
          String dybys() {
            return "miau";
          }
        }

        class Balyq extends Januar {
        }

        class Qora {                       // қора — жануарлар тізімі (MyAnimalList)
          private Januar[] januarlar = new Januar[5];
          private int kelesi = 0;

          void qos(Januar j) {
            if (kelesi <= januarlar.length) {
              januarlar[kelesi] = j;
              System.out.println(kelesi + ": " + j.dybys());
              kelesi++;
            } else {
              System.out.println("oryn joq");
            }
          }

          int sany() {
            return kelesi;
          }
        }

        public class QoraTest {
          public static void main(String[] args) {
            Qora q = new Qora();
            int n = ?;                     // тест кірісі: qos шақыру саны (0–8)
            for (int i = 0; i < n; i++) {
              q.qos(new ?());              // тест кірісі: жануардың класы
            }
            System.out.println("barlygy: " + q.sany());
          }
        }

        Талап: n — 0-ден 8-ге дейінгі бүтін сан; ? орнына It, Mysyq, Balyq немесе Januar қойылады. Қораға ең көбі 5 жануар сияды. Әр сәтті қосуда бағдарлама «орын нөмірі: дыбыс» жолын шығарады (нөмір 0-ден басталады, дыбыс — сол жануардың dybys() нәтижесі). Қора толы болса, «oryn joq» шығарады және жұмысын жалғастырады. Соңғы жол — «barlygy: X», мұндағы X — қорадағы жануарлар саны.
