    heading: КОГНИТИВТІК ДЕҢГЕЙ (24 ұпай)
    points: 24
    instructions: |
      Әр тапсырмада 5 тұжырым бар. Әр тұжырым үшін оның ДҰРЫС немесе ДҰРЫС ЕМЕС екенін көрсетіп, себебін түсіндіріңіз. 1–4 тұжырымдар — 5 ұпайдан, 5-тұжырым — 4 ұпай.
    questions:
    - id: J01-К-01
      text: |
        Төмендегі екі файлды мұқият оқыңыз.

        // 1-файл: StepCounter.java
        class StepCounter {
          public static void main(String[] args) {
            int steps = 9;
            while (steps < 6) {
              // цикл денесі
              if (steps > 3) {
                System.out.println("көп қадам");
              }
            }
            System.out.println("соңы");
          }
        }

        // 2-файл: StepCounter2.java
        class StepCounter2 {
          int steps = 4;
          while (steps > 0) {
            steps = steps - 1;
          }
          public static void main(String[] args) {
            System.out.println("бастау");
          }
        }

        1. StepCounter бағдарламасы шексіз циклге (infinite loop) түседі, себебі цикл ішінде steps мәні өзгермейді. (5 ұпай)
        2. StepCounter2.java файлы компиляцияланбайды (compile error). (5 ұпай)
        3. StepCounter2 ішіндегі «int steps = 4;» жолы да компиляция қатесін тудырады, себебі айнымалыны (variable) әдістен (method) тыс жариялауға болмайды. (5 ұпай)
        4. StepCounter ішіндегі «while (steps < 6)» жолын «while (steps)» деп өзгертсек, бағдарлама компиляцияланбайды. (5 ұпай)
        5. «javac StepCounter.java» командасынан кейін StepCounter.class файлы пайда болады. (4 ұпай)
    - id: J01-К-02
      text: |
        Бағдарламаны оқыңыз.

        public class MenuOMatic {
          public static void main(String[] args) {
            // екі сөз тізімі (массив)
            String[] firstList = {"ыстық", "тәтті", "ащы", "жаңа"};
            String[] secondList = {"шай", "бәліш", "сорпа"};

            // әр тізімдегі сөз саны
            int firstLength = firstList.length;
            int secondLength = secondList.length;

            // екі кездейсоқ сан
            java.util.Random randomGenerator = new java.util.Random();
            int rand1 = randomGenerator.nextInt(firstLength);
            int rand2 = randomGenerator.nextInt(secondLength);

            // сөз тіркесін құрастыру
            String dish = firstList[rand1] + " " + secondList[rand2];
            System.out.println("Бүгінгі мәзір: " + dish);
          }
        }

        1. rand2 айнымалысы 0, 1, 2 немесе 3 мәнін қабылдауы мүмкін. (5 ұпай)
        2. secondList массивіне (array) тағы бір сөз қоссақ (мысалы, "палау"), бағдарламаның басқа жолдарын өзгертпей-ақ жаңа сөз де кездейсоқ таңдала алады. (5 ұпай)
        3. firstList[rand1] орнына firstList[firstLength] деп жазсақ, әрдайым тізімнің соңғы сөзі "жаңа" таңдалады. (5 ұпай)
        4. «firstList[rand1] + " " + secondList[rand2]» орнына «firstList[rand1] + secondList[rand2]» деп жазсақ, + операторы сөздердің арасына бос орынды (space) өзі қояды. (5 ұпай)
        5. firstLength айнымалысының мәні 4-ке тең. (4 ұпай)
    - id: J01-К-03
      text: |
        Бағдарламаны оқыңыз.

        public class AppleSong {
          public static void main(String[] args) {
            int applesNum = 3;
            String word = "apples";

            while (applesNum > 0) {
              if (applesNum == 1) {
                word = "apple"; // жекеше түр (singular)
              }
              System.out.println(applesNum + " red " + word + " on the tree");
              applesNum = applesNum - 1;

              if (applesNum > 0) {
                System.out.println("Now " + applesNum + " red " + word);
              } else {
                System.out.println("No more apples");
              }
            } // while соңы
            System.out.println("The end");
          }
        }

        1. while циклінің денесі (loop body) дәл 3 рет орындалады. (5 ұпай)
        2. Бағдарламаның шығысында (output) «Now 1 red apple» жолы (жекеше түрде) бар. (5 ұпай)
        3. «if (applesNum == 1)» орнына «if (applesNum = 1)» деп жазсақ, бағдарлама компиляцияланбайды. (5 ұпай)
        4. «int applesNum = 3;» орнына «int applesNum = 0;» деп жазсақ, бағдарлама ештеңе шығармайды. (5 ұпай)
        5. «applesNum + " red "» өрнегінің (expression) нәтижесі жол (String) болады. (4 ұпай)
  functional:
    heading: ФУНКЦИОНАЛДЫҚ ДЕҢГЕЙ (32 ұпай)
    points: 32
    instructions: |
      Бағдарламаның орындалуын қадамдап бақылаңыз (trace). Кестенің әр жолы — бір оператордың (statement) бір рет орындалуы. Әр жол — 4 ұпай (2 + 2).
      - «Айнымалылар мәндері» бағанына осы жол орындалғаннан КЕЙІНГІ барлық айнымалылардың (variables) мәнін жазыңыз. Шарт (condition) тексерілетін жолда (while, if) шарттың нәтижесін де (true/false) көрсетіңіз.
      - «Шығыс» бағанына осы жол экранға шығаратын (output) мәтінді жазыңыз. Ештеңе шықпаса — «—». Бос орынды (space) «␣» белгісімен көрсетіңіз.
    questions:
    - id: J01-Ф-01
      text: |
        class Shuffle2 {
          public static void main(String[] args) {
            int x = 2;
            while (x > 0) {
              if (x > 1) {
                System.out.print("a");
              }
              x = x - 1;
              System.out.print("-");
              if (x == 2) {
                System.out.print("b c");
              }
              if (x == 1) {
                System.out.print("d");
                x = x - 1;
              }
            }
            System.out.println();
          }
        }

        | № | Код                                                 | Айнымалылар мәндері | Шығыс |
        |---|-----------------------------------------------------|---------------------|-------|
        | 1 | int x = 2;                                          |                     |       |
        | 2 | while (x > 0)                                       |                     |       |
        | 3 | if (x > 1) { System.out.print("a"); }               |                     |       |
        | 4 | x = x - 1;                                          |                     |       |
        | 5 | System.out.print("-");                              |                     |       |
        | 6 | if (x == 2) { System.out.print("b c"); }            |                     |       |
        | 7 | if (x == 1) { System.out.print("d"); x = x - 1; }   |                     |       |
        | 8 | while (x > 0)                                       |                     |       |
    - id: J01-Ф-02
      text: |
        class PoolPuzzle2 {
          public static void main(String[] args) {
            int x = 0;
            while (x < 4) {
              if (x > 0) {
                System.out.print("oy");
                x = x + 2;
              } else {
                System.out.print("an ");
              }
              x = x + 1;
            }
            System.out.println();
          }
        }

        | № | Код                          | Айнымалылар мәндері | Шығыс |
        |---|------------------------------|---------------------|-------|
        | 1 | int x = 0;                   |                     |       |
        | 2 | while (x < 4)                |                     |       |
        | 3 | if (x > 0) {…} else {…}      |                     |       |
        | 4 | x = x + 1;                   |                     |       |
        | 5 | while (x < 4)                |                     |       |
        | 6 | if (x > 0) {…} else {…}      |                     |       |
        | 7 | x = x + 1;                   |                     |       |
        | 8 | while (x < 4)                |                     |       |
    - id: J01-Ф-03
      text: |
        class Test2 {
          public static void main(String[] args) {
            int x = 1;
            int y = 3;
            while (x < 4) {
              y = y - x;
              x = x + y;
              System.out.print(x + "" + y + " ");
              x = x + 1;
            }
            System.out.println();
          }
        }

        | № | Код                                    | Айнымалылар мәндері | Шығыс |
        |---|----------------------------------------|---------------------|-------|
        | 1 | int x = 1;                             |                     |       |
        | 2 | int y = 3;                             |                     |       |
        | 3 | while (x < 4)                          |                     |       |
        | 4 | y = y - x;                             |                     |       |
        | 5 | x = x + y;                             |                     |       |
        | 6 | System.out.print(x + "" + y + " ");    |                     |       |
        | 7 | x = x + 1;                             |                     |       |
        | 8 | while (x < 4)                          |                     |       |
  systemic:
    heading: ЖҮЙЕЛІК ДЕҢГЕЙ (44 ұпай)
    points: 44
    instructions: |
      Кодтағы ? белгісінің орнына қойылатын бастапқы мән — тесттің кірісі (input). 4 ТЕСТ ойлап табыңыз. Әр тест үшін жазыңыз:
      1. кіріс мәні — ? орнына қандай сан қойылады;
      2. күтілетін нәтиже (expected result) — талап (requirement) бойынша бағдарлама экранға не шығаруы керек;
      3. тест нені тексереді — қай орындалу жолын (path), тармақты (branch) немесе шекараны (boundary).

      Тесттер әртүрлі жағдайларды тексеруі керек. Егер бағдарлама талапқа сай келмейтін тест тапсаңыз, оны көрсетіңіз. Әр тест — 8 ұпай (кіріс 2 + күтілетін нәтиже 3 + нені тексереді 3), қорғау (defense) — 12 ұпай.
    questions:
    - id: J01-С-01
      text: |
        public class BallSong {
          public static void main(String[] args) {
            int balls = ?;          // жәшіктегі доптар саны (тест кірісі)
            String word = "balls";

            while (balls > 0) {
              if (balls == 1) {
                word = "ball";      // жекеше түр (singular)
              }
              System.out.println(balls + " " + word + " in the box");
              balls = balls - 1;
            }

            if (balls == 0) {
              System.out.println("Box is empty");
            }
          }
        }

        Талап: бағдарлама доп санын бастапқы мәннен 1-ге дейін кері санайды. Әр сан үшін «N balls in the box» жолын шығарады, ал N = 1 болса «1 ball in the box» деп шығарады. Соңында ӘРҚАШАН «Box is empty» жолы шығуы керек — бастапқы сан 0 немесе теріс болса да.
    - id: J01-С-02
      text: |
        class PoolTest {
          public static void main(String[] args) {
            int x = ?;              // бастапқы мән (тест кірісі)
            while (x < 3) {
              System.out.print("b");
              if (x < 1) {
                System.out.print("e");
              }
              if (x > 1) {
                System.out.print("ar");
                x = x + 2;
              }
              if (x == 1) {
                System.out.print("ee");
              }
              System.out.println();
              x = x + 1;
            }
          }
        }

        Талап: бұл бағдарламаның жеке сипаттамасы жоқ. Күтілетін нәтиже — бағдарлама берілген кіріспен шын мәнінде не шығаратыны. Тесттер кодтың БАРЛЫҚ ТАРМАҚТАРЫН (branch) және цикл шекарасын қамтуы керек.
    - id: J01-С-03
      text: |
        class Shuffle3 {
          public static void main(String[] args) {
            int x = ?;              // бастапқы мән (тест кірісі)
            while (x > 0) {
              if (x > 3) {
                System.out.print("z");
              }
              x = x - 1;
              System.out.print("+");
              if (x == 3) {
                System.out.print("y");
              }
              if (x == 1) {
                System.out.print("w");
                x = x - 1;
              }
            }
            System.out.println();
          }
        }

        Талап: x бастапқы мәні оң болса, бағдарлама әр айналымда (iteration) «+» шығарады және шығыс МІНДЕТТІ ТҮРДЕ «w» әрпімен аяқталады. x 3-тен үлкен айналымда «+» алдында «z» шығады, ал x 3-ке тең болған сәтте «+»-тан кейін «y» шығады. x ≤ 0 болса, тек бос жол шығады.
