- F# Fundamentals
levels:
  cognitive:
    heading: КОГНИТИВНЫЙ УРОВЕНЬ (24 балла)
    points: 24
    instructions: |
      В каждом задании дан фрагмент кода и 5 утверждений о нём. Для каждого утверждения укажите, ВЕРНО оно или НЕВЕРНО, и объясните почему: назовите правило языка и покажите, как оно действует в этом коде.
      Баллы: утверждения 1–4 — по 5 баллов (1 за «верно/неверно» + 4 за обоснование), утверждение 5 — 4 балла (1 + 3). Всего 24 балла.
    questions:
    - id: F04-К-01
      text: |
        Прочитайте код.

        // Заряд батареи телефона в процентах
        let mutable charge = 80.0

        let useApp app =
            if app = "game" then charge <- charge - 20.0
            elif app = "video" then charge <- charge / 2.0
            else charge <- charge - 5.0

        useApp "video"
        useApp "game"
        useApp "chat"

        1. Функция useApp имеет тип string -> unit, поэтому по её сигнатуре не видно, что она изменяет переменную charge. (5 баллов)
        2. Если поменять местами первые два вызова (сначала useApp "game", затем useApp "video"), значение charge после трёх вызовов останется тем же. (5 баллов)
        3. Если в первой строке убрать слово mutable (let charge = 80.0), код по-прежнему скомпилируется. (5 баллов)
        4. Два одинаковых вызова useApp "video", сделанные один за другим, уменьшают charge на разную величину. (5 баллов)
        5. Переменная charge имеет тип float. (4 балла)
    - id: F04-К-02
      text: |
        Прочитайте код.

        let classifyTemp temp =
            if temp < 0 then "мороз"
            elif temp < 25 then "тепло"
            else "жара"

        let reportTemp temp =
            let label = classifyTemp temp
            let city = "Алматы"
            printfn $"{city}: {temp} градусов, {label}"

        1. Функция reportTemp имеет тип int -> string, потому что в её последней строке строится строка (интерполяция строк, string interpolation). (5 баллов)
        2. Если удалить строку else "жара", функция classifyTemp не скомпилируется. (5 баллов)
        3. Если в ветке elif заменить "тепло" на число 1, код скомпилируется, и classifyTemp 10 вернёт 1. (5 баллов)
        4. После строки let r = reportTemp 30 имя r связано со значением () типа unit. (5 баллов)
        5. Тип параметра temp в функции classifyTemp выводится как int, потому что temp сравнивается с целым литералом 0. (4 балла)
    - id: F04-К-03
      text: |
        Прочитайте код.

        let addBonus points =
            let total = points + 10
            printfn $"Начислено: {total}"
            total

        let addThree () =
            addBonus 1
            addBonus 2
            addBonus 3

        1. Функция addBonus имеет тип int -> unit, потому что внутри неё вызывается printfn. (5 баллов)
        2. Компилятор выдаст предупреждение (warning) на строках addBonus 1 и addBonus 2, но не на строке addBonus 3. (5 баллов)
        3. Функция addThree возвращает () (значение типа unit), потому что результаты вызовов addBonus внутри неё только печатаются. (5 баллов)
        4. Если заменить строку addBonus 1 на ignore (addBonus 1), то addBonus 1 не будет вызвана и строка «Начислено: 11» не напечатается. (5 баллов)
        5. Вызов addThree () напечатает три строки. (4 балла)
  functional:
    heading: ФУНКЦИОНАЛЬНЫЙ УРОВЕНЬ (32 балла)
    points: 32
    instructions: |
      Заполните трассировочную таблицу. Каждая строка таблицы — одна строка (или одно определение) кода, которую по очереди вводят в F# Interactive (FSI). Первый столбец дан, два других заполните вы.
      - «Тип» — тип результата строки так, как его покажет FSI: для значения — его тип (например, float), для функции — сигнатура (например, x: int -> bool). Для вызова, который ничего не возвращает, — unit.
      - «Значение» — значение результата в нотации FSI: 42, 12.5, "text", true, (). Для функции напишите «функция». Если в программе есть изменяемая переменная (mutable), в этом столбце дополнительно укажите её текущее значение после выполнения строки.
      - Если строка не компилируется, в обоих столбцах напишите «ошибка компиляции» и коротко — причину. Такая строка не выполняется, следующие строки выполняются так, как будто её нет.
      Баллы: 8 строк × 4 балла = 32 (столбец «Тип» — 2 балла, столбец «Значение» — 2 балла).
    questions:
    - id: F04-Ф-01
      text: |
        // Остаток заряда самоката (в процентах)
        let mutable charge = 80.0

        let ride route =
            if route = "long" then charge <- charge / 2.0
            elif route = "city" then charge <- charge - 10.0
            else charge <- charge - 2.0

        ride "city"
        ride "long"
        ride "Long"
        let saved = charge
        ride "long"
        saved = charge

        Выполните трассировку: заполните столбцы «Тип» и «Значение». В столбце «Значение» после каждой строки укажите текущее значение charge.

        | № | Код                                        | Тип                    | Значение                   |
        |---|--------------------------------------------|------------------------|----------------------------|
        | 1 | let mutable charge = 80.0                  |                        |                            |
        | 2 | let ride route = ... (определение целиком) |                        |                            |
        | 3 | ride "city"                                |                        |                            |
        | 4 | ride "long"                                |                        |                            |
        | 5 | ride "Long"                                |                        |                            |
        | 6 | let saved = charge                         |                        |                            |
        | 7 | ride "long"                                |                        |                            |
        | 8 | saved = charge                             |                        |                            |
    - id: F04-Ф-02
      text: |
        // Полёт дрона: запас топлива передаётся явно
        let fly fuel trip =
            if trip = "long" then fuel - 30.0
            elif trip = "short" then fuel / 2.0
            else fuel - 5.0

        let fuel = 90.0
        let s1 = fly fuel "long"
        let s2 = fly s1 "short"
        let s3 = fly s1 "short"
        let s4 = fly s2 "Long"
        fuel <- s4
        let s5 = fly (fly fuel "short") "long"

        Выполните трассировку: заполните столбцы «Тип» и «Значение».

        | № | Код                                           | Тип                    | Значение                   |
        |---|-----------------------------------------------|------------------------|----------------------------|
        | 1 | let fly fuel trip = ... (определение целиком) |                        |                            |
        | 2 | let fuel = 90.0                               |                        |                            |
        | 3 | let s1 = fly fuel "long"                      |                        |                            |
        | 4 | let s2 = fly s1 "short"                       |                        |                            |
        | 5 | let s3 = fly s1 "short"                       |                        |                            |
        | 6 | let s4 = fly s2 "Long"                        |                        |                            |
        | 7 | fuel <- s4                                    |                        |                            |
        | 8 | let s5 = fly (fly fuel "short") "long"        |                        |                            |
    - id: F04-Ф-03
      text: |
        // Тип билета по возрасту
        let ticketType age =
            if age < 7 then "Free"
            elif age < 60 then "Full"
            else "Senior"

        let showTicket age =
            let kind = ticketType age
            let header = "Ticket"
            printfn $"{header} ({age}): '{kind}'"

        ticketType 7
        ticketType 60
        let t = showTicket 5
        ticketType (-3)

        let check age =
            if age < 7 then "Free"
            elif age < 60 then "Full"

        let isFull = ticketType 20 = "Full"

        Выполните трассировку: заполните столбцы «Тип» и «Значение».

        | № | Код                                            | Тип                    | Значение                   |
        |---|------------------------------------------------|------------------------|----------------------------|
        | 1 | let ticketType age = ... (определение целиком) |                        |                            |
        | 2 | let showTicket age = ... (определение целиком) |                        |                            |
        | 3 | ticketType 7                                   |                        |                            |
        | 4 | ticketType 60                                  |                        |                            |
        | 5 | let t = showTicket 5                           |                        |                            |
        | 6 | ticketType (-3)                                |                        |                            |
        | 7 | let check age = ... (определение целиком)      |                        |                            |
        | 8 | let isFull = ticketType 20 = "Full"            |                        |                            |
  systemic:
    heading: СИСТЕМНЫЙ УРОВЕНЬ (44 балла)
    points: 44
    instructions: |
      В каждом задании дан фрагмент кода на F# и требование (requirement) — что код ДОЛЖЕН делать. Придумайте 4 ТЕСТА (test cases). Для каждого теста запишите:
      1. входные данные — аргументы вызова (а где указано — и начальное значение вместо ?);
      2. ожидаемый результат (expected result) — что должно получиться ПО ТРЕБОВАНИЮ;
      3. что проверяет тест — какую ветку (branch), путь выполнения (execution path) или границу (boundary).

      Тесты должны проверять разные случаи. Если вы нашли тест, на котором код НЕ соответствует требованию, отметьте это и запишите, что код выдаёт на самом деле.
      Баллы: каждый тест — 8 баллов (входные данные 2 + ожидаемый результат 3 + что проверяет 3), 4 теста — 32 балла; защита (устные вопросы по вашим тестам) — 12 баллов. Итого 44 балла.
    questions:
    - id: F04-С-01
      text: |
        // заряд батареи телефона в процентах
        let mutable charge = ?   // начальный заряд (часть входных данных теста)

        let useApp app =
            if app = "game" then charge <- charge / 2.0
            elif app = "video" then charge <- charge - 20.0
            else charge <- charge - 5.0

        Требование: функция useApp списывает заряд за использование приложения app:
        - "game" — заряд уменьшается вдвое;
        - "video" — заряд уменьшается на 20;
        - "music" — заряд уменьшается на 5;
        - любое другое название приложения — заряд НЕ меняется;
        - заряд никогда не становится меньше 0: если списание больше текущего заряда, заряд становится 0.0.

        Входные данные теста — начальное значение вместо ? (дробное число, например 80.0) и один или несколько вызовов useApp подряд. Ожидаемый результат — значение charge после каждого вызова.

        Бланк ответа:
        +---+---------------------+---------------------+---------------------+
        | № | Входные данные      | Ожидаемый результат | Что проверяет       |
        +---+---------------------+---------------------+---------------------+
        | 1 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
        | 2 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
        | 3 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
        | 4 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
    - id: F04-С-02
      text: |
        // баланс транспортной карты после поездки
        let ride balance minutes =
            if minutes > 60 then balance - 300.0
            elif minutes > 30 then balance - 200.0
            elif minutes > 0 then balance - 100.0
            else balance

        Требование: функция ride возвращает баланс карты после поездки длительностью minutes минут (целое число). Стоимость поездки:
        - от 1 до 29 минут — 100 тенге;
        - от 30 до 60 минут включительно — 200 тенге;
        - больше 60 минут — 300 тенге;
        - если minutes равно 0 или меньше (поездка не состоялась) — баланс не меняется.

        Входные данные теста — значения balance и minutes (например, ride 500.0 10). Ожидаемый результат — возвращаемый баланс.

        Бланк ответа:
        +---+---------------------+---------------------+---------------------+
        | № | Входные данные      | Ожидаемый результат | Что проверяет       |
        +---+---------------------+---------------------+---------------------+
        | 1 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
        | 2 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
        | 3 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
        | 4 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
    - id: F04-С-03
      text: |
        // оценка по экзаменационному баллу
        let gradeOf score =
            if score < 50 then "неуд"
            elif score < 90 then "зачёт"
            else "отлично"

        let announce name score =
            let grade = gradeOf score
            let prefix = "Студент"
            printfn $"{prefix} {name}: {grade}"

        Требование: балл score — целое число от 0 до 100. Оценка: от 0 до 49 — «неуд», от 50 до 89 — «зачёт», от 90 до 100 — «отлично». Если балл меньше 0 или больше 100 — «ошибка ввода». Функция announce печатает одну строку вида «Студент <имя>: <оценка>».

        Входные данные теста — аргументы вызова announce (например, announce "Aru" 70). Ожидаемый результат — напечатанная строка.

        Бланк ответа:
        +---+---------------------+---------------------+---------------------+
        | № | Входные данные      | Ожидаемый результат | Что проверяет       |
        +---+---------------------+---------------------+---------------------+
        | 1 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
        | 2 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
        | 3 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
        | 4 |                     |                     |                     |
        +---+---------------------+---------------------+---------------------+
