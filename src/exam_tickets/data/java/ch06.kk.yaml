      text: |
        Бағдарламаны оқыңыз.

        import java.util.ArrayList;

        class Kitap {
          int bet;
        }

        class Soreler {
          public static void main(String[] args) {
            Kitap k1 = new Kitap();
            Kitap k2 = new Kitap();
            Kitap[] sore = new Kitap[3];
            sore[0] = k1;
            sore[1] = k2;
            ArrayList<Kitap> tizim = new ArrayList<Kitap>();
            tizim.add(k1);
            tizim.add(k2);
            Kitap alyngan = sore[1];                 // A-жол
            sore[1] = null;                          // B-жол
            tizim.remove(1);                         // C-жол
            System.out.println(sore.length + " " + tizim.size());   // D-жол
          }
        }

        1. A-жол (Kitap alyngan = sore[1];) k2 объектісін sore массивінен алып тастайды, сондықтан A-жолдан кейін sore[1] бос болады. (5 ұпай)
        2. B-жолдан кейін sore.length мәні 2 болады, себебі бір ұяшыққа null меншіктелді. (5 ұпай)
        3. C-жолдан кейін tizim.size() мәні 1 болады, себебі remove() әдісі (method) элементті ArrayList-тен шынымен алып тастайды және тізім кішірейеді. (5 ұпай)
        4. D-жолдағы sore.length орнына sore.size() жазуға болады, себебі массив те объект, сондықтан оның әдістері бар. (5 ұпай)
        5. tizim.add(k2); жолынан кейін tizim.add("Abai"); жолын қоссақ, код компиляцияланбайды, себебі ArrayList<Kitap> тек Kitap типті объектілерді қабылдайды. (4 ұпай)
    - id: J06-К-02
      text: |
        Бағдарламаны оқыңыз.

        import java.util.ArrayList;

        class TizimMagnit {
          public static void main(String[] args) {
            ArrayList<String> t = new ArrayList<String>();
            t.add("alma");
            t.add("anar");
            t.add(0, "banan");                       // 1-жол
            t.add("shie");
            t.remove(1);                             // 2-жол
            int i = t.indexOf("alma");               // 3-жол
            boolean bar = t.contains("anar");
            if (t.indexOf("shie") != 2) {            // 4-жол
              t.add(2, "juzim");
            }
            korset(t);
          }

          static void korset(ArrayList<String> list) {
            for (String e : list) {
              System.out.print(e + " ");
            }
            System.out.println();
          }
        }

        1. 1-жол (t.add(0, "banan")) «banan» элементін тізімнің басына қояды да, бұрынғы элементтерді бір орынға ығыстырады, сондықтан 1-жолдан кейін t.get(1) «alma» қайтарады. (5 ұпай)
        2. 2-жол (t.remove(1)) тізімнен «banan» элементін өшіреді, себебі ол тізімдегі бірінші элемент. (5 ұпай)
        3. 3-жол орындалғанда бағдарлама қатемен (exception) тоқтайды, себебі «alma» бұл кезде тізімде жоқ. (5 ұпай)
        4. 4-жолдағы if денесі орындалмайды, себебі осы сәтте «shie» элементінің индексі 2-ге тең. (5 ұпай)
        5. bar айнымалысының мәні true болады, себебі «anar» элементі тізімде бар. (4 ұпай)
    - id: J06-К-03
      text: |
        Бағдарламаны оқыңыз.

        class Kamera {
          int zoom;
          boolean jaramdy() {
            return zoom >= 3 && zoom <= 8;
          }
        }

        public class Dukan {
          java.util.ArrayList<Kamera> sore = new java.util.ArrayList<Kamera>();   // 1-жол

          boolean tekser(Kamera k) {
            if (k != null && k.jaramdy()) {          // 2-жол
              return true;
            }
            return false;
          }

          public static void main(String[] args) {
            Dukan d = new Dukan();
            Kamera bos = null;
            System.out.println(d.tekser(bos));       // 3-жол
            String atau = "Kodak";                   // 4-жол
            System.out.println(atau);
          }
        }

        1. 1-жол import java.util.ArrayList; жолынсыз компиляцияланады, себебі класс толық атымен (full name) — java.util.ArrayList — жазылған. (5 ұпай)
        2. Файлдың басына import java.util.ArrayList; қоссақ, Dukan.class файлы үлкейеді, себебі import ArrayList класының кодын біздің класқа қосады. (5 ұпай)
        3. 3-жол false шығарады және NullPointerException болмайды, себебі && операторы сол жағы false болса, оң жағын (k.jaramdy()) тексермейді. (5 ұпай)
        4. 2-жолдағы && операторын & операторына ауыстырсақ та, 3-жол бұрынғыдай false шығарады, себебі нәтиже бәрібір false. (5 ұпай)
        5. 4-жолдағы String класын пайдалану үшін файлдың басына import java.lang.String; жазу міндетті. (4 ұпай)
  functional:
    heading: ФУНКЦИОНАЛДЫҚ ДЕҢГЕЙ (32 ұпай)
    points: 32
    instructions: |
      Бағдарламаның орындалуын қадамдап бақылаңыз (trace). Кестенің әр жолы — бір оператор (statement). Әр жол орындалғаннан КЕЙІНГІ толық жағдайды жазыңыз: «Стек» бағанына — стектегі (stack) барлық фреймдерді және олардағы айнымалыларды, «Үйінді» бағанына — үйіндідегі (heap) барлық объектілерді. Әр жол — 4 ұпай (2 + 2).
      Белгілеулер:
      - сілтеме (reference) — a→1; бос сілтеме — b=null;
      - үйіндідегі объект — 1 Alma объекті (salmaq=0);
      - массив (array) — 1 It[] массив объекті: [0]→2, [1]=null;
      - ArrayList объектісі — 1 ArrayList<Alma> объекті: [0]→3, [1]→2; бос тізім — 1 ArrayList<Alma> объекті: бос;
      - бірде-бір сілтеме арқылы жетуге болмайтын объект — «— GC кандидаты»;
      - стекте фреймдер жоғарыдан төмен жазылады, ең үстінде — қазір орындалып жатқан әдіс: tekser(): b=7 / main(): o→1; айнымалысы жоқ фрейм — getJas(): —;
      - «(… ішінде)» — шақырылған әдістің денесіндегі оператор (return операторы да жеке жол);
      - «(қайтқаннан кейін)» — әдіс аяқталып, оның нәтижесі айнымалыға меншіктелгеннен кейінгі жағдай (әдістің фреймі бұл кезде стекте жоқ);
      - void әдісті шақыру жеке жол болып жазылмайды — тек оның денесіндегі операторлар жазылады;
      - Java кітапханасының (Java API) әдістерін шақыру (add, remove, indexOf, get) — бір жол, олардың фреймі жазылмайды.
