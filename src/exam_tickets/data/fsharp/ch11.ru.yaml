levels:
  cognitive:
    heading: КОГНИТИВНЫЙ УРОВЕНЬ (24 балла)
    points: 24
    instructions: |
      В каждом задании дан фрагмент кода на F# и 5 утверждений о нём. Для каждого утверждения укажите, ВЕРНО оно или НЕВЕРНО, и объясните почему: назовите правило языка и покажите, как оно действует в этом коде. Компьютер не нужен: всё, что нужно для ответа, есть в условии.
      Баллы: утверждения 1–4 — по 5 баллов (1 за «верно/неверно» + 4 за обоснование), утверждение 5 — 4 балла (1 + 3). Всего 24 балла.
    questions:
    - id: F11-К-01
      text: |
        Прочитайте код.

        // интерфейс (interface): все члены абстрактные
        type IScorer =
            abstract Score : string -> int
            abstract Label : int -> string

        type LengthScorer () =
            interface IScorer with
                member this.Score word = word.Length * 2
                member this.Label points = $"{points} баллов"

        let scorer = LengthScorer()
        let asScorer : IScorer = LengthScorer()

        // функция принимает любой объект, реализующий IScorer
        let rate (s: IScorer) (word: string) =
            s.Score word |> s.Label

        let result = rate scorer "fsharp"

        1. Строку let a = scorer.Score "abc" можно дописать в конец кода: она скомпилируется, и a будет равно 6. (5 баллов)
        2. Строку let b = asScorer.Score "abc" можно дописать в конец кода: она скомпилируется, и b будет равно 6. (5 баллов)
        3. Вызов rate scorer "fsharp" компилируется без явного приведения (:>), и значение result равно "12 баллов". (5 баллов)
        4. Если удалить из LengthScorer строку member this.Label points = ..., код по-прежнему скомпилируется: нереализованный член интерфейса просто нельзя будет вызвать. (5 баллов)
        5. Тип значения scorer — LengthScorer, а тип значения asScorer — IScorer. (4 балла)
    - id: F11-К-02
      text: |
        Прочитайте код. Он выполняется как скрипт в пустой папке; File.AppendAllText(path, text) — метод .NET, который дописывает текст в конец файла (если файла нет, создаёт его). FileInfo — класс .NET со сведениями о файле.

        open System.IO

        module Log =
            // обёртка (wrapper) над методом .NET File.AppendAllText
            let add path (text: string) =
                File.AppendAllText(path, text)
                path

        // перед первым запуском файла out.txt нет
        File.WriteAllText("in.txt", "  data  ")

        let info =
            "in.txt"
            |> File.ReadAllText
            |> fun text -> text.Trim()
            |> Log.add "out.txt"
            |> FileInfo

        1. В шаге |> Log.add "out.txt" строка "out.txt" попадает в параметр text, а значение из предыдущего шага конвейера — в параметр path. (5 баллов)
        2. Тип Log.add — string -> string -> string: функция возвращает путь, а не unit (), поэтому после неё в конвейере может стоять следующий шаг. (5 баллов)
        3. Последний шаг |> FileInfo — ошибка компиляции: конструктор класса нельзя использовать в конвейере как функцию, нужно писать fun p -> new FileInfo(p). (5 баллов)
        4. Log.add — чистая функция (pure function): если выполнить весь этот код второй раз, файл out.txt будет содержать то же, что после первого запуска, — data. (5 баллов)
        5. Шаг fun text -> text.Trim() — лямбда (lambda): она получает строку "  data  " и возвращает "data". (4 балла)
    - id: F11-К-03
      text: |
        Прочитайте код.

        open System

        type DeliveryStatus =
            | Delivered of {| DeliveredOn : DateTime; Signed : bool |}
            | Pending of {| Eta : DateTime |}

        type Shipment =
            {
                Code : string
                Status : DeliveryStatus
                Lines : (string * decimal) list
            }

        let shipment =
            {
                Code = "KZ-7"
                Status = Pending {| Eta = DateTime(2025, 6, 2) |}
                Lines = [ "Клавиатура", 30M; "Монитор", 150M; "Кабель", 5M ]
            }

        let total s = s.Lines |> List.sumBy snd

        let describe s =
            match s.Status with
            | Delivered d -> if d.Signed then "доставлено, подписано" else "доставлено"
            | Pending p -> $"ожидается {p.Eta.Day}.{p.Eta.Month}"

        1. Функция total имеет тип Shipment -> decimal: тип параметра s компилятор выводит по полю Lines. (5 баллов)
        2. Чтобы отметить доставку, можно дописать строку shipment.Status <- Delivered {| DeliveredOn = DateTime(2025, 6, 1); Signed = true |}. (5 баллов)
        3. Анонимную запись (anonymous record) {| Eta : DateTime |} нужно заранее объявить отдельным типом через type, иначе случай Pending не скомпилируется. (5 баллов)
        4. Если добавить в DeliveryStatus третий случай | Lost, код по-прежнему скомпилируется, но компилятор выдаст предупреждение (warning) о неполном сопоставлении с образцом (incomplete pattern match) в describe. (5 баллов)
        5. Вызов describe shipment возвращает "ожидается 2.6". (4 балла)
  functional:
    heading: ФУНКЦИОНАЛЬНЫЙ УРОВЕНЬ (32 балла)
    points: 32
    instructions: |
      Трассировочная таблица (trace table). Код — сеанс FSI (F# Interactive): команды отправляются в FSI по очереди, сверху вниз, каждая заканчивается ;;. Определения типов (type) отправлены в FSI заранее, для них строк в таблице нет. Для каждой строки таблицы заполните два столбца так, как FSI напечатал бы результат этой команды.
      - «Тип»: символ и его тип, как в выводе FSI, например val total: int, val it: string, val discount: price: float -> float.
      - «Значение»: значение символа, например 42, "Aru", seq [1; 2], false. Для функции напишите «функция»; для объекта класса или интерфейса FSI значение не печатает — напишите «объект».
      - Если команда не компилируется, в обоих столбцах напишите «ошибка компиляции», а в столбце «Значение» — причину.
      Баллы: 8 строк × 4 балла = 32. В каждой строке: «Тип» — 2 балла, «Значение» — 2 балла.
    questions:
    - id: F11-Ф-01
      text: |
        // Сеанс FSI: команды отправляются по очереди, сверху вниз
        open System;;
        Int32.TryParse "4x";;
        let tryParse parser (text: string) =
            match parser text with
            | true, v -> Some v
            | false, _ -> None;;
        let tryInt = tryParse Int32.TryParse;;
        tryInt "-8";;
        tryInt "";;
        tryInt "3000000000";;
        tryParse Boolean.TryParse "false";;
        tryInt 42;;

        Заполните таблицу.

        | № | Код (команда FSI)                                   | Тип            | Значение       |
        |---|-----------------------------------------------------|----------------|----------------|
        | 1 | Int32.TryParse "4x";;                               |                |                |
        | 2 | let tryParse parser (text: string) = ... (4 строки) |                |                |
        | 3 | let tryInt = tryParse Int32.TryParse;;              |                |                |
        | 4 | tryInt "-8";;                                       |                |                |
        | 5 | tryInt "";;                                         |                |                |
        | 6 | tryInt "3000000000";;                               |                |                |
        | 7 | tryParse Boolean.TryParse "false";;                 |                |                |
        | 8 | tryInt 42;;                                         |                |                |
    - id: F11-Ф-02
      text: |
        // Типы уже отправлены в FSI:
        type IGreeter =
            abstract Greet : string -> string
            abstract Count : int -> int

        type LoudGreeter () =
            interface IGreeter with
                member this.Greet name = "HELLO, " + name.ToUpper()
                member this.Count n = n * 2;;

        // Сеанс FSI: команды отправляются по очереди, сверху вниз
        let loud = LoudGreeter();;
        loud.Greet "aru";;
        let g : IGreeter = loud;;
        g.Greet "aru";;
        let quiet =
            { new IGreeter with
                member _.Greet name = "hi " + name
                member _.Count n = n - 1 };;
        quiet.Count 10;;
        (loud :> IGreeter).Count 7;;
        [ quiet; g ] |> List.map (fun x -> x.Greet "Dana");;

        Заполните таблицу.

        | № | Код (команда FSI)                                | Тип            | Значение       |
        |---|--------------------------------------------------|----------------|----------------|
        | 1 | let loud = LoudGreeter();;                       |                |                |
        | 2 | loud.Greet "aru";;                               |                |                |
        | 3 | let g : IGreeter = loud;;                        |                |                |
        | 4 | g.Greet "aru";;                                  |                |                |
        | 5 | let quiet = { new IGreeter with ... } (4 строки) |                |                |
        | 6 | quiet.Count 10;;                                 |                |                |
        | 7 | (loud :> IGreeter).Count 7;;                     |                |                |
        | 8 | [ quiet; g ] ... List.map ... "Dana");;          |                |                |
    - id: F11-Ф-03
      text: |
        // Типы уже отправлены в FSI:
        type DeliveryState =
            | Delivered of {| Day : int; Rating : int option |}
            | Pending of {| EtaDay : int |}

        type Parcel =
            { Code : int
              State : DeliveryState
              Lines : (string * decimal) list };;

        // Сеанс FSI: команды отправляются по очереди, сверху вниз
        let parcel =
            { Code = 7
              State = Pending {| EtaDay = 9 |}
              Lines = [ "Book", 30M; "Mouse", 15M ] };;
        let total p = p.Lines |> List.sumBy snd;;
        total parcel;;
        let delivered =
            { parcel with State = Delivered {| Day = 8; Rating = None |} };;
        let rating p =
            match p.State with
            | Delivered d -> d.Rating
            | Pending _ -> None;;
        rating delivered;;
        total { parcel with Lines = [] };;
        total parcel + 5;;

        Заполните таблицу.

        | № | Код (команда FSI)                  | Тип            | Значение       |
        |---|------------------------------------|----------------|----------------|
        | 1 | let parcel = ... (4 строки)        |                |                |
        | 2 | let total p = ... List.sumBy snd;; |                |                |
        | 3 | total parcel;;                     |                |                |
        | 4 | let delivered = ... (2 строки)     |                |                |
        | 5 | let rating p = ... (4 строки)      |                |                |
        | 6 | rating delivered;;                 |                |                |
        | 7 | total { parcel with Lines = [] };; |                |                |
        | 8 | total parcel + 5;;                 |                |                |
  systemic:
    heading: СИСТЕМНЫЙ УРОВЕНЬ (44 балла)
    points: 44
    instructions: |
      Дан фрагмент кода с функцией. Значения, помеченные «?», — входные данные теста (input). Придумайте 4 ТЕСТА. Для каждого теста запишите:
      1. входные данные — что подставляется вместо «?»;
      2. ожидаемый результат (expected result) — что функция должна вернуть по требованию (requirement), записанному под кодом;
      3. что проверяет тест — какой путь выполнения (path), какую границу (boundary) или какой особый случай.

      Тесты должны проверять разные случаи. Если вы нашли тест, на котором код не выполняет требование, отметьте его и объясните, что код вернёт на самом деле.
      Баллы: каждый тест — 8 (входные данные 2 + ожидаемый результат 3 + что проверяет 3), защита (defense) — 12. Всего 44.
      Результаты записывайте как в FSI: Ok 12, Error "текст ошибки", 250M (decimal), 3L (int64); исключение (exception) — его именем, например FileNotFoundException.
    questions:
    - id: F11-С-01
      text: |
        open System

        // Обёртка над TryParse: пара (успех, значение) -> option
        let tryParseWith parser (text: string) =
            match parser text with
            | true, v -> Some v
            | false, _ -> None

        let tryParseInt = tryParseWith Int32.TryParse

        // Количество мест в аудитории из текста поля формы
        let seatCount text =
            match tryParseInt text with
            | Some n when n > 0 -> Ok n
            | Some _ -> Error "мест должно быть больше нуля"
            | None -> Error "не число"

        seatCount ?    // ? — строка (string), вход теста

        Требование: функция seatCount получает текст из поля формы (строка, string).
        - Если текст — запись целого числа (только цифры, перед ними может стоять знак + или -) и число больше нуля, функция возвращает Ok с этим числом.
        - Если текст — запись целого числа, но число 0 или отрицательное, возвращает Error "мест должно быть больше нуля".
        - Во всех остальных случаях — пустая строка, буквы, дробное число, пробелы в начале или в конце текста, число больше 2 147 483 647 — возвращает Error "не число".
        Справка: Int32.TryParse — метод .NET с out-параметром; в F# он возвращает кортеж (bool, int): TryParse "12" → (true, 12), TryParse "abc" → (false, 0). Метод принимает знак + или - и пробелы в начале и в конце строки: TryParse " 7 " → (true, 7). Если число не помещается в int (больше 2 147 483 647), результат (false, 0).

