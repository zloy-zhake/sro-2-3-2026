          Ожидаемый результат: ___________________________________________
          Что проверяет: _________________________________________________

        Тесты, на которых код не выполняет требование (если есть): № ____
          Что код вернёт или сделает на самом деле: _______________________
    - id: F10-С-02
      text: |
        type Command =
            | Deposit of int
            | Withdraw of int

        let isNotStop (line: string) = line <> "stop"

        let asCommand (line: string) =
            match line.Split ' ' with
            | [| "dep"; amount |] -> Some (Deposit (int amount))
            | [| "wd"; amount |] -> Some (Withdraw (int amount))
            | _ -> None

        let applyCommand (balance: int) (command: Command) =
            match command with
            | Deposit amount -> balance + amount
            | Withdraw amount -> balance - amount

        let finalBalance (lines: string list) =
            lines
            |> List.takeWhile isNotStop
            |> List.choose asCommand
            |> List.fold applyCommand 0

        finalBalance ?    // ? — список строк-команд (string list), вход теста

        Требование: функция finalBalance получает строки-команды и возвращает итоговый баланс (int); начальный баланс 0.
        - Обрабатываются строки до первой строки "stop" (её и всё после неё не учитывают). Если "stop" нет, обрабатываются все строки.
        - "dep N" прибавляет N, "wd N" вычитает N (N — целое число). Баланс может стать отрицательным.
        - Любая другая строка пропускается: неизвестная команда, другой регистр ("DEP 5"), лишние слова, а также команда, у которой N — не целое число (например "dep ten").
        Справка: "dep 5".Split ' ' = [|"dep"; "5"|] (строка делится по каждому пробелу). int "12" = 12; int "ten" не возвращает значение, а бросает исключение FormatException. List.takeWhile p — берёт элементы с начала, пока p даёт true; List.choose f — оставляет значения x из Some x и отбрасывает None; List.fold f 0 — проходит список слева направо, начиная с 0.

        Тест 1
          Входные данные (?): ____________________________________________
          Ожидаемый результат: ___________________________________________
          Что проверяет: _________________________________________________

        Тест 2
          Входные данные (?): ____________________________________________
          Ожидаемый результат: ___________________________________________
          Что проверяет: _________________________________________________

        Тест 3
