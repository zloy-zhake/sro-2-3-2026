    - id: D09-С-03
      text: |
        Фрагмент. Продажа билетов на камерный концерт (5 мест): метрики
        приложения и дашборд для отдела продаж.

        Каталог /home/student/concert (текущий): compose.yaml, Dockerfile,
        app.py, prometheus/ (Dockerfile, prometheus.yml), grafana/ (Dockerfile и
        файлы provisioning).

        Файл Dockerfile:
            FROM python:3.12-slim
            WORKDIR /app
            RUN pip install flask prometheus_client
            COPY app.py .
            CMD ["python", "app.py"]

        Файл app.py:
            from flask import Flask, Response
            from prometheus_client import Counter, Gauge, generate_latest, CONTENT_TYPE_LATEST

            SEATS = 5  # мест в зале
            sold = 0   # продано билетов

            tickets_sold = Counter("tickets_sold_total", "Tickets sold")
            seats_free = Gauge("seats_free", "Free seats")
            sessions = Counter("active_sessions_total", "Users choosing seats now")
            seats_free.set(SEATS)

            app = Flask(__name__)

            @app.get("/enter")  # пользователь открыл схему зала
            def enter():
                sessions.inc()
                return "welcome"

            @app.get("/leave")  # пользователь закрыл схему зала
            def leave():
                sessions.inc(-1)
                return "bye"

            @app.get("/buy")
            def buy():
                global sold
                if sold >= SEATS:
                    return "sold out", 409
                sold += 1
                tickets_sold.inc()
                seats_free.set(SEATS - sold)
                return "ticket " + str(sold)

            @app.get("/metrics")
            def metrics():
                return Response(generate_latest(), mimetype=CONTENT_TYPE_LATEST)

            app.run(host="0.0.0.0", port=5000)

        Файл prometheus/prometheus.yml (скопирован в образ concert-prometheus:1):
            global:
              scrape_interval: 10s

            scrape_configs:
              - job_name: "concert"
                metrics_path: /metrics
                static_configs:
                  - targets: ["tickets:5000"]

        Файл compose.yaml:
            services:

              tickets:
                image: concert-tickets:1
                ports:
                  - "8030:5000"

              prometheus:
                image: concert-prometheus:1
                ports:
                  - "9092:9090"

              grafana:
                image: concert-grafana:1
                ports:
                  - "3002:3000"

        Образ concert-grafana:1 содержит источник данных http://prometheus:9090
        и дашборд Concert из трёх панелей-графиков за последние 15 минут:
            Tickets sold         sum(tickets_sold_total) without(instance)
            Free seats           sum(seats_free) without(instance)
            Choosing seats now   sum(active_sessions_total) without(instance)

        Все образы собраны (concert-tickets:1 — из Dockerfile выше).
        Контейнеров проекта concert нет.

        Разработчик утверждает: «Дашборд Concert готов для отдела продаж:
        Tickets sold показывает, сколько билетов продано с начала продаж, Free
        seats — сколько мест осталось, Choosing seats now — сколько
        пользователей прямо сейчас выбирают места. Значения на дашборде
        меняются сразу после каждого запроса».

        Задание. Придумайте 4 сценария, которые проверяют утверждение
        разработчика. Можно выполнять docker compose up -d / stop / start /
        restart <сервис> / down, ждать между командами, отправлять запросы
        http://localhost:8030/enter, /leave, /buy и /metrics (N раз подряд),
        смотреть дашборд Concert в Grafana (http://localhost:3002) и запросы
        в Prometheus (http://localhost:9092), менять app.py и пересобирать
        образ concert-tickets:1. Для каждого сценария укажите исходное условие,
        ожидаемый результат (ответы приложения, значения панелей дашборда в
        указанные моменты времени) и что проверяет сценарий.

        Баллы: 4 сценария × 8 = 32; защита — 12. Всего 44.
