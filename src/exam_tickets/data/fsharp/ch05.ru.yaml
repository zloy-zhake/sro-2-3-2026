    - id: F05-С-02
      text: |
        // Описывает ученика: имя, фамилия, возраст
        let describeStudent (firstName:string) (lastName:string) (age:int) =
            let category =
                if age < 7 then "preschool"
                elif age <= 18 then "school"
                else "adult"
            (lastName, firstName), (age, category)

        Требование (requirement): функция describeStudent получает имя, фамилию и возраст (целое число, 0 или больше) и возвращает вложенный кортеж (nested tuple): сначала пара (фамилия, имя), затем пара (возраст, категория). Категория:
        - от 0 до 6 лет включительно — "preschool";
        - от 7 до 17 лет включительно — "school";
        - 18 лет и старше — "adult".

        Входные данные теста — три аргумента, например describeStudent "Aru" "Bek" 12. Ожидаемый результат запишите целиком, как кортеж.

