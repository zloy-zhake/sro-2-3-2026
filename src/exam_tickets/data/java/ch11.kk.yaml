  systemic:
    heading: ЖҮЙЕЛІК ДЕҢГЕЙ (44 ұпай)
    points: 44
    instructions: |
      Кодтағы ? белгісінің орнына main ішінде тізімге (List) элементтер қосатын add жолдары жазылады — бұл тесттің кірісі (input). Кірісті add жолдарымен немесе тізім мазмұнымен жазуға болады, мысалы: tizim: [7 Asel, 2 Bolat] (элементтер toString() шығаратын түрде; бос тізім — «бос»). 4 ТЕСТ ойлап табыңыз. Әр тест үшін жазыңыз:
      1. кіріс — тізімге қандай элементтер қандай ретпен қосылады;
      2. күтілетін нәтиже (expected result) — талап (requirement) бойынша бағдарлама экранға не шығаруы керек немесе қандай ерекше жағдаймен (exception) құлауы керек;
      3. тест нені тексереді — қандай жағдай немесе шекара (boundary) тексеріледі (бос тізім, бір элемент, қайталанатын элементтер, тең мәндер), жиын (Set) элементтерді қалай салыстырады (equals() және hashCode() немесе салыстырғыш (Comparator)), лямбда (lambda) тізімді қалай сұрыптайды.

      Тесттер әртүрлі жағдайларды тексеруі керек. Егер бағдарлама талапқа сай келмейтін тест тапсаңыз, оны көрсетіңіз. Әр тест — 8 ұпай (кіріс 2 + күтілетін нәтиже 3 + нені тексереді 3), қорғау (defense) — 12 ұпай.
