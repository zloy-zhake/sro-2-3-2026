    - id: J06-Ф-03
      text: |
        import java.util.ArrayList;

        class Startap {
          int orny;

          int tekser(int b) {
            if (b == orny) {
              return 2;                  // 2 — «kill»
            }
            return 0;                    // 0 — «miss»
          }
        }

        public class Oiyn {
          private ArrayList<Startap> startaptar = new ArrayList<Startap>();
          int sanaq = 0;

          void dayynda() {
            Startap bir = new Startap();
            bir.orny = 4;
            Startap eki = new Startap();
            eki.orny = 7;
            startaptar.add(bir);
            startaptar.add(eki);
          }

          void boljamTekser(int boljam) {
            sanaq++;
            int natije = 0;
            for (Startap s : startaptar) {
              natije = s.tekser(boljam);
              if (natije == 2) {
                startaptar.remove(s);
                break;
              }
            }
          }

          public static void main(String[] args) {
            Oiyn o = new Oiyn();
            o.dayynda();
            // ---- кесте осы жерден басталады ----
            o.boljamTekser(7);
            int k = o.sanaq;
          }
        }

        Бастапқы жағдай (o.dayynda() орындалғаннан кейін):
        Стек — main(): o→1
        Үйінді — 1 Oiyn объекті (sanaq=0, startaptar→2); 2 ArrayList<Startap> объекті: [0]→3, [1]→4; 3 Startap объекті (orny=4); 4 Startap объекті (orny=7)
        Нұсқау: «1-айналым», «2-айналым» — for циклінің бірінші және екінші қайталануы (iteration).

        | № | Код                                                                              | Стек | Үйінді |
        |---|----------------------------------------------------------------------------------|------|--------|
        | 1 | (boljamTekser ішінде) sanaq++;                                                   |      |        |
        | 2 | (boljamTekser ішінде) int natije = 0;                                            |      |        |
        | 3 | (tekser ішінде, 1-айналым) return 0;                                             |      |        |
        | 4 | (boljamTekser ішінде, 1-айналым) natije = s.tekser(boljam); (қайтқаннан кейін)   |      |        |
        | 5 | (tekser ішінде, 2-айналым) return 2;                                             |      |        |
        | 6 | (boljamTekser ішінде, 2-айналым) natije = s.tekser(boljam); (қайтқаннан кейін)   |      |        |
        | 7 | (boljamTekser ішінде) startaptar.remove(s);                                      |      |        |
        | 8 | int k = o.sanaq;                                                                 |      |        |
  systemic:
    heading: ЖҮЙЕЛІК ДЕҢГЕЙ (44 ұпай)
    points: 44
    instructions: |
      Кодтағы ? белгісінің орнына қойылатын мән (әдіс аргументі, өріс мәні немесе массив мазмұны) — тесттің кірісі (input). 4 ТЕСТ ойлап табыңыз. Әр тест үшін жазыңыз:
      1. кіріс мәні — әр ? орнына қандай мән қойылады;
      2. күтілетін нәтиже (expected result) — талап (requirement) бойынша бағдарлама экранға не шығаруы керек;
      3. тест нені тексереді — қай орындалу жолын (path), тармақты (branch) немесе шекараны (boundary).

      Тесттер әртүрлі жағдайларды тексеруі керек. Егер бағдарлама талапқа сай келмейтін тест тапсаңыз, оны көрсетіңіз. Әр тест — 8 ұпай (кіріс 2 + күтілетін нәтиже 3 + нені тексереді 3), қорғау (defense) — 12 ұпай.
    questions:
    - id: J06-С-01
      text: |
        import java.util.ArrayList;

        class Startap {
          private ArrayList<String> uyashyqtar;

          public void setUyashyqtar(ArrayList<String> u) {
            uyashyqtar = u;
          }

          public String tekser(String boljam) {
            String natije = "miss";
            int index = uyashyqtar.indexOf(boljam);
            if (index > 0) {
              uyashyqtar.remove(index);
              if (uyashyqtar.isEmpty()) {
                natije = "kill";
              } else {
                natije = "hit";
              }
            }
            return natije;
          }
        }

        class StartapTest {
          public static void main(String[] args) {
            Startap s = new Startap();
            String[] u = {?};              // тест кірісі: стартаптың ұяшықтары
            ArrayList<String> orny = new ArrayList<String>();
            for (String x : u) {
              orny.add(x);
            }
            s.setUyashyqtar(orny);
            String[] boljamdar = {?};      // тест кірісі: ойыншының болжамдары
            for (String b : boljamdar) {
              System.out.println(s.tekser(b));
            }
          }
        }

        Талап: стартап 1-ден 3-ке дейін ұяшықты (cell) алады; ұяшық атаулары кіші әріппен жазылады («a0»–«g6») және қайталанбайды. Әр болжам (guess) үшін бағдарлама бір жол шығарады: болжам стартаптың әлі тиілмеген ұяшығына тисе — «hit», ал бұл соңғы тиілмеген ұяшық болса — «kill»; болжам стартаптың ұяшығына тимесе немесе бұл ұяшыққа бұрын тиген болса — «miss». Болжамдар кіші әріппен беріледі.
    - id: J06-С-02
      text: |
        class Kamera {
          int baga;
          String zoomTuri;               // "optical" немесе "digital"
          int zoom;
        }

        class Dukenshi {
          public String tanda(Kamera k) {
            if (k.baga >= 300 && k.baga < 400) {
              return "X";
            }
            if ((k.zoomTuri.equals("optical") && (k.zoom >= 3 && k.zoom <= 8)) ||
                (k.zoomTuri.equals("digital") && (k.zoom > 5 && k.zoom <= 12))) {
              return "Y";
            }
            return "Z";
          }
        }

        class DukenshiTest {
          public static void main(String[] args) {
            Kamera k = new Kamera();
            k.baga = ?;                    // тест кірісі: баға
            k.zoomTuri = ?;                // тест кірісі: "optical" немесе "digital"
            k.zoom = ?;                    // тест кірісі: зум
            Dukenshi d = new Dukenshi();
            System.out.println(d.tanda(k));
          }
        }

        Талап: камераның бағасы 50-ден 1000-ға дейін, зум (zoom) 1-ден 20-ға дейін, зум түрі — "optical" немесе "digital". Бағасы 300-ден 400-ге дейін болса (300 кіреді, 400 кірмейді), бағдарлама «X» шығарады. Әйтпесе: оптикалық зум 3–8 аралығында немесе цифрлық зум 5–12 аралығында болса (шеткі мәндер екі жағынан да кіреді), «Y» шығарады. Қалған жағдайларда — «Z».
    - id: J06-С-03
      text: |
        class Tor {
          static final int UZYNDYQ = 7;          // бір қатардағы ұяшық саны
          static final int OLSHEM = 49;          // тордағы ұяшық саны (7 x 7)
          static final int KOLDENEN = 1;         // көлденең (horizontal) қадам
          static final int TIK = UZYNDYQ;        // тік (vertical) қадам

          int qatar(int index) {
            return index / UZYNDYQ;
          }

          boolean syiady(int[] koord, int qadam) {
            int songy = koord[koord.length - 1];
            if (qadam == KOLDENEN) {
              return qatar(koord[0]) == qatar(songy);
            } else {
              return songy <= OLSHEM;
            }
          }
        }

        class TorTest {
          public static void main(String[] args) {
            Tor t = new Tor();
            int bastau = ?;                // тест кірісі: бірінші ұяшық (0–48)
            int qadam = ?;                 // тест кірісі: 1 (көлденең) немесе 7 (тік)
            int[] koord = new int[3];
            int orny = bastau;
            for (int i = 0; i < koord.length; i++) {
              koord[i] = orny;
              orny = orny + qadam;
            }
            System.out.println(t.syiady(koord, qadam));
          }
        }

        Талап: тор (grid) 7 × 7, ұяшықтар 0-ден 48-ге дейін нөмірленеді: 0–6 — бірінші қатар (row), 7–13 — екінші қатар, т.с.с. Стартап 3 ұяшық алады. Көлденең (qadam = 1) орналастырғанда үш ұяшық бір қатарда болса — true, әйтпесе false. Тік (qadam = 7) орналастырғанда үш ұяшықтың бәрі тордың ішінде (0–48) болса — true, әйтпесе false.
