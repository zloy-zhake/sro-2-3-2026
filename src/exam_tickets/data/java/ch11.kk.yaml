    - id: J11-С-01
      text: |
        import java.util.*;

        class Oqushy {                     // оқушы (student)
          int id;
          String aty;

          Oqushy(int id, String aty) {
            this.id = id;
            this.aty = aty;
          }

          public boolean equals(Object o) {
            Oqushy basqa = (Oqushy) o;
            return id == basqa.id;         // бірдей оқушы = бірдей id
          }

          public int hashCode() {
            return aty.hashCode();
          }

          public String toString() {
            return id + " " + aty;
          }
        }

        class Synyp {                      // сынып (class, group)
          static int unikal(List<Oqushy> tizim) {
            Set<Oqushy> jiyn = new HashSet<>(tizim);   // жиын (Set): қайталанатындар алынады
            return jiyn.size();
          }
        }

        public class SynypTest {
          public static void main(String[] args) {
            List<Oqushy> tizim = new ArrayList<>();
            ?                              // тест кірісі: tizim.add(new Oqushy(id, "aty")); жолдары
            System.out.println("unikal: " + Synyp.unikal(tizim));
          }
        }

        Талап: ? орнына tizim тізіміне оқушыларды қосатын tizim.add(new Oqushy(id, "aty")); жолдары жазылады (0-ден 5-ке дейін жол). id — оң бүтін сан, aty — латын әріптерімен жазылған есім (null емес). Оқушы id бойынша анықталады: id-і бірдей екі жазба — бір оқушы, тіпті есімі әртүрлі жазылса да (мысалы, қате жазылған: Asel / Assel); id-і әртүрлі болса — есімдері бірдей болса да, бұлар әртүрлі оқушылар. unikal әдісі тізімдегі әртүрлі оқушылар санын қайтарады. Бағдарлама «unikal: N» жолын шығарады (N — сол сан); бос тізім үшін N = 0.
