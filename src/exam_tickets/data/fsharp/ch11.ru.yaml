    - id: F11-С-02
      text: |
        open System

        type ShippingStatus =
            | Fulfilled of {| FulfilledOn: DateTime; PaidOn: DateTime option |}
            | Outstanding of {| DueOn: DateTime |}

        type Order =
            { Id: int
              Status: ShippingStatus
              Items: (string * decimal) list }

        // Сколько клиент должен заплатить сейчас
        let amountDue order =
            let total = order.Items |> List.sumBy snd
            let discount = if total > 1000M then 100M else 0M
            match order.Status with
            | Fulfilled info ->
                match info.PaidOn with
                | Some _ -> 0M
                | None -> total - discount
            | Outstanding _ -> 0M

        amountDue { Id = 1; Status = ?; Items = ? }    // ? — статус и список товаров, вход теста

        Требование: функция amountDue возвращает сумму (decimal), которую клиент должен заплатить сейчас.
        - Заказ ещё не доставлен (Outstanding) — 0M: платят при доставке.
        - Заказ доставлен и уже оплачен (Fulfilled, PaidOn = Some …) — 0M.
        - Заказ доставлен, но не оплачен (Fulfilled, PaidOn = None) — сумма цен всех товаров; если эта сумма 1000M или больше, вычитается скидка 100M.
        - Пустой список товаров — сумма 0M.
        Справка: List.sumBy snd складывает вторые элементы кортежей: [ "book", 40M; "mouse", 60M ] → 100M, для пустого списка [] → 0M. Литералы decimal пишутся с буквой M: 1000M. Даты в тестах можно писать сокращённо буквой d (любая дата), например Fulfilled {| FulfilledOn = d; PaidOn = None |} или Outstanding {| DueOn = d |}.

