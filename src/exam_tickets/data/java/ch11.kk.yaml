    heading: КОГНИТИВТІК ДЕҢГЕЙ (24 ұпай)
    points: 24
    instructions: |
      Әр тапсырмада 5 тұжырым бар. Әр тұжырым үшін оның ДҰРЫС немесе ДҰРЫС ЕМЕС екенін көрсетіп, себебін түсіндіріңіз. 1–4 тұжырымдар — 5 ұпайдан, 5-тұжырым — 4 ұпай.
    questions:
    - id: J11-К-01
      text: |
        Бағдарламаны оқыңыз.

        import java.util.*;

        class Kitap implements Comparable<Kitap> {
          private String atau;
          private String avtor;

          Kitap(String atau, String avtor) {
            this.atau = atau;
            this.avtor = avtor;
          }

          public String getAtau() {
            return atau;
          }

          public String getAvtor() {
            return avtor;
          }

          public int compareTo(Kitap k) {
            return atau.compareTo(k.getAtau());
          }

          public String toString() {
            return atau;
          }
        }

        class AvtorCompare implements Comparator<Kitap> {
          public int compare(Kitap bir, Kitap eki) {
            return bir.getAvtor().compareTo(eki.getAvtor());
          }
        }

        public class Kitaphana {
          public static void main(String[] args) {
            List<Kitap> tizim = new ArrayList<>();
            tizim.add(new Kitap("Ulpan", "Musrepov"));
            tizim.add(new Kitap("Kochpendiler", "Esenberlin"));
            tizim.add(new Kitap("Qan men ter", "Nurpeiisov"));
            tizim.add(new Kitap("Abai joly", "Auezov"));

            Collections.sort(tizim);                       // 1-жол
            System.out.println(tizim);

            AvtorCompare ac = new AvtorCompare();
            tizim.sort(ac);                                // 2-жол
            System.out.println(tizim);
          }
        }

        Әр тұжырымды басқаларынан бөлек қарастырыңыз: тұжырымда айтылған өзгерісті бастапқы кодқа жеке енгізіңіз.

        1. Kitap класының жариялауынан «implements Comparable<Kitap>» бөлігін өшірсек (compareTo() әдісі класта қалады), 1-жол компиляцияланбайды, себебі Collections.sort(tizim) тек Comparable интерфейсін іске асыратын (implements) элементтердің тізімін қабылдайды. (5 ұпай)
        2. 2-жол орындалғанда кітаптарды салыстыру үшін Kitap класының compareTo() әдісі шақырылады, себебі Kitap Comparable интерфейсін іске асырады. (5 ұпай)
        3. Kitap класынан «implements Comparable<Kitap>» бөлігін де, compareTo() әдісін де өшіріп, 1-жолды алып тастасақ, 2-жол компиляцияланбайды, себебі тізімді сұрыптау үшін оның элементтері Comparable болуы керек. (5 ұпай)
        4. AvtorCompare жариялауындағы Comparator<Kitap> жазуын Comparator<String> деп өзгертсек (compare(Kitap bir, Kitap eki) әдісі өзгеріссіз қалады), код компиляцияланбайды, себебі салыстырғыштың (Comparator) compare() әдісі Comparator<T> жазуындағы T типті екі параметр қабылдауы керек. (5 ұпай)
        5. 1-жолдың алдына tizim.add("Ulpan"); жолын қоссақ, код компиляцияланбайды, себебі tizim — List<Kitap>, ал генериктер (generics) оған тек Kitap объектілерін салуға рұқсат береді. (4 ұпай)
    - id: J11-К-02
      text: |
        Бағдарламаны оқыңыз.

        import java.util.*;

        class Oqushy {
          private int id;
          private String aty;

          Oqushy(int id, String aty) {
            this.id = id;
            this.aty = aty;
          }

          public int getId() {
            return id;
          }

          public boolean equals(Object o) {
            Oqushy basqa = (Oqushy) o;
            return id == basqa.getId();
          }

          public int hashCode() {
            return id % 10;
          }

          public String toString() {
            return aty;
          }
        }

        public class Synyp {
          public static void main(String[] args) {
            List<Oqushy> tizim = new ArrayList<>();
            tizim.add(new Oqushy(12, "Asel"));
            tizim.add(new Oqushy(25, "Bolat"));
            tizim.add(new Oqushy(12, "Aset"));
            tizim.add(new Oqushy(22, "Dana"));
            tizim.add(new Oqushy(25, "Bolat"));

            Set<Oqushy> jiyn = new HashSet<>(tizim);
            System.out.println(tizim.size() + " " + jiyn.size());   // 1-жол

            Oqushy a = tizim.get(0);
            Oqushy b = tizim.get(2);
            Oqushy c = tizim.get(3);
            System.out.println(a == b);                              // 2-жол
            System.out.println(a.equals(b));                         // 3-жол
            System.out.println(a.hashCode() == c.hashCode());        // 4-жол
            System.out.println(jiyn.add(new Oqushy(22, "Erlan")));   // 5-жол
          }
        }

        Әр тұжырымды басқаларынан бөлек қарастырыңыз: тұжырымда айтылған өзгерісті бастапқы кодқа жеке енгізіңіз.

        1. 1-жол «5 3» шығарады, себебі HashSet жиыны (Set) қайталанатын (duplicate) объектіні — hashCode() мәні бірдей және equals() true қайтаратын объектіні — қайта қоспайды. (5 ұпай)
        2. Oqushy класынан hashCode() әдісін өшірсек (equals() қалады), 1-жол бәрібір «5 3» шығарады, себебі HashSet қайталануды тек equals() арқылы тексереді. (5 ұпай)
        3. 2-жол true шығарады, себебі a мен b-ның id мәндері бірдей (12), ал Oqushy класында equals() әдісі id бойынша қайта анықталған (overriding). (5 ұпай)
        4. 4-жол true шығарады, бірақ бұдан a мен c тең деген қорытынды шықпайды: a.equals(c) false қайтарады, сондықтан jiyn жиынында олар екі бөлек элемент. (5 ұпай)
        5. 5-жол true шығарады, себебі «Erlan» есімді оқушы jiyn жиынында жоқ. (4 ұпай)
    - id: J11-К-03
      text: |
        Бағдарламаны оқыңыз.

        import java.util.*;

        interface Kolik {
          void jur();
        }

        class Avtobus implements Kolik {
          public void jur() {
            System.out.println("avtobus jurdi");
          }
        }

        class Poiyz implements Kolik {
          public void jur() {
            System.out.println("poiyz jurdi");
          }
        }

        public class Parking {
          public static void main(String[] args) {
            new Parking().go();
          }

          public void go() {
            List<Avtobus> avtobustar = new ArrayList<>();
            avtobustar.add(new Avtobus());
            avtobustar.add(new Avtobus());
            tekser(avtobustar);                                    // 1-жол
            List<Avtobus> dayar = tazala(avtobustar);              // 2-жол
            System.out.println(dayar.size());
          }

          public void tekser(List<? extends Kolik> kolikter) {     // 3-жол
            for (Kolik k : kolikter) {
              k.jur();                                             // 4-жол
            }
          }

          public <T extends Kolik> List<T> tazala(List<T> tizim) { // 5-жол
            List<T> natije = new ArrayList<>();
            for (T k : tizim) {
              natije.add(k);
            }
            return natije;
          }
        }

        Әр тұжырымды басқаларынан бөлек қарастырыңыз: тұжырымда айтылған өзгерісті бастапқы кодқа жеке енгізіңіз.

        1. 3-жолдағы параметрді List<Kolik> kolikter деп өзгертсек, 1-жол компиляцияланады, себебі Avtobus Kolik интерфейсін іске асырады (implements), яғни Avtobus IS-A Kolik. (5 ұпай)
        2. tekser() әдісінің соңына kolikter.add(new Avtobus()); жолын қоссақ, код компиляцияланады, себебі 1-жолда tekser()-ге шынымен Avtobus тізімі беріледі. (5 ұпай)
        3. 2-жол компиляцияланады, себебі tazala(avtobustar) шақыруында T = Avtobus болады, сондықтан әдіс List<Avtobus> қайтарады. (5 ұпай)
        4. Kolik — класс емес, интерфейс, сондықтан 5-жолда <T extends Kolik> орнына <T implements Kolik> деп жазу керек; қазіргі түрінде 5-жол компиляцияланбайды. (5 ұпай)
        5. 4-жол компиляцияланады, себебі қойылмалы таңбасы (wildcard) бар тізімнің элементтерін Kolik ретінде оқып, олардың әдістерін шақыруға болады; бағдарлама «avtobus jurdi» жолын екі рет, содан кейін 2 шығарады. (4 ұпай)
  functional:
    heading: ФУНКЦИОНАЛДЫҚ ДЕҢГЕЙ (32 ұпай)
    points: 32
    instructions: |
      Бағдарламаның орындалуын қадамдап бақылаңыз (trace). Кестенің әр жолы — main әдісінің бір операторы (statement); main осы 8 жолдан тұрады. Әр жол орындалғаннан КЕЙІНГІ жағдайды жазыңыз: «Коллекция мазмұны» бағанына — коллекциялардың мазмұнын, «Шығыс немесе нәтиже» бағанына — экранға шыққан мәтінді немесе әдістің қайтарған мәнін. Әр жол — 4 ұпай (2 + 2).
      Белгілеулер: «Коллекция мазмұны» бағанына жол орындалғаннан кейінгі әр коллекцияның толық мазмұнын жазыңыз: tizim: [Asel, Bolat]. List (тізім) пен TreeSet үшін рет маңызды — элементтерді println шығаратын ретпен жазыңыз; сөздік (Map): {Asel=5, Bolat=3}. HashSet пен HashMap үшін рет кепілдендірілмейді — элементтерді кез келген ретпен жазып, «(ретсіз)» деп белгілеңіз. Бос коллекция — «бос», өзгермесе — «өзгеріссіз». compareTo()/compare() нәтижесі үшін тек таңбасын жазыңыз: «< 0», «0», «> 0». Әдіс мән қайтарса (add, put, get, size), «Шығыс немесе нәтиже» бағанына сол мәнді, println болса — шыққан мәтінді жазыңыз.
      Қосымша: бірнеше коллекция болса, оларды «; » арқылы жазыңыз: tizim: [Asel]; sozdik: {Asel=5}; бір коллекция өзгерсе, ұяшықты толық (барлық коллекциямен) қайта жазыңыз. Объектілер toString() әдісі қайтаратын түрде жазылады. Жол ештеңе шығармаса және мән қайтармаса (жариялау, sort) — «—». Жолда бағдарлама ерекше жағдаймен (exception) тоқтаса — «бағдарлама тоқтайды: ЕрекшеЖағдайдыңАты».
