levels:
  cognitive:
    heading: КОГНИТИВТІК ДЕҢГЕЙ (24 ұпай)
    points: 24
    instructions: |
      Студентке нұсқаулық.
      Әр сұраққа фрагмент берілген: Docker командалары және олардың шығысы
      (шығыс қысқартылуы мүмкін) және бастапқы күйдің сипаттамасы. Фрагменттен
      кейін осы фрагмент туралы 5 тұжырым берілген.
      Әр тұжырымға «дұрыс» немесе «дұрыс емес» деп жазып, жауабыңызды
      негіздеңіз: мұнда Docker-дің қандай ережесі әрекет етеді және фрагменттегі
      нақты не соны көрсетеді. Дұрыс емес тұжырым үшін шын мәнінде қалай
      болатынын айтыңыз.
      Бағалау: 1–4 тұжырымдар — әрқайсысы 5 ұпай («дұрыс/дұрыс емес» үшін
      1 ұпай, негіздеме үшін 4 ұпай); 5-тұжырым — 4 ұпай (1 + 3).
      Негіздемесіз «дұрыс/дұрыс емес» жауабы тек 1 ұпаймен бағаланады.
      Сұрақ бойынша барлығы — 24 ұпай.
    questions:
    - id: D02-К-01
      text: |
        Фрагмент.
        Компьютерге Docker орнатылған. Жергілікті образдар кэшінде (image cache)
        kz/greet:v3 образы жоқ. Терминалда бір команда қатарынан екі рет
        орындалды. Образдағы қолданба — қысқа скрипт: ол мәтін басып шығарады да,
        аяқталады.

        Бірінші іске қосу:
        > docker run kz/greet:v3
        Unable to find image 'kz/greet:v3' locally
        v3: Pulling from kz/greet
        4f4fb700ef54: Pull complete
        Digest: sha256:9b1e...
        Status: Downloaded newer image for kz/greet:v3
        ---------------------
        Greetings from kz/greet v3!
        My name is:
        7c1e0a9b42d1
        I'm running on:
        Linux 6.6.32 x86_64
        My address is:
        172.17.0.2

        Екінші іске қосу:
        > docker run kz/greet:v3
        ---------------------
        Greetings from kz/greet v3!
        My name is:
        e58b13f06a2c
        I'm running on:
        Linux 6.6.32 x86_64
        My address is:
        172.17.0.2

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. Екінші іске қосуда жүктеп алу (pull) туралы жолдар жоқ, себебі Docker
           kz/greet:v3 образын (image) жергілікті образдар кэшінен тауып, оны
           қайта пайдаланды.                                              (5 ұпай)
        2. Екінші іске қосудағы IP-мекенжай біріншісімен сәйкес келді, демек,
           екінші docker run командасы біріншідегі сол контейнерді (container)
           қайта іске қосты.                                              (5 ұпай)
        3. Образды жүктеп алатын және контейнерді құратын — команда терілген
           docker бағдарламасының өзі (командалық жол интерфейсі, CLI); бұл үшін
           Docker Engine қажет емес.                                      (5 ұпай)
        4. «My name is: 7c1e0a9b42d1» жолы — бірінші контейнер ішіндегі компьютер
           атауы (hostname); Docker оны контейнер ID-інен алады, сондықтан бұл
           контейнерге docker container ... командаларында ID-дің алғашқы
           таңбалары арқылы, мысалы 7c1 деп, жүгінуге болады.              (5 ұпай)
        5. Осы екі командадан кейін компьютерде бір kz/greet:v3 образы және одан
           құрылған екі контейнер бар.                                    (4 ұпай)
    - id: D02-К-02
      text: |
        Фрагмент.
        Docker орнатылған компьютер жергілікті желіге қосылған, оның IP-мекенжайы
        — 192.168.1.20. kz/site:v1 образында контейнер ішінде 80-портты
        тыңдайтын веб-сервер бар. Компьютерде басқа контейнерлер жоқ. Мына
        командалар орындалды (шығыс қысқартылған):

        > docker container run --detach --publish 8181:80 kz/site:v1
        b7e20c41d9aa5f0c3e...
        > docker container ls
        CONTAINER ID   IMAGE        COMMAND              STATUS         PORTS
        b7e20c41d9aa   kz/site:v1   "httpd-foreground"   Up 5 seconds   0.0.0.0:8181->80/tcp

        Docker контейнерге 172.17.0.2 виртуалды IP-мекенжайын берді.

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. Сол жергілікті желідегі басқа компьютерден сайт бетін
           http://192.168.1.20:8181 мекенжайы бойынша ашуға болады.        (5 ұпай)
        2. Сол жергілікті желідегі басқа компьютерден бетті тікелей
           http://172.17.0.2:80 мекенжайы бойынша да ашуға болады, өйткені
           контейнердің өз IP-мекенжайы бар.                              (5 ұпай)
        3. --detach жалаушасы веб-сервер сұрауларды қабылдауы үшін қажет: онсыз
           контейнердегі сервер 80-портты тыңдамас еді.                   (5 ұпай)
        4. Енді
           docker container run --detach --publish 8182:80 kz/site:v1
           орындалса, ондағы сервер де 80-портты тыңдайтынына қарамастан,
           екінші контейнер іске қосылады.                                (5 ұпай)
        5. Виртуалды машина (VM) сияқты, kz/site:v1 контейнерінің өз операциялық
           жүйесі бар, сондықтан әр жаңа контейнерге гигабайттаған жад
           қажет.                                                         (4 ұпай)
    - id: D02-К-03
      text: |
        Фрагмент.
        Intel (x86_64) процессоры бар Linux-сервер. Барлық kz/... образдары Intel
        процессоры бар Linux үшін құрастырылған. Мына команда орындалды (шығыс
        қысқартылған):

        > docker container ls --all
        CONTAINER ID   IMAGE          COMMAND               STATUS                      PORTS
        e41c09b7aa10   kz/site:v1     "httpd-foreground"    Up 2 hours                  0.0.0.0:8090->80/tcp
        93fd5d2b8c41   kz/tools:v2    "/bin/sh"             Exited (0) 10 minutes ago
        2a06c7f1e3b5   kz/report:v1   "python report.py"    Exited (1) 1 hour ago

        Тапсырма. Дұрыс па, дұрыс емес пе және неге?
        1. docker container ls командасы (--all-сыз) тек e41c09b7aa10
           контейнерін көрсетеді.                                         (5 ұпай)
        2. 93fd... және 2a06... контейнерлері аяқталды, сондықтан Docker олардың
           файлдық жүйелерін дискіден жойып жіберді: олардан осы тізімдегі
           жолдар ғана қалды.                                             (5 ұпай)
        3. 2a06... контейнері қатемен аяқталды, бірақ docker container logs 2a06
           командасымен қолданбаның қатеге дейін не шығарғанын көруге
           болады.                                                        (5 ұпай)
        4. kz/report:v1 образы Windows Server-де Windows-контейнерлер режимінде
           де өзгеріссіз іске қосылады, себебі Docker кез келген ОЖ-де бірдей
           жұмыс істейді.                                                 (5 ұпай)
        5. 93fd... контейнерін --force жалаушасынсыз docker container rm 93fd
           командасымен жоюға болады, себебі ол жұмыс істеп тұрған жоқ.    (4 ұпай)
  functional:
    heading: ФУНКЦИОНАЛДЫҚ ДЕҢГЕЙ (32 ұпай)
    points: 32
    instructions: |
      Нұсқаулық. Docker-дің 8 командасынан (әрекетінен) тұратын тізбек және
      компьютердің бастапқы күйі берілген. Командалар қатаң ретпен орындалады,
      әрқайсысы алдыңғысы аяқталғаннан кейін. Кестенің бірінші бағаны толтырылған.
      Әр жол үшін қалған екі бағанды толтырыңыз:
        - «Командадан кейінгі күй» — жергілікті кэште (local cache) қандай образдар
          (images) бар, қандай контейнерлер (containers) бар және қандай күйде,
          қандай файлдар пайда болды немесе өзгерді;
        - «Шығыс немесе нәтиже» — пайдаланушы терминалда немесе браузерде не көреді
          (сөзбен; хабарламалардың нақты мәтіні, уақыт, өлшемдер талап етілмейді).
      Белгілеу: контейнер `3fa1: Up` / `3fa1: Exited (0)` / `3fa1: жойылды`;
      образ `kz/hello:v1`. Контейнерді оның ID-інің алғашқы таңбаларымен белгілеуге
      болады. Күй өзгермесе, «өзгеріссіз» деп жазып, нақты не қалғанын көрсетіңіз.
      Бағалау: 8 жол, әрқайсысы 4 ұпай (күй бағаны — 2 ұпай, нәтиже бағаны —
      2 ұпай). Барлығы 32 ұпай. Жауабыңызды ауызша түсіндіріңіз.
    questions:
    - id: D02-Ф-01
      text: |
        Бастапқы күй:
        - жергілікті образдар кэшінде (image cache) тек kz/hello:v1 образы бар;
          kz/hello:v2 образы компьютерде жоқ, бірақ ол Docker Hub-та жарияланған;
        - компьютерде контейнерлер жоқ;
        - екі образда да «Hello from v1» (немесе «Hello from v2») жолын және машина
          атын (hostname) шығарып, содан кейін аяқталатын скрипт бар.

        Docker контейнерлерге мына ID-лерді берді (құрылу реті бойынша):
        1-команда — 3fa1c08e52d7, 2-команда — 7c02b9e4a113, 3-команда — 9e5bd7a06f48.

        Командалар:
        docker run kz/hello:v1
        docker run kz/hello:v2
        docker run kz/hello:v2
        docker container ls
        docker container ls --all
        docker container logs 7c
        docker container rm --force $(docker container ls --all --quiet)
        docker run kz/hello:v2

        Тапсырма: кестені толтырыңыз.

        | № | Команда                                                           | Командадан кейінгі күй | Шығыс немесе нәтиже |
        |---|-------------------------------------------------------------------|------------------------|---------------------|
        | 1 | docker run kz/hello:v1                                            |                        |                     |
        | 2 | docker run kz/hello:v2                                            |                        |                     |
        | 3 | docker run kz/hello:v2                                            |                        |                     |
        | 4 | docker container ls                                               |                        |                     |
        | 5 | docker container ls --all                                         |                        |                     |
        | 6 | docker container logs 7c                                          |                        |                     |
        | 7 | docker container rm --force $(docker container ls --all --quiet)  |                        |                     |
        | 8 | docker run kz/hello:v2                                            |                        |                     |

        Ұпай: 32 (8 жол × 4).
    - id: D02-Ф-02
      text: |
        Бастапқы күй:
        - жергілікті кэште kz/shell:v1 образы бар; одан контейнер іске қосылғанда
          /bin/sh командалық қабықшасы (shell) басталады (Linux);
        - компьютерде контейнерлер жоқ;
        - компьютердің екі терминалы ашық: Т1 және Т2.

        1-жолда құрылған контейнерге Docker b7e2c91d04aa ID-ін берді.
        2, 3 және 7-жолдар Т1-ге 1-жолдан кейін енгізіледі (яғни Т1 қосылған орынның
        ішінде). Барлық командалар қатесіз орындалады.

        Тапсырма: кестені толтырыңыз.

        | № | Қайда | Команда                                     | Командадан кейінгі күй | Шығыс немесе нәтиже |
        |---|-------|---------------------------------------------|------------------------|---------------------|
        | 1 | Т1    | docker run --interactive --tty kz/shell:v1  |                        |                     |
        | 2 | Т1    | hostname                                    |                        |                     |
        | 3 | Т1    | echo "Salem" > /tmp/note.txt                |                        |                     |
        | 4 | Т2    | docker container ls                         |                        |                     |
        | 5 | Т2    | docker container top b7                     |                        |                     |
        | 6 | Т2    | docker container logs b7                    |                        |                     |
        | 7 | Т1    | exit                                        |                        |                     |
        | 8 | Т2    | docker container ls --all                   |                        |                     |

        Ұпай: 32 (8 жол × 4).
    - id: D02-Ф-03
      text: |
        Бастапқы күй:
        - жергілікті кэште kz/site:v1 образы бар — контейнер ішінде 80-портты
          тыңдайтын және «Welcome to Astana» мәтіні бар
          /usr/local/apache2/htdocs/index.html файлын беретін веб-сервер;
        - контейнерлер жоқ; компьютерде 80 және 5000 порттарын ешбір бағдарлама
          тыңдамайды;
        - компьютердің ағымдағы каталогында «Жаңа бет» мәтіні бар index.html файлы бар.

        docker container cp <файл> <контейнер ID>:<жол> командасы файлды компьютерден
        контейнердің файлдық жүйесіне (filesystem) көшіреді.
        Docker контейнерлерге ID берді: 1-жол — 4d9a6e0b1f22, 8-жол — e31c57a2d880.

        Тапсырма: кестені толтырыңыз.

        | № | Команда немесе әрекет                                                              | Командадан кейінгі күй | Шығыс немесе нәтиже |
        |---|------------------------------------------------------------------------------------|------------------------|---------------------|
        | 1 | docker container run --detach --publish 5000:80 kz/site:v1                         |                        |                     |
        | 2 | docker container ls                                                                |                        |                     |
        | 3 | браузерде http://localhost:5000 ашу                                                |                        |                     |
        | 4 | браузерде http://localhost:80 ашу                                                  |                        |                     |
        | 5 | docker container cp index.html 4d:/usr/local/apache2/htdocs/index.html             |                        |                     |
        | 6 | браузерде http://localhost:5000 ашу                                                |                        |                     |
        | 7 | docker container rm --force 4d                                                     |                        |                     |
        | 8 | docker container run --detach --publish 5000:80 kz/site:v1,                        |                        |                     |
        |   | содан кейін браузерде http://localhost:5000 ашу                                    |                        |                     |

        Ұпай: 32 (8 жол × 4).
  systemic:
    heading: ЖҮЙЕЛІК ДЕҢГЕЙ (44 ұпай)
    points: 44
    instructions: |
      2-тарау (1-тараумен бірге). Тексеру сценарийлері.

      Нұсқаулық. Әр сұрақта фрагмент берілген — Docker командаларының тізбегі және
      компьютердің бастапқы күйінің сипаттамасы. 4 тексеру сценарийін (тест-кейс
      сияқты) ойлап табыңыз және оларды кестеге жазыңыз:

      | № | Бастапқы шарт немесе әрекет | Күтілетін нәтиже | Сценарий нені тексереді |
      |---|-----------------------------|------------------|-------------------------|

      - Бастапқы шарт немесе әрекет — нақты не істейсіз немесе не бересіз: ?
        белгілерінің орнындағы мәндер, қандай контейнерлер бар және қандай күйде,
        қандай файл қайда көшіріледі, кейін қандай команда орындалады.
      - Күтілетін нәтиже — Docker не көрсетеді (docker container ls ішіндегі
        контейнер күйі, қате, қандай контейнерлер мен образдар қалады) немесе
        қолданба не көрсетеді (браузерде не ашылады).
      - Сценарий нені тексереді — Docker-дің қай ережесі немесе фрагменттің қай
        тұжырымы расталады не теріске шығарылады.
      Сценарийлер әртүрлі нәтиже беруі керек. Контейнер ID-лерін, уақытты және
      Docker хабарламаларының нақты мәтінін жазудың қажеті жоқ: нәтижені сөзбен
      сипаттау жеткілікті (мысалы: «қате: хост порты бос емес», «контейнер
      Exited (0)»).

      Бағалау: 4 сценарий, әрқайсысы 8 ұпай (бастапқы шарт — 2, күтілетін нәтиже —
      3, нені тексереді — 3) = 32 ұпай + емтихан алушыға сценарийлерді қорғау —
      12 ұпай. Барлығы 44 ұпай.
    questions:
    - id: D02-С-01
      text: |
        Фрагмент. Контейнерде жұмыс істейтін веб-сайттың портын жариялау.

        kz/site:v1 образы (image) жергілікті образдар кэшінде (image cache) бар.
        Онда контейнер ішінде 80-портты тыңдайтын және «Сайт v1» мәтіні бар бетті
        беретін веб-сервер бар. Сервер контейнер жойылғанша жұмыс істейді.

        Компьютердің бастапқы күйі: мына командамен іске қосылған бір контейнер
        жұмыс істеп тұр (Up):
            docker container run --detach --publish 8080:80 kz/site:v1
        Басқа контейнерлер жоқ. Компьютердің қалған порттары бос.

        Тексерілетін тізбек (? белгілері — өзіңіз таңдайтын мәндер):
            docker container run ? --publish ?:? kz/site:v1
            docker container ls
            браузерде: http://localhost:?

        Бірінші ? орнында --detach жалаушасы тұруы мүмкін немесе ештеңе тұрмауы мүмкін.

        Тапсырма. Осы тізбекті тексеретін, ? мәндері мен нәтижелері әртүрлі 4
        сценарий ойлап табыңыз: сәтті іске қосу және сайт ашылмайтын немесе команда
        қатемен аяқталатын жағдайлар. Әр сценарий үшін бастапқы шартты (? мәндері),
        күтілетін нәтижені (docker container run не шығарады, docker container ls
        ішіндегі күй мен PORTS бағаны, браузер не көрсетеді) және сценарий нені
        тексеретінін көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
    - id: D02-С-02
      text: |
        Фрагмент. Контейнердегі сайттың басты бетін ауыстыру (2-тараудың
        зертханалық жұмысы негізінде).

        kz/site:v1 образы жергілікті кэште бар. Ондағы веб-сервер контейнердің
        файлдық жүйесіндегі /usr/local/apache2/htdocs каталогынан файлдарды береді;
        басты бет — «Сайт v1» мәтіні бар index.html файлы. Контейнерлер жоқ,
        компьютердің 7070 және 7071 порттары бос. Компьютердің ағымдағы каталогында
        «Акция!» мәтіні бар index.html файлы жатыр.

        Кеңес: мына команда
            docker container cp <файл> <контейнер ID>:<контейнердегі жол>
        файлды компьютерден контейнердің файлдық жүйесіне көшіреді.

        Әріптес «Сайттың басты бетін қалай ауыстыру керек» нұсқаулығын жазды:
            1) docker container run --detach --publish 7070:80 kz/site:v1
               (Docker контейнер ID-ін шығарады, мысалы 4e1...)
            2) docker container cp index.html 4e1:/usr/local/apache2/htdocs/index.html
            3) http://localhost:7070 ашу — «Акция!» көрсетіледі.
            4) Енді жаңа бет — сайттың бөлігі: контейнерді жойып
               (docker container rm --force 4e1), 1-қадамды қайта орындасаңыз,
               сайт бірден «Акция!» көрсетеді.

        Тапсырма. Осы нұсқаулықтың дұрыстығын тексеретін 4 сценарий ойлап табыңыз.
        Өзгертуге болады: cp командасындағы мақсатты жол, контейнерлер саны және
        олардың порттары, контейнерді жою және қайта іске қосу, браузердегі мекенжай.
        Әр сценарий үшін бастапқы шартты немесе әрекетті, күтілетін нәтижені
        (браузер не көрсетеді, команда орындала ма) және сценарий нені тексеретінін
        көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
    - id: D02-С-03
      text: |
        Фрагмент. Сабақ соңындағы тазалау скрипті.

        Студент скрипт жазды. Оның мақсаты: «компьютерден барлық контейнерлерді —
        жұмыс істеп тұрғандарын да, тоқтатылғандарын да — және барлық kz/...
        образдарын жою»:
            docker container rm --force $(docker container ls --quiet)
            docker image rm -f $(docker image ls -f reference='kz/*' -q)

        Командалар кезекпен орындалады; бірінші команда қатемен аяқталса да, екіншісі
        орындалады.

        Жергілікті кэште мына образдар бар:
            kz/site:v1   — веб-сервер, контейнер жойылғанша жұмыс істейді;
            kz/hello:v1  — сәлемдесу мәтінін шығарып, бірден аяқталады;
            kz/hello:v2  — сәлемдесу мәтінін шығарып, бірден аяқталады;
            py/tools:v1  — фондық процесс, контейнер жойылғанша жұмыс істейді.
        Скрипт іске қосылар алдында қандай контейнерлер бар екенін өзіңіз бересіз
        (осы образдармен docker container run командалары арқылы): қайсысы жұмыс
        істеп тұр (Up), қайсысы тоқтатылған (Exited), немесе контейнерлер мүлде жоқ.

        Тапсырма. Скрипт өз мақсатына жете ме — соны тексеретін 4 сценарий ойлап
        табыңыз. Әр сценарий үшін бастапқы күйді (қандай контейнерлер бар және
        қандай күйде), күтілетін нәтижені (скрипттен кейін docker container ls --all
        және docker image ls не көрсетеді, қателер бола ма) және сценарий нені
        тексеретінін көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
