  systemic:
    heading: СИСТЕМНЫЙ УРОВЕНЬ (44 балла)
    points: 44
    instructions: |
      Дан фрагмент кода с функцией. Значения, помеченные «?», — входные данные теста (input). Придумайте 4 ТЕСТА. Для каждого теста запишите:
      1. входные данные — что подставляется вместо «?»;
      2. ожидаемый результат (expected result) — что функция должна вернуть по требованию (requirement), записанному под кодом;
      3. что проверяет тест — какой путь выполнения (path), какую границу (boundary) или какой особый случай.

      Тесты должны проверять разные случаи. Если вы нашли тест, на котором код не выполняет требование, отметьте его и объясните, что код вернёт или сделает на самом деле.
      Баллы: каждый тест — 8 (входные данные 2 + ожидаемый результат 3 + что проверяет 3), защита (defense) — 12. Всего 44.
      Результаты записывайте как в FSI: Ok …, Error "…", список [1; 2], массив [|("A", 300M)|], число 35. Если код вместо результата завершается исключением (exception), напишите «исключение» и его причину.
    questions:
    - id: F10-С-01
      text: |
        open System
        open FsToolkit.ErrorHandling

        type Maker = Maker of string
        type Strings = Four | Five | Six
        type Pickup = Precision | Jazz
        type Body =
            | Acoustic
            | Electric of Pickup list
        type Bass = { Maker : Maker; Strings : Strings; Body : Body }

        // «Сырые» данные из JSON: только примитивы
        type RawBass = { Maker: string; Strings: string; Pickups: string list }

        let tryAsBass (raw: RawBass) = result {
            let! maker =
                if String.IsNullOrEmpty raw.Maker then
                    Error "Maker is mandatory"
                else
                    Ok (Maker raw.Maker)

            let! strings =
                match raw.Strings with
                | "4" -> Ok Four
                | "5" -> Ok Five
                | "6" -> Ok Six
                | value -> Error $"Bad strings '{value}'"

            let! pickups =
                raw.Pickups
                |> List.traverseResultM (fun code ->
                    match code with
                    | "P" -> Ok Precision
                    | "J" -> Ok Jazz
                    | value -> Error $"Bad pickup {value}")

            return
                {
                    Bass.Maker = maker
                    Bass.Strings = strings
                    Bass.Body =
                        match pickups with
                        | [] -> Acoustic
                        | pickups -> Electric pickups
                }
        }

        tryAsBass { Maker = ?; Strings = ?; Pickups = ? }    // три ? — поля сырых данных

        Требование: функция tryAsBass проверяет сырые данные (RawBass) и возвращает Result<Bass, string>.
        - Марка (Maker) обязательна: null, пустая строка "" и строка только из пробелов (например "   ") означают «марки нет» -> Error "Maker is mandatory".
        - Число струн (Strings): "4", "5", "6" -> Four, Five, Six; любое другое значение -> Error "Bad strings '<значение>'".
        - Коды звукоснимателей (Pickups): "P" -> Precision, "J" -> Jazz; неверный код -> Error "Bad pickup <код>" для ПЕРВОГО неверного кода списка.
        - Пустой список звукоснимателей -> Body = Acoustic; непустой -> Electric со звукоснимателями в том же порядке.
        - Если ошибок несколько, возвращается первая в порядке проверки: марка, струны, звукосниматели.
        - Если всё верно -> Ok { Maker = Maker "<марка>"; Strings = …; Body = … }.
        Справка: в result { } (глава 9) let! x = … при Error сразу возвращает эту Error из всего выражения, следующие строки не выполняются. List.traverseResultM f список — применяет f к каждому элементу: если все результаты Ok, даёт Ok со списком значений, иначе — первую встретившуюся Error. String.IsNullOrEmpty s — true, только если s = null или s = "".

        Тест 1
          Входные данные (?): ____________________________________________
          Ожидаемый результат: ___________________________________________
          Что проверяет: _________________________________________________

        Тест 2
          Входные данные (?): ____________________________________________
          Ожидаемый результат: ___________________________________________
          Что проверяет: _________________________________________________

        Тест 3
