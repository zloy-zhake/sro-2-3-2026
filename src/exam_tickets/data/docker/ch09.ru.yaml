        {
          "metrics-addr": "0.0.0.0:9323"
        }

        Образы уже есть на компьютере:
        - kz/tickets-web:v1 — сайт продажи билетов (Flask и prometheus_client),
          слушает порт 5000, его метрика tickets_sold_total — число проданных
          билетов;
        - kz/tickets-prometheus:v1 — Prometheus, настроен собирать метрики
          сервиса tickets-web и Docker Engine этого компьютера (порт 9323);
          веб-интерфейс — порт 9090.
        Каталог /home/student/tickets-grafana содержит файлы Dockerfile,
