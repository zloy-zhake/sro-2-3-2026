        Файл Dockerfile:

        FROM grafana/grafana:11.2.0

        COPY datasource-prometheus.yaml ${GF_PATHS_PROVISIONING}/datasources/
        COPY dashboard-provider.yaml ${GF_PATHS_PROVISIONING}/dashboards/
        COPY tickets-dashboard.json /var/lib/grafana/dashboards/

        Файл datasource-prometheus.yaml:

        apiVersion: 1

        datasources:
          - name: Prometheus
            type: prometheus
            # запросы к Prometheus отправляет сервер Grafana из своего контейнера
            access: proxy
            url: http://prometheus:9090
            isDefault: true

        Файл docker-compose.yml:

        services:
          tickets-web:
            image: kz/tickets-web:v1
            ports:
              - "8090:5000"

          prometheus:
            image: kz/tickets-prometheus:v1
            ports:
              - "9090:9090"

          grafana:
            image: kz/tickets-grafana:v1
            ports:
