    - id: F05-С-03
      text: |
        open System

        // Разбирает строку с количеством билетов в заказе
        let parseTickets (text:string) =
            let parsed, count = Int32.TryParse text
            if not parsed then
                false, "не число"
            elif count > 10 then
                false, "больше 10 билетов"
            else
                true, $"билетов: {count}"

        Справка: Int32.TryParse в F# возвращает кортеж (tuple) bool * int. Если строка — целое число (например, "42" или "-5"), результат (true, 42) / (true, -5); иначе (например, "abc", "", "2.5") — (false, 0). В тестах используйте строки без пробелов.

        Требование (requirement): функция parseTickets получает текст, введённый покупателем, и возвращает кортеж (успех, сообщение):
        - текст не является целым числом — (false, "не число");
        - число больше 10 — (false, "больше 10 билетов");
        - число меньше 1 (0 или отрицательное) — (false, "меньше 1 билета");
        - число от 1 до 10 включительно — (true, "билетов: N"), где N — это число.

        Входные данные теста — строка, например parseTickets "3".

