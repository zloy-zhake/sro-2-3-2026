levels:
  cognitive:
    heading: КОГНИТИВНЫЙ УРОВЕНЬ (24 балла)
    points: 24
    instructions: |
      Инструкция для студента.
      К каждому вопросу дан фрагмент: Dockerfile, файл Docker Compose
      (docker-compose.yml), конфигурация Prometheus (prometheus.yml) или
      Grafana, код приложения на Python, вывод конечной точки (endpoint)
      /metrics, описание образов и исходного состояния, команды Docker и
      Docker Compose. После фрагмента даны 5 утверждений об этом фрагменте.
      Все команды выполняются на компьютере с Linux; Docker Compose встроен в
      Docker CLI (команда docker compose).
      Справка (того, что ниже, нет в книге или оно изменилось в современных
      версиях):
      - в Python-приложениях метрики (metrics) собирает клиентская
        библиотека prometheus_client:
        Counter(имя, описание, [метки]) — счётчик (counter); у него есть
        только метод inc(n) (n >= 0, по умолчанию 1);
        Gauge(имя, описание) — датчик (gauge); у него есть методы inc(),
        dec() и set(значение);
        .labels(code="200") выбирает серию с этим значением метки (label);
        generate_latest() возвращает текст всех метрик в формате Prometheus
        для конечной точки /metrics; значения печатаются как дробные числа
        (например, 9.0);
      - библиотека prometheus_client сама добавляет метрики среды выполнения
        (runtime) Python, например process_resident_memory_bytes — память,
        которую занимает процесс приложения;
      - к каждой серии, собранной с цели (target), Prometheus добавляет
        метки job (значение job_name из prometheus.yml) и instance (адрес
        цели в виде хост:порт);
      - dns_sd_configs повторяет DNS-запрос периодически (по умолчанию
        каждые 30 секунд);
      - в Prometheus 3.x страница Graph называется Query, а пункт меню
        Status → Targets — Status → Target health;
      - в официальном образе Grafana переменная окружения
        GF_PATHS_PROVISIONING равна /etc/grafana/provisioning.
      Для каждого утверждения напишите «верно» или «неверно» и обоснуйте ответ:
      какое правило Docker, Docker Compose, Prometheus или Grafana здесь
      действует и что именно во фрагменте это показывает. Для неверного
      утверждения скажите, как обстоит дело на самом деле.
      Оценка: утверждения 1–4 — по 5 баллов (1 балл за «верно/неверно»,
      4 балла за обоснование); утверждение 5 — 4 балла (1 + 3).
      Ответ «верно/неверно» без обоснования оценивается только 1 баллом.
      Итого за вопрос — 24 балла.
    questions:
    - id: D09-К-01
      text: |
        Фрагмент.
        Компьютер с Linux и Docker. Каталог /home/student/tickets-web содержит
        файлы app.py и Dockerfile.

        Файл app.py:

        import time
        from flask import Flask, Response, request
        from prometheus_client import Counter, Gauge, generate_latest, CONTENT_TYPE_LATEST

        app = Flask(__name__)

        # собственные метрики приложения
        tickets_sold = Counter("tickets_sold_total", "Tickets sold")
        buy_requests = Counter("buy_requests_total", "Requests to /buy", ["code"])
        buy_in_flight = Gauge("buy_in_flight", "Requests to /buy in progress")


        @app.route("/buy")
        def buy():
            buy_in_flight.inc()
            try:
                count = int(request.args.get("count", "1"))
                if count > 5:
                    buy_requests.labels(code="400").inc()
                    return "too many tickets\n", 400
                time.sleep(3)  # имитация оплаты
                tickets_sold.inc(count)
                buy_requests.labels(code="200").inc()
                return "ok\n"
            finally:
                buy_in_flight.dec()


        @app.route("/metrics")
        def metrics():
            return Response(generate_latest(), content_type=CONTENT_TYPE_LATEST)


        app.run(host="0.0.0.0", port=5000)

        Файл Dockerfile:

        FROM python:3.12-slim
        WORKDIR /app
        RUN pip install flask prometheus_client
        COPY app.py .
        EXPOSE 5000
        CMD ["python", "app.py"]

        Сеть tickets-net уже создана; в ней работает контейнер Prometheus,
        который каждые 10 секунд опрашивает (scrape) адрес
        http://tickets-web:5000/metrics. В терминале хоста по порядку
        выполнены команды (все успешно):
        > cd /home/student/tickets-web
        > docker image build -t kz/tickets-web:v1 .
        > docker container run -d --name tickets-web --network tickets-net -p 8090:5000 kz/tickets-web:v1

        Затем на адрес http://localhost:8090/buy?count=N отправили несколько
        запросов (в каждом N — целое число, некоторые запросы — одновременно).
        Пока ещё один запрос к /buy обрабатывался, открыли адрес
        http://localhost:8090/metrics. Фрагмент ответа (строки *_created и
        метрики python_*, process_* опущены):

        # HELP tickets_sold_total Tickets sold
        # TYPE tickets_sold_total counter
        tickets_sold_total 9.0
        # HELP buy_requests_total Requests to /buy
        # TYPE buy_requests_total counter
        buy_requests_total{code="200"} 4.0
        buy_requests_total{code="400"} 2.0
        # HELP buy_in_flight Requests to /buy in progress
        # TYPE buy_in_flight gauge
        buy_in_flight 1.0

        Каждое утверждение рассматривайте отдельно, начиная с этого состояния.

        Задание. Верно или неверно и почему?
        1. Метка code делит метрику buy_requests_total на две отдельные
           серии. К этому моменту приложение завершило 6 запросов к /buy, из
           них 2 отклонены с кодом 400; число всех завершённых запросов в
           Prometheus даёт запрос sum(buy_requests_total) without(code).
                                                                          (5 баллов)
        2. Чтобы учитывать возвраты билетов, достаточно добавить маршрут
           /refund, который вызывает tickets_sold.dec(); тогда
           tickets_sold_total будет показывать число проданных билетов за
           вычетом возвращённых.                                          (5 баллов)
        3. При каждом опросе Prometheus заменяет у себя старое значение
           tickets_sold_total новым, поэтому в Prometheus можно посмотреть
           только текущее число проданных билетов, а график продаж за день
           построить нельзя.                                              (5 баллов)
        4. После команды docker container restart tickets-web (новых запросов
           к /buy после неё не было) адрес http://localhost:8090/metrics
           покажет tickets_sold_total 0.0, а не 9.0.                      (5 баллов)
        5. buy_in_flight объявлен как Gauge, а не Counter, потому что его
           значение должно и увеличиваться (inc() в начале запроса), и
           уменьшаться (dec() в блоке finally, когда запрос завершён).    (4 балла)
    - id: D09-К-02
      text: |
        Фрагмент.
        Компьютер с Linux и Docker. Приложение продажи билетов из трёх
        сервисов (service); все образы уже есть на компьютере:
        - kz/tickets-web:v1 — сайт продажи билетов (Flask), слушает порт 5000.
          При каждой покупке он вызывает http://tickets-worker:5000/pay и
          увеличивает счётчик tickets_sold_total. Метрики отдаёт по адресу
          /metrics;
        - kz/tickets-worker:v1 — сервис оплаты (Flask), слушает порт 5000,
          маршруты /pay и /metrics; при каждой оплате увеличивает счётчик
          payments_processed_total;
        - kz/tickets-prometheus:v1 — собран из официального образа Prometheus,
          в него скопирован файл prometheus.yml (ниже) в
          /etc/prometheus/prometheus.yml; веб-интерфейс Prometheus — порт 9090.

        Файл prometheus.yml:

        global:
          scrape_interval: 15s

        scrape_configs:
          - job_name: "tickets-web"
            metrics_path: /metrics
            static_configs:
              - targets: ["tickets-web:5000"]

          - job_name: "tickets-worker"
            metrics_path: /metrics
            dns_sd_configs:
              - names:
                  - tickets-worker
                type: A
                port: 5000

        Каталог /home/student/tickets содержит файл docker-compose.yml:

        services:
          tickets-web:
            image: kz/tickets-web:v1
            ports:
              - "8090:5000"
            networks:
              - tickets-net

          tickets-worker:
            image: kz/tickets-worker:v1
            networks:
              - tickets-net

          prometheus:
            image: kz/tickets-prometheus:v1
            ports:
              - "9090:9090"
            networks:
              - tickets-net

        networks:
          tickets-net:

        Контейнеров этого приложения на компьютере ещё нет. В терминале хоста,
        в каталоге /home/student/tickets, выполнена команда (успешно):
        > docker compose up -d --scale tickets-worker=3

        После этого через сайт http://localhost:8090 покупают билеты. Каждое
        утверждение рассматривайте отдельно, начиная с этого состояния.

        Задание. Верно или неверно и почему?
        1. Через минуту после запуска на странице Status → Target health
           Prometheus будет 4 цели (target): одна в job tickets-web и три в
           job tickets-worker — по одной на каждый контейнер tickets-worker.
                                                                          (5 баллов)
        2. Если в job tickets-worker заменить dns_sd_configs на
           static_configs с targets: ["tickets-worker:5000"], пересобрать
           образ Prometheus и пересоздать его контейнер, Prometheus
           по-прежнему будет собирать метрики со всех трёх контейнеров
           tickets-worker.                                                (5 баллов)
        3. Покупатель купил билет. Через 1 секунду после покупки запрос
           tickets_sold_total в Prometheus уже покажет увеличенное значение,
