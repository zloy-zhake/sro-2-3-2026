        | 8 | docker image push reg.school.kz:5010/shop/ui:3                    |                        |                     |

        Ұпай: 32 (8 жол × 4).
  systemic:
    heading: ЖҮЙЕЛІК ДЕҢГЕЙ (44 ұпай)
    points: 44
    instructions: |
      5-тарау. Тексеру сценарийлері.

      Нұсқаулық. Әр сұрақта фрагмент берілген — Docker командаларының тізбегі, нұсқа шығару скрипті немесе Dockerfile — және бастапқы күйдің сипаттамасы: қандай компьютерлер қатысады, оларда жергілікті қандай образдар (images) бар, тіркелгіде (registry) қандай тегтер (tags) бар. 4 тексеру сценарийін (тест-кейс сияқты) ойлап табыңыз және оларды кестеге жазыңыз:

      | № | Бастапқы шарт немесе әрекет | Күтілетін нәтиже | Сценарий нені тексереді |
      |---|-----------------------------|------------------|-------------------------|

      - Бастапқы шарт немесе әрекет — нақты не істейсіз немесе не бересіз: ? белгілерінің орнындағы мәндер, командалар қай компьютерде орындалады, олардың алдында не өзгертілді (файл, тег, команда), тіркелгі контейнерімен не істелді.
      - Күтілетін нәтиже — Docker немесе қолданба не көрсетеді: тіркелгіге жіберу (push) сәтті ме — қабаттар жүктелді ме, әлде тіркелгіде «бұрыннан бар» ма; жүктеп алу (pull), жинау (build), іске қосу (run) сәтті ме; қате болса — қандай түрі (HTTP арқылы тіркелгіге рұқсат жоқ, тіркелгімен байланыс жоқ, тег табылмады); қолданба не басып шығарады (қай нұсқа іске қосылды); тіркелгіде қандай тегтер бар.
      - Сценарий нені тексереді — Docker-дің қай ережесі немесе тапсырмадағы қай тұжырым расталады не теріске шығарылады.
      Сценарийлер әртүрлі нәтиже беруі керек. ID-лерді, дайджесттерді (digest), өлшемдерді, уақытты және Docker хабарламаларының нақты мәтінін жазудың қажеті жоқ: нәтижені сөзбен сипаттау жеткілікті (мысалы: «push — қате: тіркелгімен байланыс жоқ», «shop-api 1.2.4 басып шығарады»).

      Белгілеулер. reg.school.kz:5010 тіркелгісі сіздің компьютеріңізде емес, колледждің бөлек серверінде жұмыс істейді. Тіркелгідегі тегтерді былай жазуға болады: shop/api: 1.2 → 1.2.4 (1.2 тегі 1.2.4-пен бірдей образды көрсетеді).

      Бағалау: 4 сценарий, әрқайсысы 8 ұпай (бастапқы шарт — 2, күтілетін нәтиже — 3, нені тексереді — 3) = 32 ұпай + емтихан алушыға сценарийлерді қорғау — 12 ұпай. Барлығы 44 ұпай.
    questions:
    - id: D05-С-01
      text: |
        Фрагмент. Өз тіркелгіңізді (registry) контейнерде іске қосу және оған образ жіберу.

        srv-reg сервері (IP-мекенжайы 192.168.1.50; колледж DNS-інде оған reg.school.kz атауы сәйкес келеді). Онда мына команда орындалды:
            docker container run -d --name registry -p ?:5000 --restart always registry:2

        (registry:2 образы — Docker тіркелгісінің сервері; контейнер ішінде ол сұраныстарды HTTP арқылы 5000 портында қабылдайды және образдарды контейнердің /var/lib/registry каталогында сақтайды. HTTPS бапталмаған.)

        Әзірлеушінің компьютері dev1. Docker қозғалтқышының (Docker Engine) daemon.json файлы; файлда басқа баптаулар жоқ:
            {
                "insecure-registries": [
                    "reg.school.kz:5000"
                ]
            }
        Файл сақталғаннан кейін dev1-дегі Docker қозғалтқышы қайта іске қосылды.

        dev1-дегі командалар (shop/web:v1 образы алдын ала жиналған):
            docker image tag shop/web:v1 reg.school.kz:5010/shop/web:v1
            docker image push reg.school.kz:5010/shop/web:v1

        Тестілеушінің компьютері test1 (daemon.json dev1-дегідей):
            docker image pull reg.school.kz:5010/shop/web:v1

        Әкімші былай дейді: «Тіркелгі reg.school.kz:5010 мекенжайында жұмыс істейді, бәрі бапталған: әзірлеушілер образдарды сонда жібереді, тестілеушілер оларды жүктеп алады».

        Тапсырма. Әкімшінің тұжырымын тексеретін 4 сценарий ойлап табыңыз.
        Тіркелгіні іске қосу командасындағы ? мәнін таңдауға, daemon.json файлын өзгертуге (қозғалтқышты қайта іске қосып немесе қоспай), dev1 немесе test1-де командаларды қажетті ретпен орындауға, registry контейнерімен бірдеңе істеуге (мысалы, қайта іске қосуға немесе жойып, қайтадан іске қосуға) болады. Әр сценарий үшін бастапқы шартты, күтілетін нәтижені (push немесе pull сәтті ме, қандай қабаттар жүктеледі, қандай қате) және сценарий нені тексеретінін көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
    - id: D05-С-02
      text: |
        Фрагмент. shop/api қызметінің нұсқа шығару скрипті (release script).

        Команданың тег сызбасы (жобаның README файлында жазылған):
            1.3.0   — нақты шығарылым, ешқашан өзгермейді;
            1.3     — 1.3 тармағының соңғы шығарылымы (тек қателерді түзету);
            1       — 1 тармағының соңғы шығарылымы (бұзылуларсыз жаңа мүмкіндіктер);
            latest  — ең жаңа шығарылым.

        Шығарылымға дейін reg.school.kz:5010 тіркелгісіндегі shop/api репозиторийі:

        | Тег    | Қай шығарылымды көрсетеді |
        |--------|---------------------------|
        | 1.2.3  | 1.2.3                     |
        | 1.2.4  | 1.2.4                     |
        | 1.2    | 1.2.4                     |
        | 1      | 1.2.4                     |
        | latest | 1.2.4                     |

        Жинау каталогы: Dockerfile, app.py.

        app.py файлы:
            VERSION = "1.3.0"
            print("shop-api", VERSION)

        Dockerfile файлы:
            FROM python:3.12-slim
            WORKDIR /app
            COPY app.py .
            CMD ["python", "app.py"]

        release.sh файлы (жинау серверінде орындалады):
            # 1.3.0 шығарылымы. Скрипт 1.2.4 шығарылымынан көшірілген, # нұсқа нөмірлері қолмен түзетілген.
            R=reg.school.kz:5010/shop/api
            docker image build -t $R:1.3.0 .
            docker image tag $R:1.3.0 $R:1.2
            docker image tag $R:1.3.0 $R:1
            docker image tag $R:1.3.0 $R:latest
            docker image push --all-tags $R

        Түсініктемелер: docker image push --all-tags $R тіркелгіге $R репозиторийінің барлық жергілікті тегтерін жібереді. Скрипт іске қосылар алдында жинау серверінде shop/api образдары жоқ. Скрипт қатесіз аяқталды.

        Тұтынушылардың компьютерлері (шығарылымнан кейін):
        - A — shop/api образдары жоқ;
        - B — бір апта бұрын онда
              docker image pull reg.school.kz:5010/shop/api:1
          орындалған және содан бері осы образ іске қосылып жүр.
        Тұтынушының компьютерінде мына командалар орындалады (біріншісі — міндетті емес):
            docker image pull reg.school.kz:5010/shop/api:?
            docker container run --rm reg.school.kz:5010/shop/api:?

        Басшы былай дейді: «1.3.0 шығарылымы сәтті өтті: әр тұтынушы тег сызбасы уәде еткен нәрсені алады».

        Тапсырма. Басшының тұжырымын тексеретін 4 сценарий ойлап табыңыз. Әр сценарий үшін бастапқы шартты (A немесе B компьютері, ? орнындағы тег, docker image pull орындала ма), күтілетін нәтижені (контейнер не басып шығарады немесе қандай қате; қажет болса — тіркелгідегі тег нені көрсетеді) және сценарий нені тексеретінін көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
    - id: D05-С-03
      text: |
        Фрагмент. Колледждің алтын образдары (golden images) және олардың негізіндегі қолданбаның көп кезеңді Dockerfile-ы (multi-stage Dockerfile).

        Платформа командасы екі алтын образ жинайды.

        golden-sdk/Dockerfile файлы (жинау кезеңіне арналған образ):
            FROM python:3.12
            ENV TZ=Asia/Almaty \
                GOLDEN=r1

        golden-run/Dockerfile файлы (қолданбаларды іске қосуға арналған образ):
            FROM python:3.12-slim
            ENV TZ=Asia/Almaty \
                GOLDEN=r1
            WORKDIR /app

        Жаңартуға дейін reg.school.kz:5010 тіркелгісі:
            golden/python-sdk: 3.12 және latest тегтері → r1 шығарылымы
            golden/python:     3.12 және latest тегтері → r1 шығарылымы

        report қолданбасының командасы. Жинау каталогы: Dockerfile, app.py.

        Dockerfile файлы:
            # жинау кезеңі
            FROM reg.school.kz:5010/golden/python-sdk:3.12 AS builder
            WORKDIR /src
            COPY app.py .
            RUN python -m py_compile app.py && echo "$GOLDEN" > built-with.txt

            # қорытынды образ
            FROM reg.school.kz:5010/golden/python
            WORKDIR /app
            COPY --from=builder /src/app.py /src/built-with.txt ./
            CMD ["python", "app.py"]

        app.py файлы:
            import os

            print("build:", open("built-with.txt").read().strip())
            print("run:", os.environ.get("GOLDEN", "none"))

        (app.py алтын образдың қай шығарылымында жинау өткенін — build, және қолданба қай шығарылымда жұмыс істейтінін — run басып шығарады.)

        r2 жаңартуы (қауіпсіздікті түзету). Платформа командасы алтын образдардың екі Dockerfile-ында GOLDEN=r1 мәнін GOLDEN=r2-ге ауыстырды және мынаны орындады:
            docker image build -t reg.school.kz:5010/golden/python-sdk:3.12 golden-sdk
            docker image build -t reg.school.kz:5010/golden/python:3.12 golden-run
            docker image push reg.school.kz:5010/golden/python-sdk:3.12
            docker image push reg.school.kz:5010/golden/python:3.12

        report командасының компьютерлері:
        - ci1 — CI сервері; әр жинауды жергілікті образдарсыз бастайды;
        - dev1 — әзірлеушінің компьютері; бір апта бұрын (r2-ге дейін) онда report жиналған, сондықтан жергілікті r1 шығарылымының reg.school.kz:5010/golden/python-sdk:3.12 және reg.school.kz:5010/golden/python:latest образдары бар.
        Жинау және іске қосу мына командалармен орындалады:
            docker image build -t report:1 .
            docker container run --rm report:1

        Платформа командасының басшысы былай дейді: «r2 шығарылғаннан кейін report-тың кез келген жаңа жинауы қауіпсіздік түзетуін алады».

        Тапсырма. Осы тұжырымды тексеретін 4 сценарий ойлап табыңыз. Компьютерді (ci1 немесе dev1) таңдауға, жинау алдында docker image pull командаларын орындауға, қолданба Dockerfile-ындағы FROM жолдарын өзгертуге болады. Әр сценарий үшін бастапқы шартты, күтілетін нәтижені (жинау сәтті ме, docker container run не басып шығарады) және сценарий нені тексеретінін көрсетіңіз.

        Ұпайлар: 4 сценарий × 8 = 32; қорғау — 12. Барлығы 44.
